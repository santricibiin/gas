                      </div>
                  </div>

                  <div class="flex-1">
                      <label class="md:hidden text-[9px] font-bold text-slate-400 uppercase mb-1 block">Potongan (Rp)</label>
                      <div class="relative h-[38px]">
                          <input type="text" value="${item.diskon > 0 ? formatCurrencyValue(item.diskon) : ''}" 
                                 onchange="updateDiskon(${index}, this.value)" 
                                 oninput="formatCurrencyInput(this)"
                                 class="w-full h-full border border-gray-200 rounded-lg px-3 text-right text-sm font-bold outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200 placeholder:text-gray-300 text-rose-500 bg-white shadow-sm" 
                                 placeholder="0">
                      </div>
                  </div>
              </div>

              <div class="w-full md:col-span-3 flex justify-between md:justify-end items-center border-t md:border-t-0 border-gray-100 pt-3 md:pt-0 mt-1 md:mt-0">
                  <div class="md:hidden text-xs font-bold text-slate-500 uppercase tracking-wider">Subtotal</div>
                  <div class="flex items-center gap-4">
                      <span class="font-bold text-blue-700 style="font-size: 10px;">${formatRupiah(subtotalItem)}</span>
                      
                      <button type="button" onclick="deleteCartItem(${index})" class="hidden md:flex text-gray-300 hover:text-red-500 transition p-1.5 hover:bg-red-50 rounded-lg border border-transparent hover:border-red-100">

      document.getElementById('cartTotalItem').innerText = ORDER_CART.length;

  // HELPER UPDATE DISKON
  function updateCartDiscount(index, input) {

      ORDER_CART[index].diskon = val;

  // Update selectOrderProduct untuk inisialisasi diskon 0
  const originalSelect = selectOrderProduct; // Simpan ref lama (jika perlu)
  // GANTI selectOrderProduct dengan ini:
  function selectOrderProduct(row) {
      const skuVar = row[3];
      const stok = parseNumber(row[7]);
      const hpp = parseNumber(row[9]);
      const jual = parseNumber(row[11]);

      if (stok <= 0) { Swal.fire('Stok Habis', 'Produk ini stoknya 0.', 'error'); return; }

      const existingItem = ORDER_CART.find(item => item.skuVariasi === skuVar);

      ORDER_CART.push({

      });

      renderOrderCart();
  }

  // --- HELPER UPDATE CART (VERSI BARU) ---

  // 1. Update Qty dengan Tombol +/-
  function updateQty(index, change) {
      let item = ORDER_CART[index];
      let newQty = parseInt(item.qty) + change;
      
      // Validasi Min
      if (newQty < 1) return; 
      
      // Validasi Max Stok
      if (newQty > item.stokTersedia) {
          Swal.fire('Stok Kurang', `Maksimal qty untuk produk ini adalah ${item.stokTersedia}`, 'warning');
          newQty = item.stokTersedia;
      }

      ORDER_CART[index].qty = newQty;
      renderOrderCart(); // Render ulang
  }

  // 2. Update Qty dengan Ketik Manual
  function updateQtyManual(index, val) {
      let item = ORDER_CART[index];
      let newQty = parseInt(val);
      
      if (isNaN(newQty) || newQty < 1) newQty = 1;
      
      if (newQty > item.stokTersedia) {
          Swal.fire('Stok Kurang', `Maksimal qty untuk produk ini adalah ${item.stokTersedia}`, 'warning');
          newQty = item.stokTersedia;
      }

      ORDER_CART[index].qty = newQty;
      renderOrderCart();
  }

  // 3. Update Diskon
  function updateDiskon(index, valStr) {
      let val = parseFormattedNumber(valStr); // Hapus titik format rupiah
      ORDER_CART[index].diskon = val;
      renderOrderCart();
  }

  // 4. Hapus Item (Tetap sama, tapi pastikan ada)
  function deleteCartItem(index) {
      ORDER_CART.splice(index, 1);
      renderOrderCart();
  }

  // F. VALIDASI QTY AGAR TIDAK LEBIH DARI STOK
  function validateOrderQty() {
      const input = document.getElementById('orderQty');
      const warning = document.getElementById('stockWarning');
      const btn = document.getElementById('btnSaveOrder');
      let qty = parseInt(input.value) || 0;

      if(qty <= 0) { input.value = 1; qty = 1; }

      if (qty > SELECTED_PRODUCT_STOCK) {
          if(warning) {
             warning.classList.remove('hidden');
             warning.innerText = `Maks ${SELECTED_PRODUCT_STOCK}`;
          }
          input.classList.add('border-red-500', 'text-red-600');
          btn.disabled = true;
          btn.classList.add('opacity-50', 'cursor-not-allowed');
      } else {
          if(warning) warning.classList.add('hidden');
          input.classList.remove('border-red-500', 'text-red-600');
          btn.disabled = false;
          btn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
  }

  // G. SUBMIT ORDER KE BACKEND
  function submitOrder(e) {
      e.preventDefault();

      // Validasi Form Utama
      const resi = document.getElementById('orderResi').value;
      const channel = document.getElementById('orderChannel').value;
      const kurir = document.getElementById('orderCourier').value;

      if(ORDER_CART.length === 0) { Swal.fire('Kosong', 'Pilih minimal 1 produk!', 'warning'); return; }
      if(!channel) { Swal.fire('Gagal', 'Pilih Channel Penjualan!', 'warning'); return; }
      if(!kurir) { Swal.fire('Gagal', 'Pilih Kurir!', 'warning'); return; }
      // Resi boleh kosong jika offline, tapi disarankan isi '-'
      if(!resi) { Swal.fire('Gagal', 'Nomor Resi wajib diisi (isi strip "-" jika tidak ada)!', 'warning'); return; }

      const btn = document.getElementById('btnSaveOrder');
      const originalText = btn.innerHTML;
      
      // Ubah teks tombol sesuai mode
      btn.innerText = IS_ORDER_EDIT_MODE ? 'Mengupdate...' : 'Menyimpan...'; 
      btn.disabled = true;

      const payload = {
          idPesanan: document.getElementById('orderId').value,
          channel: channel,
          kurir: kurir,
          resi: resi,
          custName: document.getElementById('orderCustName').value || '',
          custPhone: document.getElementById('orderCustPhone').value || '',
          custAddress: document.getElementById('orderCustAddress').value || '',
          ongkir: parseFormattedNumber(document.getElementById('orderOngkir').value),
          kecamatanString: document.getElementById('orderKecamatanSearch').value || '',
          
          items: ORDER_CART
      };

      // --- LOGIKA CABANG: EDIT ATAU BARU? ---
      if (IS_ORDER_EDIT_MODE) {
          // MODE UPDATE
          payload.oldDate = EDIT_ORDER_DATE_REF; // Kirim tanggal lama agar tidak berubah jadi hari ini

          google.script.run.withSuccessHandler(res => {
              if (res.success) {
                  Swal.fire({ title: 'Tersimpan!', text: 'Pesanan berhasil diperbarui.', icon: 'success', timer: 1500, showConfirmButton: false });
                  closeInputOrderModal();
                  loadOrders(); // Refresh tabel
              } else {
                  Swal.fire('Gagal Update', res.message, 'error');
              }
              btn.innerHTML = originalText; btn.disabled = false;
          }).processFullOrderEdit(payload); // Panggil Backend Edit

      } else {
          // MODE BARU (Existing Logic)
          google.script.run.withSuccessHandler(res => {
              Swal.fire({ title: 'Tersimpan!', text: 'Pesanan Multi-Produk berhasil disimpan.', icon: 'success', timer: 1500, showConfirmButton: false });
              closeInputOrderModal();
              loadOrders();
              btn.innerHTML = originalText; btn.disabled = false;
          }).addNewOrder(payload); // Panggil Backend Baru
      }
  }

  // 1. Ambil Data Config dari Server (Config!C, E, F, G)
  function loadConfigForOrderForm() {
      google.script.run.withSuccessHandler(data => {
          // Data Config berupa Array 2D
          // Index berdasarkan sheet Config (0-based dari data.shift header):
          // Col C (Kurir) = Index 2
          // Col E (Channel) = Index 4

          renderCustomOptions('dd-courier', couriers, 'orderCourier');

              : `<div class="w-5 h-5 bg-gray-100 rounded-sm flex items-center justify-center text-[10px] font-bold text-gray-500">${item.name.charAt(0)}</div>`;

          return `

                 class="flex items-center gap-3 p-2.5 hover:bg-blue-50 rounded-lg cursor-pointer transition group">

  function openMassUploadModal() {
      const modal = document.getElementById('modal-mass-channel');
      if(!modal) return;

      modal.classList.remove('hidden');

  // ==========================================
  // --- LOGIC MASS UPLOAD (SHOPEE & TIKTOK) ---
  // ==========================================

  let ACTIVE_MASS_CHANNEL = ''; // 'Shopee' or 'TikTok'
  let MASS_DATA_READY = [];     // Data siap kirim ke backend

  // 1. SELECT CHANNEL & TRIGGER FILE
  function handleMassChannelSelected(channelName) {
      ACTIVE_MASS_CHANNEL = channelName; // Simpan pilihan user

      // Trigger klik input file
      document.getElementById('massFileInput').value = ''; // Reset input
      document.getElementById('massFileInput').click();
  }

  // 2. PROCESS FILE (SHEETJS)
  function processMassFile(input) {
      const file = input.files[0];
      if(!file) return;

      // Update UI Loading
      Swal.fire({ title: 'Membaca File...', didOpen: () => Swal.showLoading() });

      const reader = new FileReader();

      reader.onload = function(e) {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          // Ambil Sheet Pertama
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];

          // PERBAIKAN: Tambahkan 'raw: false' agar angka panjang (Order ID) dibaca sebagai TEKS
          const rawRows = XLSX.utils.sheet_to_json(worksheet, { 
              header: 1, 
              raw: false,        // KUNCI: Mencegah konversi otomatis ke Number (Scientific Notation)
              defval: ''         // Default value jika sel kosong
          });

          if (!rawRows || rawRows.length < 2) {
              Swal.fire('Error', 'File kosong atau format salah', 'error');
              return;
          }

          // --- SAFETY SCRIPT: VALIDASI HEADER ---
          const isValid = validateMassHeader(rawRows);
          if (!isValid) return; // Stop jika salah file

          // --- PARSING DATA ---
          try {
              const parsedData = parseRowsByChannel(rawRows);

              if(parsedData.length === 0) {
                   Swal.fire('Info', 'Tidak ada data pesanan yang ditemukan baris.', 'info');
                   return;
              }

              // Tampilkan Preview
              renderMassPreview(parsedData, file.name);
              Swal.close();

          } catch (err) {
              console.error(err);
              Swal.fire('Error Parsing', 'Gagal membaca kolom Excel. Pastikan format file asli dari Seller Center.', 'error');
          }
      };

      reader.readAsArrayBuffer(file);
  }

  // --- 3. SAFETY SCRIPT: CEK HEADER ---
  function validateMassHeader(rows) {
      // Ambil Baris Header.
      // Shopee Header ada di Baris 1 (Index 0).
      // TikTok Header ada di Baris 3 (Index 2) tapi biasanya Baris 1 ada tulisan 'Order Report'.
      // Kita cek fleksibel.

      const headerRowShopee = rows[0]; // Baris 1
      const headerRowTikTok = rows[0]; // Cek baris 1 dulu untuk TikTok (Order ID biasanya di A1 di beberapa versi baru export)

      // Cek Indikator Unik
      const colA_Shopee = String(headerRowShopee[0] || '').trim(); // "No. Pesanan"
      const colA_TikTok = String(rows[2] ? rows[2][0] : (rows[0][0]||'')).trim(); // "Order ID" (Cek baris 1 dan 3)

      if (ACTIVE_MASS_CHANNEL.toLowerCase().includes('shopee')) {
          if (!colA_Shopee.includes('No. Pesanan')) {
              Swal.fire({
                  title: 'Salah File!',
                  text: 'Anda memilih SHOPEE, tapi file ini tidak memiliki kolom "No. Pesanan" di A1. Jangan-jangan ini file TikTok?',
                  icon: 'warning'
              });
              return false;
          }
      }
      else if (ACTIVE_MASS_CHANNEL.toLowerCase().includes('tiktok')) {
          // TikTok agak tricky, kadang header di row 1 atau row 3
          // Kita cari keyword "Order ID" di kolom A pada 5 baris pertama
          let isTikTok = false;
          for(let i=0; i<5; i++) {
              if(rows[i] && String(rows[i][0]).includes('Order ID')) isTikTok = true;
          }

          if (!isTikTok) {
              Swal.fire({
                  title: 'Salah File!',
                  text: 'Anda memilih TIKTOK, tapi sistem tidak menemukan kolom "Order ID". Pastikan upload file Shopee di menu Shopee.',
                  icon: 'warning'
              });
              return false;
          }
      }

      return true;
  }

  // --- 4. PARSING LOGIC (SESUAI KOLOM YANG ANDA BERIKAN) ---
  // 1. Helper Format Angka
  function cleanExcelNumber(val) {
      if (typeof val === 'number') return val;
      if (!val) return 0;
      const clean = String(val).replace(/Rp|\./g, '').replace(/,/g, '.').trim();
      return parseFloat(clean) || 0;
  }

  // 2. Helper Mapping Status (THE BRAIN 🧠)
  function mapExcelStatus(rawStatus) {
      if(!rawStatus) return null; // Skip jika kosong

      const s = String(rawStatus).toLowerCase().trim();

      // A. KELOMPOK BLACKLIST (JANGAN UPLOAD)
      const blacklist = ['batal', 'dibatalkan', 'cancel', 'canceled', 'cancelled', 'failed', 'gagal', 'belum bayar', 'unpaid'];
      if (blacklist.some(word => s.includes(word))) return null; // Return null artinya SKIP

      // B. KELOMPOK WAITING (OPERASIONAL GUDANG)
      // Shopee: "Perlu Dikirim"
      // TikTok: "Awaiting Shipment", "Awaiting Collection"
      const waitingKeywords = ['perlu dikirim', 'awaiting shipment', 'awaiting collection', 'to ship', 'menunggu diproses'];
      if (waitingKeywords.some(word => s.includes(word))) return 'WAITING';

      // C. KELOMPOK HISTORY (DATA LAMA / SELESAI)
      // Shopee: "Sedang Dikirim", "Selesai", "Pengiriman"
      // TikTok: "In Transit", "Delivered", "Completed", "Shipped"
      const historyKeywords = ['sedang dikirim', 'selesai', 'in transit', 'delivered', 'completed', 'shipped', 'pengiriman'];
      if (historyKeywords.some(word => s.includes(word))) return 'SHIPPED'; // Masuk sebagai SHIPPED (Arsip)

      // D. DEFAULT (Jaga-jaga status aneh) -> Masukkan ke History biar aman (ga dipacking ulang)
      return 'SHIPPED';
  }

  // Helper Cek Status Batal
  function isCancelled(statusRaw) {
      if(!statusRaw) return false;
      const s = String(statusRaw).toLowerCase().trim();
      // Daftar kata kunci status batal
      const blacklist = ['batal', 'dibatalkan', 'cancel', 'canceled', 'cancelled', 'failed', 'gagal'];

      // Cek apakah status mengandung salah satu kata di atas
      return blacklist.some(word => s.includes(word));
  }

  // --- 4. PARSING LOGIC (FIXED: Added 'nm' Column) ---
  function parseRowsByChannel(rows) {
      const results = [];
      const channelSelection = ACTIVE_MASS_CHANNEL.toLowerCase();
      console.log("Mulai Parsing Channel:", channelSelection);

      let startRowIndex = 1;
      let colMap = {};

      // 1. SHOPEE MALL (FIXED MAPPING V5 - SESUAI REQUEST)
      if (channelSelection.includes('shopee') && channelSelection.includes('mall')) {
          startRowIndex = 1;
          
          colMap = { 
              id:0, stat:1, resi:4, kurir:5, tgl:10, 
              
              // --- PRODUK ---
              sku: 19,     // Kolom T (SKU Induk)
              nm: 20,      // Kolom U (Nama Produk)
              var: 21,     // Kolom V (SKU Variasi - Kode Validasi)
              varText: 22, // Kolom W (Nama Variasi - Teks Tampilan)
              
              // --- JUMLAH & HARGA ---
              qty: 33,     // Kolom AH (Jumlah)
              hrg: 45,     // Kolom AT (Total Pembayaran -> Masuk ke Kolom T Database)

              // --- CUSTOMER (Sesuai request sebelumnya) ---
              ongkir: 46,  // Kolom AU
              cust: 49,    // Kolom AX
              telp: 51,    // Kolom AZ
              almt: 52,    // Kolom BA
              kota: 53,    // Kolom BB
              prov: 54     // Kolom BC
          };
      }
      // 2. SHOPEE BIASA / STAR / STAR+ (FIXED)
      else if (channelSelection.includes('shopee')) {
          startRowIndex = 1;
          colMap = { 
              // Format baru (sesuai request)
              // A=id, B=status, D=resi, F=kurir, I=tanggal
              id:0, stat:1, resi:3, kurir:5, tgl:8, 
              
              // --- MAPPING PRODUK ---
              // L=sku induk, M=nama produk, N=sku variasi, O=nama variasi
              sku:11,
              nm: 12,
              var:13,
              varText: 14,
              // R=qty, P=harga
              qty:17,
              hrg:15,
              
              // --- MAPPING CUSTOMER ---
              // AI=ongkir, AQ=customer, AR=telp, AS=alamat, AT=kota, AU=provinsi
              ongkir: 34,
              cust: 42,
              telp: 43,
              almt: 44,
              kota: 45,
              prov: 46
          };
      }
      
      // 3. TIKTOK SHOP (FIX: AUTO HEADER & FILTER BARIS SAMPAH)
      else if (channelSelection.includes('tiktok')) {
          let headerRow = [];
          startRowIndex = 0;

          // A. SCANNING HEADER
          // Cari baris yang punya 'Order ID' & 'Order Status'
          for(let i=0; i<10; i++) {
              if (rows[i]) {
                  const rowStr = rows[i].map(c => String(c).toLowerCase().trim()).join('|');
                  if (rowStr.includes('order id') && rowStr.includes('order status')) {
                      headerRow = rows[i];
                      // [REVISI] Mulai baca data dari Baris ke-3 (Index 2)
                      // Asumsi Header ditemukan di Baris 1 (Index 0), maka i=0.
                      // Sebelumnya: i + 1 = 1 (Baris 2). Sekarang: i + 2 = 2 (Baris 3).
                      startRowIndex = i + 2; 
                      break;
                  }
              }
          }

          if (headerRow.length === 0) {
              Swal.fire('Gagal', 'Format file tidak dikenali. Header "Order ID" tidak ditemukan.', 'error');
              return [];
          }

          // B. MAPPING KOLOM OTOMATIS
          const getIdx = (names) => {
              const lowerHeader = headerRow.map(h => String(h).toLowerCase().trim());
              for (const name of names) {
                  const idx = lowerHeader.indexOf(name.toLowerCase());
                  if (idx !== -1) return idx;
              }
              return -1;
          };

          colMap = {
              id: getIdx(['Order ID', 'No. Pesanan']),
              stat: getIdx(['Order Status', 'Status Pesanan']),
              resi: getIdx(['Tracking ID', 'No. Resi']),
              kurir: getIdx(['Shipping Provider Name', 'Penyedia Pengiriman']),
              tgl: getIdx(['Created Time', 'Waktu Dibuat']),
              sku: getIdx(['Seller SKU', 'Nomor Referensi SKU']),
              nm: getIdx(['Product Name', 'Nama Produk']),
              varText: getIdx(['Variation', 'Variasi']), 
              var: getIdx(['Seller SKU', 'Nomor Referensi SKU']),
              qty: getIdx(['Quantity', 'Jumlah']),
              hrg: getIdx(['SKU Unit Original Price', 'Harga Awal']), 
              ongkir: getIdx(['Shipping Fee After Discount', 'Ongkos Kirim Dibayar Pembeli']),
              cust: getIdx(['Recipient', 'Penerima']),
              telp: getIdx(['Phone #', 'No. Telepon']),
              almt: getIdx(['Detail Address', 'Alamat Lengkap']),
              kota: getIdx(['Regency and City', 'Kota/Kabupaten']),
              prov: getIdx(['Province', 'Provinsi'])
          };

          if (colMap.id === -1) {
               Swal.fire('Error', 'Kolom "Order ID" gagal dipetakan.', 'error');
               return [];
          }
      }

      // Helper Lookup Master
      function lookupMasterData(excelSku, excelName, excelVar) {
          const cleanSku = String(excelSku || '').trim();
          // Default nama diambil dari Excel jika SKU tidak ditemukan di database
          let res = { name: excelName, variant: excelVar, hpp: 0, sellPrice: 0 };

          if (cleanSku) {
              const match = productList.find(row => String(row[3]).trim() === cleanSku);
              if (match) {
                  res.name = match[1]; // Jika ketemu di DB, pakai nama DB
                  res.variant = match[4] || '-';
                  res.hpp = parseNumber(match[9]);
                  res.sellPrice = parseNumber(match[11]);
              }
          }
          return res;
      }

      // Loop Data
      for (let i = startRowIndex; i < rows.length; i++) {
          const row = rows[i];
          
          // 1. Cek apakah baris ada isinya
          if (!row) continue;
          
          // 2. Ambil nilai Order ID
          let orderIdVal = row[colMap.id] ? String(row[colMap.id]).trim() : '';

          // --- FILTER PENTING UNTUK MEMBUANG BARIS 2 ---
          // [FIX] Validasi ID: Izinkan Angka & Huruf (Alphanumeric) untuk Shopee/TikTok
          // Hapus karakter non-alphanumeric (tanda kutip, spasi) sebelum cek
          const cleanId = orderIdVal.replace(/[^a-zA-Z0-9]/g, ''); 
          
          // Syarat: Tidak kosong dan panjang minimal 5 karakter (Order ID Shopee biasanya >10 karakter)
          if (cleanId === '' || cleanId.length < 5) {
              continue;
          }

          const rawStatus = row[colMap.stat];
          const systemStatus = mapExcelStatus(rawStatus);
          if (systemStatus === null) continue; // Skip Batal

          // Ambil Nama Variasi Asli dari Excel (Kolom P untuk Shopee)
          const rawVarText = row[colMap.varText]; 

          // Lookup Data (Kirim SKU & Nama Variasi Teks)
          const master = lookupMasterData(row[colMap.sku], row[colMap.nm], rawVarText);

          let displayChannel = 'Shopee';
          if(channelSelection.includes('mall')) displayChannel = 'Shopee Mall';
          if(channelSelection.includes('tiktok')) displayChannel = 'TikTok Shop';

          const hargaParsed = cleanExcelNumber(row[colMap.hrg]);

          results.push({
              id: row[colMap.id],
              status: systemStatus,
              statusAsli: rawStatus,

              resi: row[colMap.resi],
              kurir: row[colMap.kurir],
              tgl: formatDate(row[colMap.tgl]),

              skuInduk: row[colMap.sku], 
              skuVariasi: row[colMap.var], 
              
              nama: master.name, 
              
              // FIX: Gunakan teks dari Excel (Kolom P). Jika kosong, baru fallback ke Master.
              varian: rawVarText || master.variant || '-', 

              hpp: master.hpp,
              sellPrice: master.sellPrice,

              qty: row[colMap.qty],
              harga: hargaParsed,

              // Data Customer
              custName: row[colMap.cust],
              custPhone: row[colMap.telp],
              custAddress: row[colMap.almt],
              ongkir: cleanExcelNumber(row[colMap.ongkir]),
              kota: row[colMap.kota],
              provinsi: row[colMap.prov],
              
              channel: displayChannel
          });
      }

      return results;
  }

  // --- 5. RENDER PREVIEW (FIXED VALIDATION) ---
  function renderMassPreview(data, filename) {
      MASS_DATA_READY = data;

      document.getElementById('mass-filename').innerText = filename;
      document.getElementById('mass-total-row').innerText = data.length;

      document.getElementById('step-select-channel').classList.add('hidden');
      document.getElementById('step-preview-mass').classList.remove('hidden');
      document.getElementById('mass-footer-action').classList.remove('hidden');
      document.getElementById('mass-subtitle').innerText = "Periksa data sebelum disimpan.";

      const tbody = document.getElementById('mass-preview-body');
      const previewLimit = data.slice(0, 100);

      tbody.innerHTML = previewLimit.map(item => {
          // UPDATE VALIDASI: Prioritas Cek SKU Variasi, jika tidak ada baru Induk
          // Ini sesuai instruksi: SKU Variasi dijadikan indikator status validasi
          const skuCheck = String(item.skuVariasi || item.skuInduk || '').trim();
          
          // Cek apakah SKU tersebut ada di Master Produk (Kolom D / Index 3)
          const isSkuExist = productList.some(p => String(p[3]).trim() === skuCheck);

          let skuBadge = isSkuExist
              ? `<span class="text-emerald-600 bg-emerald-50 px-1 rounded font-bold">OK</span>`
              : `<span class="text-amber-600 bg-amber-50 px-1 rounded font-bold" title="SKU '${skuCheck}' tidak ditemukan">Cek SKU</span>`;
          
          if(!skuCheck) skuBadge = `<span class="text-red-600 bg-red-50 px-1 rounded font-bold">Kosong</span>`;

          // Tampilan Status Sistem
          let statusDisplay = '';
          if(item.status === 'WAITING') {
              statusDisplay = `
                <div class="flex flex-col leading-tight">
                    <span class="font-bold text-slate-700">${item.statusAsli}</span>
                    <span class="text-[9px] text-amber-600 bg-amber-50 px-1 rounded border border-amber-100 w-fit mt-0.5">Masuk: MENUNGGU</span>
                </div>`;
          } else {
              statusDisplay = `
                <div class="flex flex-col leading-tight">
                    <span class="font-bold text-slate-400">${item.statusAsli}</span>
                    <span class="text-[9px] text-emerald-600 bg-emerald-50 px-1 rounded border border-emerald-100 w-fit mt-0.5">Masuk: SELESAI</span>
                </div>`;
          }

          return `
            <tr class="hover:bg-gray-50 border-b border-gray-50 last:border-0 text-[11px] text-slate-600">
                <td class="px-3 py-2 font-bold text-blue-600">${item.id}</td>
                <td class="px-3 py-2">${item.tgl}</td>
                
                <td class="px-3 py-2">
                    <div class="font-mono font-bold">${item.skuInduk || '-'}</div>
                    <div class="text-[9px] text-slate-500 font-mono">${item.skuVariasi || ''}</div>
                </td>

                <td class="px-3 py-2">${statusDisplay}</td>
                
                <td class="px-3 py-2">
                    <div class="truncate w-[150px]" title="${item.nama}">${item.nama}</div>
                    <div class="text-gray-400 text-[9px]">${item.varian || '-'}</div>
                </td>
                <td class="px-3 py-2 text-right">${formatRupiah(item.harga)}</td>
                <td class="px-3 py-2 text-center">${skuBadge}</td>
            </tr>
          `;
      }).join('');

      if(data.length > 100) {
          tbody.innerHTML += `<tr><td colspan="7" class="text-center py-2 text-xs text-gray-400 italic">... dan ${data.length - 100} baris lainnya disembunyikan ...</td></tr>`;
      }
  }

      Swal.fire({
          title: 'Simpan Data?',
          text: `Akan menyimpan ${MASS_DATA_READY.length} baris data ke Database. Pastikan tidak ada duplikat.`,
          icon: 'question',
          showCancelButton: true,
          confirmButtonText: 'Ya, Eksekusi',

      }).then((res) => {

              Swal.fire({ title: 'Menyimpan...', text: 'Mohon tunggu, sedang memproses batch data.', didOpen: () => Swal.showLoading() });

                  });
                  closeMassUploadModal();

                  loadOrders(); // Refresh tabel order utama
              }).saveMassData(MASS_DATA_READY);
          }
      });

      if(window.lucide) lucide.createIcons();

      google.script.run.withSuccessHandler(data => {
          const grouped = {};
          const orderIds = []; // Untuk menjaga urutan (terbaru di atas)

          data.forEach(row => {
               // Mapping Data: [0]ID, [1]Tgl, [2]Channel, [3]Kurir, [4]Resi, [6]Nama, [8]Var, [9]Qty, [14]Status
               const id = row[0];

               // Jika ID belum ada di object grouped, buat entry baru
               if (!grouped[id]) {
                   grouped[id] = {
                       id: id,
                       date: row[1],
                       channel: row[2],
                       courier: row[3],
                       resi: row[4],
                       status: row[14],
                       returCond: row[20], // Kondisi Retur (jika ada)
                       items: [], // Array untuk menampung produk
                       searchStr: (id + row[4] + row[2]).toLowerCase() // Base pencarian (ID + Resi + Channel)
                   };
                   orderIds.push(id);
               }

               // Tambahkan Produk ke dalam Array items milik ID tersebut
               grouped[id].items.push({
                   product: row[6],
                   variant: row[8],
                   qty: row[9]
               });

               // Tambahkan nama produk ke string pencarian agar bisa dicari by nama produk
               grouped[id].searchStr += " " + row[6].toLowerCase();
          });

          // Ubah Object kembali menjadi Array agar bisa diloop
          EXPEDITION_DATA = orderIds.map(id => grouped[id]);

          renderExpeditionTable();
          updateExpeditionStats();

      }).getOrderList();
  }

  // 2. SWITCH TAB (Handle 3 Tab)
  function switchExpeditionTab(tabName) {
      ACTIVE_EXP_TAB = tabName;

      // PENTING: mode scan harus ikut tab aktif agar OUT tidak terbaca IN
      syncExpeditionModeFromTab();

  // 3. RENDER TABEL (LAYOUT COMPACT & GRID PRODUK)
  function renderExpeditionTable() {
      const container = document.getElementById('expedition-list-container');
      const emptyState = document.getElementById('expedition-empty');
      const searchInput = document.getElementById('searchExpeditionBox');
      const filter = searchInput ? searchInput.value.toLowerCase() : '';

      // --- 1. UPDATE HEADER TABEL (DESKTOP) ---
      const headerContainer = document.querySelector('#view-expedition .grid-cols-12');
      if(headerContainer) {
          // Kita sembunyikan header kolom klasik karena sekarang pakai model Kartu Compact
          headerContainer.className = "hidden";
      }

      // --- LOGIKA FILTER (TETAP SAMA) ---
      const isAllChannelsSelected = (EXP_FILTER_SELECTED.size === 0) ||
                                    (EXP_AVAILABLE_CHANNELS.length > 0 && EXP_FILTER_SELECTED.size === EXP_AVAILABLE_CHANNELS.length);

      const filtered = EXPEDITION_DATA.filter(item => {
          const matchTab = item.status === ACTIVE_EXP_TAB;
          const matchSearch = !filter || item.searchStr.includes(filter);
          let matchChannel = false;

          if (isAllChannelsSelected) {
              matchChannel = true;
          } else {
              if (EXP_FILTER_SELECTED.has(item.channel)) {
                  matchChannel = true;
              } else {
                  for (let filterName of EXP_FILTER_SELECTED) {
                      if (item.channel.toLowerCase().includes(filterName.toLowerCase())) {
                          matchChannel = true; break;
                      }
                  }
              }
          }
          return matchTab && matchSearch && matchChannel;
      });

      if (filtered.length === 0) {
          container.innerHTML = '';
          emptyState.classList.remove('hidden');
          const emptyTitle = emptyState.querySelector('h3');
          if(ACTIVE_EXP_TAB === 'WAITING') emptyTitle.innerText = "Semua Sudah Dipacking!";
          if(ACTIVE_EXP_TAB === 'PACKED') emptyTitle.innerText = "Tidak Ada Paket Siap Kirim";
          if(ACTIVE_EXP_TAB === 'RETURNED') emptyTitle.innerText = "Tidak Ada Data Retur";
          return;
      }

      emptyState.classList.add('hidden');

      // --- RENDER ISI (LAYOUT BARU: COMPACT CARD) ---
      container.innerHTML = filtered.map(item => {

          // Badge Channel (Warna-warni)
          const channelClass = getChannelStyle(item.channel);

          // [FIX FINAL] Parsing Tanggal Manual (Wajib untuk format DD/MM/YYYY)
          let dateShort = '-';

          if (item.date) {
              let dateObj = null;

              // 1. Coba Parsing Manual Regex (DD/MM/YYYY HH:mm:ss)
              // Menangkap: Group 1=Tgl, 2=Bln, 3=Thn, 4=Jam, 5=Mnt, 6=Dtk
              if (typeof item.date === 'string') {
                  const parts = item.date.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})(?:\s(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
                  if (parts) {
                      dateObj = new Date(
                          parseInt(parts[3]),      // Tahun
                          parseInt(parts[2]) - 1,  // Bulan (0-11)
                          parseInt(parts[1]),      // Tanggal
                          parseInt(parts[4] || 0), // Jam
                          parseInt(parts[5] || 0), // Menit
                          parseInt(parts[6] || 0)  // Detik
                      );
                  }
              }

              // 2. Fallback: Jika Regex gagal atau input bukan string (misal dari Excel Serial Number), pakai new Date biasa
              if (!dateObj || isNaN(dateObj.getTime())) {
                  dateObj = new Date(item.date);
              }

              // 3. Render Hasil Akhir
              if (!isNaN(dateObj.getTime())) {
                  const d = String(dateObj.getDate()).padStart(2, '0');
                  const m = String(dateObj.getMonth() + 1).padStart(2, '0');
                  const H = String(dateObj.getHours()).padStart(2, '0');
                  const M = String(dateObj.getMinutes()).padStart(2, '0');
                  dateShort = `${d}/${m} ${H}:${M}`;
              }
          }

          // --- GRID PRODUK (KE SAMPING) ---
          const itemsHtml = item.items.map(p => {
              const variantLabel = p.variant && p.variant !== '-'
                  ? `<span class="text-[10px] text-slate-500 bg-gray-100 px-1.5 rounded border border-gray-200 ml-1 truncate max-w-[80px] inline-block align-bottom">${p.variant}</span>`
                  : '';

              // Kartu Produk Kecil
              return `
                  <div class="flex items-center gap-2 p-2 bg-slate-50 rounded-lg border border-slate-100 min-w-[200px] flex-1">
                      <div class="shrink-0 w-8 h-8 flex items-center justify-center bg-white text-slate-700 font-bold rounded border border-slate-200 text-xs shadow-sm">
                          ${p.qty}
                      </div>
                      <div class="min-w-0 overflow-hidden">
                          <div class="text-xs font-bold text-slate-700 truncate" title="${p.product}">${p.product}</div>
                          <div class="leading-none">${variantLabel}</div>
                      </div>
                  </div>
              `;
          }).join('');

          // --- STATUS / KONDISI (POJOK KANAN) ---
          let actionButton = '';
          if (ACTIVE_EXP_TAB === 'RETURNED') {
              const isGood = item.returCond && item.returCond.toString().toUpperCase().includes('GOOD');
              actionButton = isGood
                  ? `<div class="px-2 py-1 bg-emerald-100 text-emerald-700 text-[10px] font-bold rounded border border-emerald-200">LAYAK JUAL</div>`
                  : `<div class="px-2 py-1 bg-rose-100 text-rose-700 text-[10px] font-bold rounded border border-rose-200">RUSAK</div>`;
          } else if (ACTIVE_EXP_TAB === 'WAITING') {
               // Tombol Copy Resi Cepat
               actionButton = `
                <button onclick="copyToClipboard('${item.resi}')" class="text-xs font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg border border-blue-200 transition flex items-center gap-1">
                    <i data-lucide="copy" class="w-3 h-3"></i> Salin Resi
                </button>`;
          } else {
               actionButton = `<div class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded">SIAP KIRIM</div>`;
          }

          // --- STRUKTUR KARTU UTAMA ---
          return `
          <div class="p-3 md:p-4 hover:bg-white transition group animate-fade-in border-b border-gray-100 bg-white md:hover:bg-slate-50">

              <div class="flex flex-wrap items-center justify-between gap-2 mb-3">

                  <div class="flex items-center gap-3 overflow-hidden">
                      <div class="font-mono text-base md:text-lg font-bold text-slate-800 select-all cursor-pointer truncate" title="Klik untuk copy" onclick="copyToClipboard('${item.resi}')">
                          ${item.resi || 'NO-RESI'}
                      </div>

                      <span class="${channelClass} px-2 py-0.5 rounded text-[10px] font-bold border shrink-0">
                          ${item.channel}
                      </span>

                      <div class="flex items-center gap-1 text-xs text-slate-500 font-medium shrink-0 bg-gray-50 px-2 py-0.5 rounded border border-gray-100">
                          <i data-lucide="truck" class="w-3 h-3"></i> ${item.courier}
                      </div>
                  </div>

                  <div class="flex items-center gap-3 shrink-0">
                      <div class="text-[10px] text-gray-400 font-mono hidden md:block">${dateShort}</div>
                      ${actionButton}
                  </div>
              </div>

              <div class="flex flex-wrap gap-2">
                  ${itemsHtml}
              </div>

          </div>
          `;
      }).join('');

      if(window.lucide) lucide.createIcons();
  }

  // 4. UPDATE STATISTIK (Termasuk Retur)
  function updateExpeditionStats() {
      const waitingCount = EXPEDITION_DATA.filter(i => i.status === 'WAITING').length;
      const packedCount = EXPEDITION_DATA.filter(i => i.status === 'PACKED').length;
      const returnedCount = EXPEDITION_DATA.filter(i => i.status === 'RETURNED').length;

      document.getElementById('badge-exp-waiting').innerText = waitingCount;
      document.getElementById('badge-exp-packed').innerText = packedCount;

  }

  function filterExpeditionTable() {

  }

  // 1. INIT FILTER EXPEDITION
  function initExpeditionFilter() {
      // Ambil Config Channel dari Server
      google.script.run.withSuccessHandler(data => {
          EXP_AVAILABLE_CHANNELS = data.filter(row => row[4]).map(row => ({
              name: row[4],

          }));

  // 2. RENDER DROPDOWN
  function renderExpFilterDropdown() {
      const listContainer = document.getElementById('filter-exp-list');
      if(!listContainer) return;

      listContainer.innerHTML = EXP_AVAILABLE_CHANNELS.map(c => {

  // 3. TOGGLE SINGLE

      else EXP_FILTER_SELECTED.delete(val);

      updateExpFilterLabel();

  // 4. TOGGLE ALL
  function toggleExpAllChannels(checkbox) {
      const checkboxes = document.querySelectorAll('#filter-exp-list input[type="checkbox"]');

      if (checkbox.checked) {
          EXP_FILTER_SELECTED.clear();
          EXP_AVAILABLE_CHANNELS.forEach(c => EXP_FILTER_SELECTED.add(c.name));
          checkboxes.forEach(chk => chk.checked = true);

          checkboxes.forEach(chk => chk.checked = false);

          label.innerText = `${selected} Terpilih`;

  // Close dropdown when clicking outside
  document.addEventListener('click', function(e) {
      const btn = document.querySelector('button[onclick="toggleExpChannelFilterDropdown()"]');
      const dropdown = document.getElementById('filter-exp-dropdown');
      if (btn && dropdown && !btn.contains(e.target) && !dropdown.contains(e.target)) {

  // 5. SMART SCANNER (Auto Mode Retur)
  // ==========================================
  // --- LOGIKA SCANNER & KAMERA (HYBRID) ---
  // ==========================================

  let EXPEDITION_MODE = 'AUTO';
  let HTML5_QRCODE = null;
  let IS_PROCESSING_SCAN = false;
  let LAST_SCANNED_BARCODE = ""; // Menyimpan resi terakhir yg discan sukses
    let HID_SCANNER_BUFFER = '';
    let HID_SCANNER_LAST_TS = 0;
    let HID_SCANNER_LISTENER_READY = false;
    let HID_SCANNER_TIMEOUT = null;

    // --- OPSI SCANNER EKSTERNAL (VERCEL) ---
    // Set true agar kamera dibuka di domain luar (deployment scanner)
    const USE_EXTERNAL_SCANNER = true;
    const EXTERNAL_SCANNER_URL = 'https://dataeasy.web.id/scanner-cpanel.html';
    const EXTERNAL_SCANNER_ORIGIN = new URL(EXTERNAL_SCANNER_URL).origin;
    let EXTERNAL_SCANNER_WINDOW = null;

  // VARIABLE PENTING: Untuk membedakan mode Ekspedisi vs Opname
  let SCAN_CONTEXT = 'EXPEDITION'; // Values: 'EXPEDITION' or 'OPNAME'

  function getManualInputBySource(source) {
      if (source === 'modal') return document.getElementById('manualResiInputModal');
      if (source === 'main') return document.getElementById('manualResiInputMain');
      return document.getElementById('manualResiInputMain') || document.getElementById('manualResiInputModal');
  }

  function getPrimaryManualInput() {
      return document.getElementById('manualResiInputMain') || document.getElementById('manualResiInputModal');
  }

  function initExternalScannerBridge() {
      window.addEventListener('message', function(event) {
          // Batasi origin scanner eksternal yang valid
          const allowedOrigins = new Set([
              EXTERNAL_SCANNER_ORIGIN,
              'https://dataeasy.web.id'
          ]);
          if (!allowedOrigins.has(event.origin)) return;

          // Support beberapa format data (object, nested object, json string, plain string)
          let payload = event.data;
          if (typeof payload === 'string') {
              try {
                  payload = JSON.parse(payload);
              } catch (e) {
                  payload = { type: 'SCAN_RESULT', code: payload };
              }
          }

          payload = payload || {};
          const nested = (payload.data && typeof payload.data === 'object') ? payload.data : {};

          const msgType = String(
              payload.type || payload.event || nested.type || nested.event || 'SCAN_RESULT'
          ).toUpperCase();

          // Jika ada type tapi bukan scan event, abaikan
          if (msgType && !['DE_SCAN_RESULT', 'SCAN_RESULT', 'SCAN_SUCCESS'].includes(msgType)) return;

          const code = String(
              payload.code || payload.barcode || payload.decodedText ||
              nested.code || nested.barcode || nested.decodedText ||
              payload.value || nested.value || ''
          ).trim();
          if (!code) return;

          const incomingContext = String(
              payload.context || payload.scanContext || nested.context || nested.scanContext || SCAN_CONTEXT || 'EXPEDITION'
          ).toUpperCase();
          const payloadMode = String(
              payload.mode || payload.scanMode || payload.expeditionMode || nested.mode || nested.scanMode || nested.expeditionMode || ''
          ).toUpperCase();

          // Mode diprioritaskan dari tab aktif (AUTO untuk semua kecuali RETURNED)
          let tabMode = '';
          if (ACTIVE_EXP_TAB === 'RETURNED') tabMode = 'RETUR';
          else tabMode = 'AUTO';

          // Prioritas: mode yang dipilih di popup scanner > tab aktif > mode global
          const effectiveMode = payloadMode || tabMode || EXPEDITION_MODE || 'AUTO';

          if (incomingContext === 'OPNAME') {
              SCAN_CONTEXT = 'OPNAME';
          } else {
              SCAN_CONTEXT = 'EXPEDITION';
              setExpeditionMode(effectiveMode);
          }

          // feedback kecil agar jelas event scan dari popup diterima
          Swal.fire({
              toast: true,
              position: 'top',
              icon: 'success',
              title: `Scan diterima: ${code}`,
              showConfirmButton: false,
              timer: 1200
          });

          onScanSuccess(code, null);
      });
  }

  function isExpeditionViewActive() {
      const view = document.getElementById('view-expedition');
      return !!(view && !view.classList.contains('hidden'));
  }

  function flushBluetoothScannerBuffer(forceProcess = false) {
      if (HID_SCANNER_TIMEOUT) {
          clearTimeout(HID_SCANNER_TIMEOUT);
          HID_SCANNER_TIMEOUT = null;
      }

      const code = (HID_SCANNER_BUFFER || '').trim();
      HID_SCANNER_BUFFER = '';

      // Minimal panjang agar tidak ganggu pengetikan biasa
      if (!code || code.length < 6) return;
      if (IS_PROCESSING_SCAN) return;

      // Saat forceProcess=false, ini biasanya dipanggil lewat timer idle scanner
      // Scanner bluetooth mengetik sangat cepat, jadi aman diproses otomatis.
      if (!forceProcess) {
          const elapsed = Date.now() - HID_SCANNER_LAST_TS;
          if (elapsed < 50) return; // masih ada input masuk, tunggu lagi
      }

    const manualInput = getPrimaryManualInput();
      if (manualInput) manualInput.value = code;
    handleManualTrigger('auto');
  }

  function initBluetoothScannerBridge() {
      if (HID_SCANNER_LISTENER_READY) return;
      HID_SCANNER_LISTENER_READY = true;

      document.addEventListener('keydown', function(e) {
          // Hanya aktif di halaman ekspedisi
          if (!isExpeditionViewActive()) return;

          // Abaikan jika sedang proses scan backend
          if (IS_PROCESSING_SCAN) return;

          const key = e.key;
          const now = Date.now();
          const delta = now - HID_SCANNER_LAST_TS;
          HID_SCANNER_LAST_TS = now;

          // Scanner biasanya mengetik sangat cepat; jika jeda lama, reset buffer
          if (delta > 120) {
              HID_SCANNER_BUFFER = '';
              if (HID_SCANNER_TIMEOUT) {
                  clearTimeout(HID_SCANNER_TIMEOUT);
                  HID_SCANNER_TIMEOUT = null;
              }
          }

          // Akhiran scanner umum: Enter / NumpadEnter / Tab
          if (key === 'Enter' || key === 'NumpadEnter' || key === 'Tab') {
              // Jika fokus ada di input manual, biarkan listener input manual yang proses
              const activeEl = document.activeElement;
              if (activeEl && (activeEl.id === 'manualResiInputMain' || activeEl.id === 'manualResiInputModal')) return;

              if ((HID_SCANNER_BUFFER || '').trim().length >= 6) {
                  e.preventDefault();
                  flushBluetoothScannerBuffer(true);
              }
              return;
          }

          // Tangkap karakter printable
          if (key && key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
              HID_SCANNER_BUFFER += key;

              // AUTO KIRIM: scanner tanpa suffix Enter/Tab tetap diproses setelah jeda singkat
              if (HID_SCANNER_TIMEOUT) clearTimeout(HID_SCANNER_TIMEOUT);
              HID_SCANNER_TIMEOUT = setTimeout(() => {
                  flushBluetoothScannerBuffer(false);
              }, 90);
          }
      });
  }

  function openExternalScanner(context, mode) {
      const qs = new URLSearchParams({
          context: String(context || 'EXPEDITION').toUpperCase(),
          mode: String(mode || 'IN').toUpperCase(),
          // Paksa wildcard agar popup bisa kirim ke parent GAS meski origin wrapper berubah-ubah
          sourceOrigin: '*'
      });

      const url = `${EXTERNAL_SCANNER_URL}?${qs.toString()}`;
      EXTERNAL_SCANNER_WINDOW = window.open(url, 'DE_SCANNER_POPUP', 'width=430,height=820,resizable=yes,scrollbars=yes');

      if (!EXTERNAL_SCANNER_WINDOW) {
          Swal.fire('Popup Diblokir', 'Izinkan pop-up untuk membuka scanner kamera eksternal.', 'warning');
          return;
      }

      Swal.fire({
          toast: true,
          position: 'top',
          icon: 'info',
          title: 'Scanner eksternal dibuka',
          text: 'Setelah scan sukses, data akan otomatis masuk ke halaman ini.',
          showConfirmButton: false,
          timer: 2200
      });
  }

    function chooseScannerMode(context, mode, internalCallback, manualCallback = null) {
      // Jika scanner eksternal dimatikan, langsung pakai mode internal
      if (!USE_EXTERNAL_SCANNER) {
          internalCallback();
          return;
      }

      // Langsung buka kamera eksternal tanpa popup pilihan
      openExternalScanner(context, mode);
  }

  function activateBluetoothManualMode() {
      SCAN_CONTEXT = 'EXPEDITION';
      initBluetoothScannerBridge();

      // AUTO untuk semua kecuali RETURNED
      if (ACTIVE_EXP_TAB === 'RETURNED') setExpeditionMode('RETUR');
      else setExpeditionMode('AUTO');

      // Tutup modal kamera jika masih terbuka
      const scannerModal = document.getElementById('scanner-modal');
      if (scannerModal && !scannerModal.classList.contains('hidden')) {
          closeScannerModal();
      }

      // Fokus ke input manual di halaman ekspedisi
      const manualInput = getPrimaryManualInput();
      if (manualInput) {
          manualInput.focus();
          manualInput.select();
      }

      Swal.fire({
          toast: true,
          position: 'top',
          icon: 'success',
          title: 'Mode Bluetooth/Manual aktif',
          text: 'Scan barcode langsung dari alat Bluetooth, lalu Enter otomatis proses.',
          showConfirmButton: false,
          timer: 2200
      });
  }

  // 1. TOMBOL SCANNER DI STOCK OPNAME
  function openOpnameScanner() {
      SCAN_CONTEXT = 'OPNAME'; // Set konteks ke Pencarian

      chooseScannerMode('OPNAME', 'IN', () => {
          // Sembunyikan tombol IN/OUT/RETUR karena tidak dipakai di Opname
          const uiOverlay = document.querySelector('#scanner-modal .absolute.bottom-0');
          if(uiOverlay) uiOverlay.classList.add('hidden');

          openScannerModal();

          Swal.fire({
              toast: true, position: 'top', icon: 'info',
              title: 'Mode: Cari Produk',
              text: 'Scan barcode untuk menyorot baris produk.',
              showConfirmButton: false, timer: 2000
          });
      }, () => {
          // Untuk opname, tetap gunakan kamera internal
          const uiOverlay = document.querySelector('#scanner-modal .absolute.bottom-0');
          if(uiOverlay) uiOverlay.classList.add('hidden');

          openScannerModal();

          Swal.fire({
              toast: true, position: 'top', icon: 'info',
              title: 'Mode: Cari Produk',
              text: 'Scan barcode untuk menyorot baris produk.',
              showConfirmButton: false, timer: 2000
          });
      });
  }

  // 2. TOMBOL SMART SCANNER DI EKSPEDISI
  function openSmartScanner() {
      SCAN_CONTEXT = 'EXPEDITION'; // Set konteks ke Server

      // AUTO mode untuk semua tab kecuali RETURNED
      if(ACTIVE_EXP_TAB === 'RETURNED') {
          setExpeditionMode('RETUR');
      } else {
          setExpeditionMode('AUTO');
      }

      chooseScannerMode('EXPEDITION', EXPEDITION_MODE || 'AUTO', () => {
          // Pastikan tombol UI muncul kembali
          const uiOverlay = document.querySelector('#scanner-modal .absolute.bottom-0');
          if(uiOverlay) uiOverlay.classList.remove('hidden');

          openScannerModal();

          if(ACTIVE_EXP_TAB === 'RETURNED') {
              Swal.fire({ toast: true, position: 'top', icon: 'info', title: 'Mode: RETUR', showConfirmButton: false, timer: 1500 });
          } else {
              Swal.fire({ toast: true, position: 'top', icon: 'info', title: 'Mode: AUTO (1x Scan = Kirim + Potong Stok)', showConfirmButton: false, timer: 2000 });
          }
      }, () => {
          activateBluetoothManualMode();
      });
  }

  // 3. BUKA MODAL SCANNER
  function openScannerModal() {
      const modal = document.getElementById('scanner-modal');
      if(!modal) return;
      modal.classList.remove('hidden');

      // --- [TAMBAHAN] INJECT TOMBOL UNDO KE AREA BAWAH ---
      const uiOverlay = document.querySelector('#scanner-modal .absolute.bottom-0');
      
      // Cek apakah tombol undo sudah ada? Kalau belum, buat.
      if (uiOverlay && !document.getElementById('btn-undo-scan')) {
          // Buat container baris baru di atas tombol mode
          const undoDiv = document.createElement('div');
          undoDiv.className = "w-full flex justify-center pb-2 px-4";
          undoDiv.innerHTML = `
             <button id="btn-undo-scan" onclick="triggerUndoScan()" 
                class="bg-rose-500/80 hover:bg-rose-600 text-white px-4 py-2 rounded-full text-xs font-bold backdrop-blur-sm shadow-lg flex items-center gap-2 transition transform active:scale-95">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Batalkan Scan Terakhir
             </button>
          `;
          // Masukkan ke paling atas dari overlay (sebelum tombol mode IN/OUT)
          uiOverlay.insertBefore(undoDiv, uiOverlay.firstChild);
          if(window.lucide) lucide.createIcons();
      }
      // ----------------------------------------------------

      // Setup Mode Tampilan
      if(SCAN_CONTEXT === 'EXPEDITION') {
          setExpeditionMode(EXPEDITION_MODE || 'IN');
      }

      startCamera();
  }

  // 4. TUTUP MODAL SCANNER
  function closeScannerModal() {
      const modal = document.getElementById('scanner-modal');
      if(modal) modal.classList.add('hidden');

      stopCamera();

      // Kembalikan UI Tombol Mode
      const uiOverlay = document.querySelector('#scanner-modal .absolute.bottom-0');
      if(uiOverlay) uiOverlay.classList.remove('hidden');

      // Refresh Data HANYA jika mode Ekspedisi
      if (SCAN_CONTEXT === 'EXPEDITION') {
          loadExpeditionData();
      }
  }

  // 5. ATUR MODE EKSPEDISI (AUTO + RETUR only)
  function setExpeditionMode(mode) {
      EXPEDITION_MODE = mode;

      const btnAuto = document.getElementById('btn-mode-auto');
      const btnRetur = document.getElementById('btn-mode-retur');

      const baseClass = "flex-1 py-3 text-sm font-bold rounded-xl transition-all text-white/60 hover:text-white hover:bg-white/10";
      const activeClassAuto = "flex-1 py-3 text-sm font-bold rounded-xl transition-all bg-white text-emerald-600 shadow-lg transform scale-105";
      const activeClassRetur = "flex-1 py-3 text-sm font-bold rounded-xl transition-all bg-white text-rose-600 shadow-lg transform scale-105";

      if(btnAuto) btnAuto.className = baseClass;
      if(btnRetur) btnRetur.className = baseClass;

      if((mode === 'AUTO' || mode === 'IN' || mode === 'OUT') && btnAuto) btnAuto.className = activeClassAuto;
      if(mode === 'RETUR' && btnRetur) btnRetur.className = activeClassRetur;

      // Smart Focus (Desktop Only)
      if (window.innerWidth > 768) {
          setTimeout(() => {
              const manualInput = getPrimaryManualInput();
              if(manualInput) { manualInput.focus(); manualInput.select(); }
          }, 200);
      }
  }

  // --- FUNGSI UNDO SCAN (FRONTEND) ---
  function triggerUndoScan() {
      // 1. Cek apakah ada history scan lokal
      if (!LAST_SCANNED_BARCODE) {
          Swal.fire({
              toast: true, position: 'top', icon: 'warning',
              title: 'Belum ada scan',
              text: 'Lakukan scan barang terlebih dahulu.',
              showConfirmButton: false, timer: 2000
          });
          return;
      }

      // 2. Konfirmasi User
      if(HTML5_QRCODE) HTML5_QRCODE.pause(); // Pause kamera biar gak pusing

      Swal.fire({
          title: 'Batalkan Transaksi?',
          html: `Akan membatalkan proses terakhir untuk resi:<br><b>${LAST_SCANNED_BARCODE}</b>`,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#f43f5e',
          confirmButtonText: 'Ya, Batalkan',
          cancelButtonText: 'Tidak',
          reverseButtons: true
      }).then((result) => {
          if (result.isConfirmed) {
              
              // 3. Panggil Backend
              Swal.fire({ title: 'Membatalkan...', didOpen: ()=>Swal.showLoading() });
              
              google.script.run.withSuccessHandler(res => {
                  if (res.success) {
                      Swal.fire({ 
                          title: 'Dibatalkan!', 
                          text: res.message, 
                          icon: 'success', 
                          timer: 2000, 
                          showConfirmButton: false 
                      });
                      // Reset last barcode agar tidak bisa undo 2x berturut-turut untuk barang yg sama (safety)
                      LAST_SCANNED_BARCODE = ""; 
                      
                      // Refresh data tabel jika perlu
                      if(typeof loadExpeditionData === 'function') loadExpeditionData();

                  } else {
                      Swal.fire('Gagal', res.message, 'error');
                  }
                  
                  // Resume kamera
                  if(HTML5_QRCODE) HTML5_QRCODE.resume();

              }).withFailureHandler(err => {
                  Swal.fire('Error', err.message, 'error');
                  if(HTML5_QRCODE) HTML5_QRCODE.resume();
              }).undoLastTransaction(LAST_SCANNED_BARCODE);

          } else {
              // Jika batal, resume kamera
              if(HTML5_QRCODE) HTML5_QRCODE.resume();
          }
      });
  }

  async function startCamera() {
      await new Promise(r => setTimeout(r, 500));
      await stopCamera();
      initHtml5Qrcode();
  }

  function initHtml5Qrcode() {
      const readerElement = document.getElementById('reader');
      if(!readerElement) return;
      readerElement.innerHTML = "";

      // [OPTIMASI 1] Batasi format agar scan LEBIH CEPAT & SENSITIF
      // Kita hanya fokus ke CODE_128 (Resi) dan QR_CODE
      const formats = [ 
          Html5QrcodeSupportedFormats.CODE_128, 
          Html5QrcodeSupportedFormats.QR_CODE 
      ];

      HTML5_QRCODE = new Html5Qrcode("reader", { 
          formatsToSupport: formats, 
          verbose: false 
      });
      
      const isMobile = window.innerWidth < 768;
      
      // Ukuran kotak scan disesuaikan agar pas di HP
      const boxWidth = isMobile ? 250 : 300; 
      const boxHeight = 150;

      const config = {
          fps: 20, // 20 Frame per detik (Cukup cepat)
          qrbox: { width: boxWidth, height: boxHeight },
          aspectRatio: 1.0,
          // Gunakan detektor bawaan browser jika ada (Jauh lebih ringan)
          experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      };

      // [PERBAIKAN UTAMA] Langsung minta 'environment' (Belakang) tanpa enumerasi ID
      // Ini mengatasi bug "Kamera Error" di banyak HP Android/iOS
      HTML5_QRCODE.start(
          { facingMode: "environment" }, 
          config, 
          onScanSuccess, 
          onScanFailure
      ).catch(err => {
          console.error("Gagal Start Kamera Belakang:", err);
          
          // Fallback: Jika kamera belakang gagal, coba kamera apa saja (user/depan)
          // Berguna untuk Laptop/PC webcam
          HTML5_QRCODE.start(
              { facingMode: "user" }, 
              config, 
              onScanSuccess, 
              onScanFailure
          ).catch(finalErr => {
             // Jika semua gagal, baru munculkan error
             console.error("Semua Kamera Gagal:", finalErr);
             Swal.fire({
                 title: 'Kamera Error', 
                 text: 'Browser menolak akses kamera. Coba Refresh halaman atau Reset Izin di pengaturan browser (Site Settings).', 
                 icon: 'error'
             });
          });
      });
  }

  async function stopCamera() {
      if (HTML5_QRCODE) {
          try {
              if (HTML5_QRCODE.isScanning) await HTML5_QRCODE.stop();
              HTML5_QRCODE.clear();
          } catch (err) { console.log("Camera stop warning:", err); }
      }
  }

  // 7. CALLBACK SAAT SCAN BERHASIL (PEMBAGIAN TUGAS)
  function onScanSuccess(decodedText, decodedResult) {
      if(IS_PROCESSING_SCAN) return;

      // [TAMBAHAN BARU] Simpan kode terakhir untuk fitur Undo
      LAST_SCANNED_BARCODE = decodedText;

      playBeep('SCAN');

      // --- LOGIKA CABANG UTAMA ---

      // A. JIKA MODE OPNAME -> JALANKAN PENCARIAN LOKAL
      if (SCAN_CONTEXT === 'OPNAME') {
          handleOpnameSearch(decodedText);
      }
      // B. JIKA MODE EKSPEDISI -> KIRIM KE SERVER
      else {
          handleScanProcess(decodedText);
      }
  }

  function onScanFailure(error) {}

  function handleManualTrigger(source = 'auto') {
      const input = getManualInputBySource(source) || getPrimaryManualInput();
      if (!input) return; // Safety check

      const code = input.value.trim();

      // Jika kosong, jangan proses, tapi beri feedback getar/merah sedikit
      if(!code) {
          input.classList.add('border-red-500', 'animate-pulse');
          setTimeout(() => input.classList.remove('border-red-500', 'animate-pulse'), 500);
          input.focus();
          return;
      }

      // [PERBAIKAN] Simpan kode ke memori agar bisa di-UNDO
      LAST_SCANNED_BARCODE = code; 

      console.log("Processing Manual Code:", code, "Context:", SCAN_CONTEXT); 

      // Reset input segera agar user bisa scan berikutnya (UX Cepat)
      input.value = '';
      input.focus();

      // Routing Logika
      if (typeof SCAN_CONTEXT !== 'undefined' && SCAN_CONTEXT === 'OPNAME') {
          handleOpnameSearch(code);
      } else {
          // Pastikan mode scan selalu sinkron dengan tab aktif
          syncExpeditionModeFromTab();
          // Default ke Ekspedisi (IN/OUT/RETUR)
          handleScanProcess(code);
      }
  }

  // 8. FUNGSI PENCARIAN OPNAME (LOCAL SEARCH) - BARU
  function handleOpnameSearch(barcode) {
      // 1. Kunci Scanner Sementara
      if(IS_PROCESSING_SCAN) return;
      IS_PROCESSING_SCAN = true;

      const cleanCode = barcode.trim().toLowerCase();
      let foundIndex = -1;
      let foundData = null;

      // 2. CARI DI DATA CACHE LANGSUNG (Lebih Stabil daripada cari di HTML)
      // Kita loop data asli yang didapat dari server
      for (let i = 0; i < OPNAME_CACHE.length; i++) {
          const rowData = OPNAME_CACHE[i];
          
          if (!rowData) continue;

          // Mapping Data: [3] = SKU, [15] = Barcode
          const skuDb = String(rowData[3]).trim().toLowerCase();
          const barcodeDb = String(rowData[15] || '').trim().toLowerCase();

          // Cek Kecocokan
          if (cleanCode === skuDb || (barcodeDb !== '' && cleanCode === barcodeDb)) {
              foundIndex = i;
              foundData = rowData;
              break; // Ketemu! Stop looping
          }
      }

      // 3. JIKA DATA DITEMUKAN -> UPDATE TAMPILAN
      if (foundIndex !== -1) {
          // Cari elemen UI berdasarkan ID unik yang kita generate saat render
          // ID ini konsisten 'op-row-{index}' baik di Desktop (TR) maupun Mobile (DIV)
          const rowEl = document.getElementById(`op-row-${foundIndex}`);
          
          if (rowEl) {
              playBeep('SUCCESS');

              // A. Update Input Fisik (+1)
              const inputFisik = rowEl.querySelector('.op-phys');
              if(inputFisik) {
                  let currentQty = parseInt(inputFisik.value) || 0;
                  inputFisik.value = currentQty + 1;
                  
                  // B. Trigger Hitung Selisih (Warna Merah/Hijau)
                  calcOpnameDiff(inputFisik);

                  // C. Scroll Otomatis ke Baris Tersebut
                  rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  
                  // D. Efek Kedip (Highlight)
                  rowEl.classList.add('bg-blue-100');
                  setTimeout(() => rowEl.classList.remove('bg-blue-100'), 1000);
                  
                  // E. Notifikasi Toast
                  Swal.fire({
                      toast: true, position: 'top', icon: 'success',
                      title: `+1 ${foundData[1]}`, // Nama Produk
                      text: `Total Scan: ${inputFisik.value}`,
                      showConfirmButton: false, timer: 1500
                  });
              }
          }
          // Buka kunci scanner setelah jeda (Continuous Scan)
          setTimeout(() => { IS_PROCESSING_SCAN = false; }, 1500);

      } else {
          // 4. JIKA TIDAK DITEMUKAN
          playBeep('ERROR');
          Swal.fire({
              toast: true, position: 'top', icon: 'warning',
              title: 'Tidak Ditemukan',
              text: `Kode "${barcode}" tidak ada di list opname ini.`,
              showConfirmButton: false, timer: 2000,
              background: '#fee2e2', color: '#991b1b'
          });
          setTimeout(() => { IS_PROCESSING_SCAN = false; }, 2000);
      }
  }

  // 9. FUNGSI PROSES KE SERVER (KHUSUS EKSPEDISI)
  function handleScanProcess(barcode) {
      if (EXPEDITION_MODE === 'RETUR') {
          if(HTML5_QRCODE) HTML5_QRCODE.pause();

          Swal.fire({
              title: '<span class="text-slate-700 text-xl font-bold">Kondisi Barang?</span>',
              html: `
                <div class="text-center mb-6">
                    <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">No. Resi</div>
                    <div class="font-mono font-bold text-lg text-slate-800 bg-slate-100 py-2 px-4 rounded-lg inline-block border border-slate-200 select-all">${barcode}</div>
                </div>
                <div class="grid grid-cols-2 gap-4 px-2">
                    <label class="cursor-pointer relative group">
                        <input type="radio" name="swal-retur-opt" value="GOOD" class="peer sr-only">
                        <div class="p-4 rounded-2xl border-2 border-slate-100 bg-white hover:bg-emerald-50 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 peer-checked:ring-4 peer-checked:ring-emerald-500/20 transition-all duration-200 h-full flex flex-col items-center justify-center gap-2">
                            <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mb-1"><i data-lucide="package-check" class="w-6 h-6"></i></div>
                            <span class="font-bold text-slate-700 text-sm">Layak Jual</span>
                        </div>
                        <div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 transition-opacity"><i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600 fill-white"></i></div>
                    </label>
                    <label class="cursor-pointer relative group">
                        <input type="radio" name="swal-retur-opt" value="BAD" class="peer sr-only">
                        <div class="p-4 rounded-2xl border-2 border-slate-100 bg-white hover:bg-rose-50 peer-checked:border-rose-500 peer-checked:bg-rose-50 peer-checked:ring-4 peer-checked:ring-rose-500/20 transition-all duration-200 h-full flex flex-col items-center justify-center gap-2">
                            <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mb-1"><i data-lucide="package-x" class="w-6 h-6"></i></div>
                            <span class="font-bold text-slate-700 text-sm">Rusak / BS</span>
                        </div>
                        <div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 transition-opacity"><i data-lucide="check-circle-2" class="w-5 h-5 text-rose-600 fill-white"></i></div>
                    </label>
                </div>
              `,
              showCancelButton: true,
              confirmButtonText: 'Proses Retur',
              confirmButtonColor: '#1e293b',
              cancelButtonText: 'Batal',
              width: '450px',
              buttonsStyling: true,
              didOpen: () => { if(window.lucide) lucide.createIcons(); },
              preConfirm: () => {
                  const selected = document.querySelector('input[name="swal-retur-opt"]:checked');
                  if (!selected) Swal.showValidationMessage('Pilih kondisi barang!');
                  return selected ? selected.value : null;
              }
          }).then((result) => {
              if(HTML5_QRCODE) HTML5_QRCODE.resume();
              if (result.isConfirmed && result.value) {
                  executeScanToBackend(barcode, result.value);
              }
          });
      } else {
          executeScanToBackend(barcode, null);
      }
  }

  // 10. EKSEKUSI DATA KE BACKEND (AUTO MODE - 1x scan = SHIPPED + potong stok)
  function executeScanToBackend(barcode, condition) {
      LAST_SCANNED_BARCODE = barcode;
      // 1. Tampilkan Visual Loading Overlay
      showScanFeedback('LOADING', 'Memproses...', barcode);

      // 2. Ambil Mode Saat Ini (AUTO / RETUR)
      const tabMode = getModeFromActiveExpTab();
      const mode = tabMode || EXPEDITION_MODE || 'AUTO';

      // Selaraskan state tombol mode
      if (mode !== EXPEDITION_MODE) {
          setExpeditionMode(mode);
      }

      // 3. Panggil Fungsi Server BARU: processAutoScan (Code.gs)
      // AUTO = 1x scan langsung SHIPPED + potong stok (skip PACKED)
      // RETUR = kembalikan stok jika GOOD
      google.script.run.withSuccessHandler(res => {
          if (res.success) {
              playBeep('SUCCESS');
              showScanFeedback('SUCCESS', res.title || 'Berhasil', res.message);
              loadExpeditionData();
          } else {
              playBeep('ERROR');
              showScanFeedback('ERROR', 'Gagal', res.message);
          }
      }).withFailureHandler(err => {
          playBeep('ERROR');
          showScanFeedback('ERROR', 'Error Server', err.message);
      }).processAutoScan(barcode, mode, condition);
  }

  // 8. EFEK VISUAL OVERLAY (FEEDBACK)
  function showScanFeedback(type, title, msg) {
      const overlay = document.getElementById('scan-feedback-overlay');
      const iconContainer = document.getElementById('overlay-icon');
      const titleEl = document.getElementById('overlay-title');
      const msgEl = document.getElementById('overlay-msg');

      if(!overlay) return;

      overlay.classList.remove('hidden');

      // Reset Style
      iconContainer.className = "w-20 h-20 rounded-full flex items-center justify-center shadow-2xl transition-transform duration-300 scale-100";

      if(type === 'LOADING') {
          iconContainer.classList.add('bg-white');
          iconContainer.innerHTML = '<i data-lucide="loader-2" class="w-10 h-10 text-blue-600 animate-spin"></i>';
          titleEl.className = "text-2xl font-bold text-white tracking-wide drop-shadow-md mb-1";
      }
      else if(type === 'SUCCESS') {
          iconContainer.classList.add('bg-emerald-500');
          iconContainer.innerHTML = '<i data-lucide="check" class="w-10 h-10 text-white"></i>';
          titleEl.className = "text-2xl font-bold text-emerald-400 tracking-wide drop-shadow-md mb-1";

          // Auto hide setelah 1.5 detik
          setTimeout(() => { overlay.classList.add('hidden'); }, 1500);
      }
      else if(type === 'ERROR') {
          iconContainer.classList.add('bg-red-500');
          iconContainer.innerHTML = '<i data-lucide="x" class="w-10 h-10 text-white"></i>';
          titleEl.className = "text-2xl font-bold text-red-400 tracking-wide drop-shadow-md mb-1";

          // Auto hide setelah 2 detik
          setTimeout(() => { overlay.classList.add('hidden'); }, 2000);
      }

      titleEl.innerText = title;
      msgEl.innerText = msg;

      if(window.lucide) lucide.createIcons();
  }

  // 9. AUDIO FEEDBACK (BEEP SOUND GENERATOR)
  // Menggunakan AudioContext agar tidak perlu file mp3 eksternal
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playBeep(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      if (type === 'SCAN') {
          oscillator.type = 'sine';
          oscillator.frequency.value = 800; // Nada Menengah
          gainNode.gain.value = 0.1;
          oscillator.start();
          setTimeout(() => oscillator.stop(), 100);
      }
      else if (type === 'SUCCESS') {
          oscillator.type = 'square';
          oscillator.frequency.value = 1200; // Nada Tinggi (Happy)
          gainNode.gain.value = 0.1;
          oscillator.start();
          // Efek 'Ti-Nit'
          setTimeout(() => { oscillator.frequency.value = 1800; }, 100);
          setTimeout(() => oscillator.stop(), 300);
      }
      else if (type === 'ERROR') {
          oscillator.type = 'sawtooth';
          oscillator.frequency.value = 200; // Nada Rendah (Buzz)
          gainNode.gain.value = 0.1;
          oscillator.start();
          setTimeout(() => oscillator.stop(), 400);
      }
  }

  // --- STATE MANAGEMENT OPNAME ---

  // LOGIKA STOCK OPNAME

  let OPNAME_CACHE = []; // Menyimpan data produk untuk opname

  // 1. LOAD DATA (Dipanggil saat tab dibuka)
  function loadStockOpname() {
      // [UPDATE] Gunakan variable global, bukan radio button lagi
      const opnameType = ACTIVE_OPNAME_TYPE;

      const tbody = document.getElementById('opname-table-body');
      // Beri warna loading beda biar user sadar konteksnya

  // 3. KALKULASI REAL-TIME
  function calcOpnameDiff(input) {
      const row = input.closest('tr');
      const sysVal = parseInt(row.querySelector('.op-sys').value) || 0;
      const physValStr = input.value;
      const diffEl = row.querySelector('.op-diff');

      // Jika kosong, reset tampilan
      if (physValStr === '') {
          diffEl.innerText = '-';
          diffEl.className = 'op-diff text-sm font-bold text-gray-300';
          row.className = "hover:bg-amber-50/30 border-b border-gray-100 last:border-0 transition group"; // Reset warna baris
          return;
      }

      const physVal = parseInt(physValStr);
      const diff = physVal - sysVal;

      if (diff === 0) {
          diffEl.innerText = "OK";
          diffEl.className = 'op-diff text-xs font-bold bg-emerald-100 text-emerald-700 px-2 py-1 rounded border border-emerald-200';
          row.className = "bg-emerald-50/30 border-b border-emerald-100 transition group";
      } else if (diff > 0) {
          diffEl.innerText = `+${diff}`;
          diffEl.className = 'op-diff text-sm font-bold text-blue-600'; // Lebih (Found)
          row.className = "bg-blue-50/30 border-b border-blue-100 transition group";
      } else {
          diffEl.innerText = `${diff}`; // Minus (Lost)
          diffEl.className = 'op-diff text-sm font-bold text-red-600';
          row.className = "bg-red-50/30 border-b border-red-100 transition group";
      }
  }

  // 4. FILTER TABLE
  function filterOpnameTable() {
      const keyword = document.getElementById('searchOpnameBox').value.toLowerCase();
      // Filter dari OPNAME_CACHE
      const filtered = OPNAME_CACHE.filter(row => {
          // [1]Nama, [3]SKU, [12]Rak
          const txt = (row[1] + " " + row[3] + " " + row[12]).toLowerCase();
          return txt.includes(keyword);
      });
      renderOpnameTable(filtered);
  }

  // 5. SUBMIT DATA
  function submitStockOpname() {
      // [UPDATE] Gunakan variable global
      const opnameType = ACTIVE_OPNAME_TYPE;

      const rows = document.querySelectorAll('#opname-table-body tr');
      const adjustments = [];

      rows.forEach(row => {
          const physInput = row.querySelector('.op-phys');
          // Hanya proses yang diisi angkanya
          if (physInput && physInput.value !== '') {
              const sku = row.querySelector('.op-sku').value;
              const sys = parseInt(row.querySelector('.op-sys').value) || 0;
              const phys = parseInt(physInput.value);
              const note = row.querySelector('.op-note').value;

              adjustments.push({
                  sku: sku,
                  oldStock: sys,
                  newStock: phys,
                  diff: phys - sys,
                  note: note || (phys === sys ? 'SO: Sesuai' : 'SO: Selisih')
              });
          }
      });

      if (adjustments.length === 0) {
          Swal.fire('Info', 'Belum ada data fisik yang diinput.', 'info');
          return;
      }

      // [UPDATE] Bagian SweetAlert Konfirmasi (Biar warnanya sesuai konteks)
      const confirmColor = opnameType === 'PRODUCT' ? '#2563EB' : '#D97706'; // Biru vs Amber

      Swal.fire({
          title: `Simpan Opname ${opnameType === 'PRODUCT' ? 'Produk' : 'Bahan'}?`,
          text: `Akan mengupdate stok untuk ${adjustments.length} item.`,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'Ya, Update Stok',
          confirmButtonColor: confirmColor
      }).then((res) => {
          if(res.isConfirmed) {
              Swal.fire({title: 'Menyimpan...', didOpen: ()=>Swal.showLoading()});

              google.script.run.withSuccessHandler(res => {
                  Swal.fire('Berhasil', res.message, 'success');
                  document.getElementById('searchOpnameBox').value = '';

                  loadStockOpname(); // Reload

                  // Update Global Cache sesuai tipe
                  if(opnameType === 'PRODUCT') loadInitialData();
                  else loadMaterialData();

              }).processStockOpname(adjustments, opnameType);
          }
      });
  }
