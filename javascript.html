  // --- C. SUBMIT USER (JSON FORMAT) ---
  function submitNewUser(e) {
      e.preventDefault();

      const btn = e.target.querySelector('button[type="submit"]');
      const originalBtn = btn.innerHTML;
      btn.innerHTML = 'Menyimpan...';
      btn.disabled = true;

      const formData = new FormData(e.target);

      // Ambil Mode dari Hidden Input
      const mode = document.getElementById('formMode').value; // 'add' atau 'edit'

      // 1. BANGUN OBJEK PERMISSION
      let permissionObj = {};

      APP_MODULES.forEach(module => {
          const checkboxes = document.querySelectorAll(`input[name="perm_${module.id}"]:checked`);
          if (checkboxes.length > 0) {
              permissionObj[module.id] = {};
              checkboxes.forEach(chk => {
                  permissionObj[module.id][chk.value] = true;
              });
          }
      });

      // 2. Siapkan Payload
      const payload = {
          username: formData.get('username'),
          old_username: document.getElementById('oldUsername').value, // Penting untuk Edit
          email: formData.get('email'),
          password: formData.get('password'),
          role: formData.get('role'),
          access: JSON.stringify(permissionObj)
      };

      // 3. Tentukan Fungsi Backend: Update atau Add?
      const backendFunction = (mode === 'edit') ? 'updateUser' : 'addNewUser';

      google.script.run.withSuccessHandler(res => {
          btn.innerHTML = originalBtn;
          btn.disabled = false;

          if(res.success) {
              if(typeof Swal !== 'undefined') {
                  Swal.fire('Berhasil', res.message, 'success');
              } else {
                  alert(res.message);
              }
              closeAddUserModal();
              loadUsersData();
          } else {
              if(typeof Swal !== 'undefined') Swal.fire('Error', res.message, 'error');
              else alert(res.message);
          }
      })[backendFunction](payload); // Panggil fungsi dinamis
  }

  // --- D. TOGGLE PASSWORD VISIBILITY ---
  function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const iconEye = btn.querySelector('[data-lucide="eye"]');
      const iconEyeOff = btn.querySelector('[data-lucide="eye-off"]'); // Pastikan menggunakan selector yang tepat

      // Periksa apakah elemen icon ditemukan (untuk keamanan jika struktur icon berbeda)
      // Jika menggunakan SVG langsung dari Lucide render, kita memanipulasi class parent/svg nya
      // Namun cara termudah dengan Lucide i-tag wrapper:

      if (input.type === "password") {
          input.type = "text";
          // Ganti Icon: Sembunyikan Eye, Tampilkan Eye-Off
          if(iconEye) iconEye.classList.add('hidden');
          if(iconEyeOff) iconEyeOff.classList.remove('hidden');
      } else {
          input.type = "password";
          // Ganti Icon: Tampilkan Eye, Sembunyikan Eye-Off
          if(iconEye) iconEye.classList.remove('hidden');
          if(iconEyeOff) iconEyeOff.classList.add('hidden');
      }
  }

  // 1. CEK SESI (UPDATE FIX BLANK PAGE)
  function checkSession() {
      const session = localStorage.getItem('bantuSellerSession');
      const loginScreen = document.getElementById('login-screen');
      const dashboardScreen = document.getElementById('dashboard-screen');

      // Debugging: Cek apakah elemen ditemukan
      if (!loginScreen || !dashboardScreen) {
          console.error("ERROR CRITICAL: ID 'login-screen' atau 'dashboard-screen' tidak ditemukan di index.html");
          // Fallback: Jika elemen tidak ketemu, coba cari berdasarkan class atau struktur (opsional),
          // tapi sebaiknya perbaiki ID di HTML seperti instruksi no 1.
      }

      if (session) {
          // --- USER LOGIN ---
          try {
              const sessData = JSON.parse(session);
              currentUser = sessData;
              GLOBAL_USERS_DATA = sessData;

              // PERBAIKAN: Update Nama & Role (Pastikan ID HTML sesuai)
              if (sessData.user) {
                  const uName = sessData.user.username || 'User';
                  const uRole = sessData.user.role || 'Staff';

                  // Debugging: Cek apakah elemen ditemukan?
                  const elName = document.getElementById('sidebar-user-name');
                  if (elName) {
                      elName.innerText = uName; // Ubah Teks Nama
                  } else {
                      console.warn("Element sidebar-user-name TIDAK DITEMUKAN!");
                  }

                  const elRole = document.getElementById('sidebar-user-role');
                  if(elRole) elRole.innerText = uRole;

                  const elImg = document.getElementById('sidebar-user-img');
                  if(elImg) elImg.src = 'https://ui-avatars.com/api/?name=' + uName + '&background=random&color=fff&size=128';
              }

              // PERBAIKAN: Terapkan Hak Akses saat Reload
              if (sessData.user) {
                  applyUserAccess(sessData.user);
              }

              // TUKAR TAMPILAN
              var licScreen = document.getElementById('license-screen');
              if(licScreen) { licScreen.classList.add('hidden'); licScreen.style.display = 'none'; }
              if(loginScreen) {
                  loginScreen.classList.add('hidden'); // Sembunyikan Login
                  loginScreen.style.display = 'none';  // Paksa sembunyi via style inline
              }
              if(dashboardScreen) {
                  dashboardScreen.classList.remove('hidden');
                  dashboardScreen.classList.add('flex');
                  dashboardScreen.style.display = 'flex'; // Paksa muncul
              }

              // Load Halaman Terakhir & Cek Izin Akses
              let targetPage = localStorage.getItem('lastActivePage') || 'dashboard';

              // 1. Cek apakah tombol navigasi ke halaman target TERSEDIA (Tidak Hidden)?
              // Kita mencari button yang memiliki onclick="switchPage('nama_halaman')"
              const targetBtn = document.querySelector(`button[onclick*="switchPage('${targetPage}')"]`);

              if (targetBtn && !targetBtn.classList.contains('hidden')) {
                  // Jika punya akses, buka halaman tersebut
                  switchPage(targetPage);
              } else {
                  // 2. Jika Dashboard/Halaman Terakhir DILARANG (Hidden), cari menu PERTAMA yang IZINKAN
                  // Selector ini mencari tombol switchPage apapun yang TIDAK punya class hidden
                  const firstAllowedBtn = document.querySelector(`button[onclick*="switchPage"]:not(.hidden)`);
                  
                  if (firstAllowedBtn) {
                       // Ambil ID halaman dari text onclick. Contoh: switchPage('orders') -> orders
                       const match = firstAllowedBtn.getAttribute('onclick').match(/switchPage\('([^']+)'\)/);
                       if(match && match[1]) {
                           console.log("Redirecting to authorized page:", match[1]);
                           switchPage(match[1]);
                       }
                  }
              }
              
              loadInitialData(); // Tetap load data background
              loadSettings();

          } catch (e) {
              console.error("Sesi rusak:", e);
              logout();
          }
      } else {
          // --- USER BELUM LOGIN (POSISI LOGOUT) ---

          // Pastikan Dashboard Sembunyi
          if(dashboardScreen) {
              dashboardScreen.classList.add('hidden');
              dashboardScreen.classList.remove('flex');
              dashboardScreen.style.display = 'none';
          }

          // Pastikan Login Muncul
          if(loginScreen) {
              loginScreen.classList.remove('hidden');
              loginScreen.style.display = 'flex'; // Paksa muncul dengan display flex (agar tengah)
          } else {
              // Jika ID salah, setidaknya body jangan blank (opsional, untuk debug)
              document.body.innerHTML = '<div style="color:white; text-align:center; padding:50px;">Error: ID "login-screen" tidak ditemukan di index.html. Silakan perbaiki script/HTML.</div>';
          }
      }
  }

  // 2. HANDLE LOGIN SUBMIT
  function handleLoginSubmit(e) {
      e.preventDefault();

      const btn = document.getElementById('signin-button');
      const errorMsg = document.getElementById('login-error');
      const userField = document.getElementById('username');
      const passField = document.getElementById('password');

      // Safety Check: Jika elemen tidak ditemukan, stop
      if (!btn || !userField || !passField) return;

      // Hardcode teks tombol untuk memastikan reset bersih
      const btnNormalText = "Masuk";

      // UI Loading
      btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Memproses...</span>';
      btn.disabled = true;

      // Sembunyikan error sebelumnya
      if(errorMsg) errorMsg.classList.add('hidden');
      if(window.lucide) lucide.createIcons();

      // Panggil Backend
      google.script.run.withSuccessHandler(res => {
          
          // Reset Tombol
          btn.innerHTML = btnNormalText;
          btn.disabled = false;
          if(window.lucide) lucide.createIcons();

          if (res && res.success) { // Cek res tidak null
              // --- LOGIN SUKSES ---
              const sessionData = {
                  user: res.user,
                  loginTime: new Date().getTime()
              };
              localStorage.setItem('bantuSellerSession', JSON.stringify(sessionData));

              // 1. Terapkan Hak Akses
              applyUserAccess(res.user);

              // 2. Update Tampilan Sidebar Langsung (Tanpa variabel ganda)
              const sbName = document.getElementById('sidebar-user-name');
              const sbRole = document.getElementById('sidebar-user-role');
              const sbImg = document.getElementById('sidebar-user-img');

              if (sbName) sbName.innerText = res.user.username;
              if (sbRole) sbRole.innerText = res.user.role;
              // Gunakan String concatenation aman
              if (sbImg) sbImg.src = 'https://ui-avatars.com/api/?name=' + res.user.username + '&background=random&color=fff';

              UI.showSuccess('Login Berhasil', res.message);
              
              // 3. Switch Page (Dengan Delay)
              setTimeout(() => {
                  const loginScr = document.getElementById('login-screen');
                  const dashScr = document.getElementById('dashboard-screen');

                  // Sembunyikan Login
                  if(loginScr) {
                      loginScr.classList.add('hidden');
                      loginScr.style.display = 'none';
                  }

                  // Tampilkan Dashboard Screen Wrapper
                  if(dashScr) {
                      dashScr.classList.remove('hidden');
                      dashScr.style.display = 'flex';
                  }

                  // --- LOGIKA REDIRECT OTOMATIS BERDASARKAN PERMISSION ---
                  
                  // 1. Cek apakah Dashboard diizinkan?
                  const dashboardBtn = document.querySelector('button[onclick*="switchPage(\'dashboard\')"]');

                  if (dashboardBtn && !dashboardBtn.classList.contains('hidden')) {
                      // Jika punya akses dashboard, masuk dashboard
                      switchPage('dashboard'); 
                  } else {
                      // 2. Jika Dashboard di-hide, cari tombol menu PERTAMA yang terlihat (Visible)
                      // Kita cari button apa saja yang punya fungsi switchPage dan tidak hidden
                      const firstAllowedBtn = document.querySelector(`button[onclick*="switchPage"]:not(.hidden)`);

                      if (firstAllowedBtn) {
                          // Ambil nama halaman dari atribut onclick
                          const match = firstAllowedBtn.getAttribute('onclick').match(/switchPage\('([^']+)'\)/);
                          if(match && match[1]) {
                              switchPage(match[1]); // Pindah ke halaman pertama yang diizinkan (misal: orders)
                          }
                      } else {
                          // Fallback terakhir jika tidak ada menu sama sekali yang terbuka (Kasus aneh)
                          // Biarkan kosong atau tampilkan pesan error
                          console.warn("User tidak memiliki akses menu apapun.");
                      }
                  }
              }, 1000);

          } else {
              // --- LOGIN GAGAL ---
              const pesan = res ? res.message : "Gagal menghubungi server.";
              if(errorMsg) {
                  errorMsg.innerText = pesan;
                  errorMsg.classList.remove('hidden');
              } else {
                  Swal.fire('Gagal', pesan, 'error');
              }
          }
      }).withFailureHandler(err => {
           // Reset Tombol
           btn.innerHTML = btnNormalText;
           btn.disabled = false;
           if(window.lucide) lucide.createIcons();

           // Tampilkan Error
           if(errorMsg) {
               errorMsg.innerText = "Error Sistem: " + err.message;
               errorMsg.classList.remove('hidden');
           }
      }).doLogin(userField.value, passField.value, (bsGetLicense() || {}).sheetId || '');
  }

  // ==========================================
  // --- ACCESS CONTROL (SMART HEADER HIDING) ---
  // ==========================================
  function applyUserAccess(userData) {
      if (!userData) return;

      // 1. Normalisasi Role
      const role = String(userData.role || 'Staff').trim().toLowerCase();

      // 2. Mapping: "Kunci Sederhana" -> "Selector Tombol Sidebar"
      const menuMap = {
          'dashboard': 'button[onclick*="switchPage(\'dashboard\')"]',
          'orders': 'button[onclick*="switchPage(\'orders\')"]',
          'production': 'button[onclick*="switchPage(\'production\')"]',
          'products': 'button[onclick*="switchPage(\'products\')"]',
          'expedition': 'button[onclick*="switchPage(\'expedition\')"]',
          'stock-opname': 'button[onclick*="switchPage(\'stock-opname\')"]',
          'users': '#nav-users',
          'logs': '#nav-logs'
      };

      // 3. BYPASS: Jika Role Owner/Super Admin/Pemilik -> Buka Semua
      if (['owner', 'super admin', 'pemilik'].includes(role)) {
          // Buka semua item
          Object.values(menuMap).forEach(selector => {
              const el = document.querySelector(selector);
              if(el) el.classList.remove('hidden');
          });
          // Buka Induk Settings
          const settingsBtn = document.querySelector('button[onclick*="submenu-settings"]');
          if(settingsBtn) {
              settingsBtn.classList.remove('hidden');
              if(settingsBtn.parentElement) settingsBtn.parentElement.classList.remove('hidden');
          }
          // Buka semua Header
          document.querySelectorAll('nav div.uppercase').forEach(el => el.classList.remove('hidden'));
          return;
      }

      // 4. PARSE AKSES USER
      let access = {};
      try {
          access = typeof userData.access === 'string' ? JSON.parse(userData.access) : (userData.access || {});
      } catch (e) {
          console.error("Gagal parse akses user:", e);
          access = {};
      }

      // 5. LOGIKA HIDE/SHOW ITEM MENU
      for (const [key, selector] of Object.entries(menuMap)) {
          const el = document.querySelector(selector);
          if (!el) continue;

          // Cek izin (support nama "dashboard" ATAU "dashboard-content")
          const permData = access[key] || access[key + '-content'];

          let isAllowed = false;
          
          // Cek Tipe Data Izin
          if (permData === true) {
              isAllowed = true;
          } else if (typeof permData === 'object' && permData !== null) {
              if (permData.view === true) isAllowed = true;
          }

          // Terapkan Class Hidden
          if (isAllowed) {
              el.classList.remove('hidden');
          } else {
              el.classList.add('hidden');
          }
      }

      // 6. LOGIKA KHUSUS "SETTINGS" (Hide Induknya Juga)
      const settingsBtn = document.querySelector('button[onclick*="submenu-settings"]');
      if (settingsBtn) {
          const pUsers = access['users'] || access['users-content'];
          const uOk = (pUsers === true || (pUsers && pUsers.view === true));
          
          const pLogs = access['logs'] || access['logs-content'];
          const lOk = (pLogs === true || (pLogs && pLogs.view === true));

          // Ambil elemen pembungkus (Div Wrapper) agar bisa di-hide total
          const settingsWrapper = settingsBtn.parentElement; 

          if (!uOk && !lOk) {
              settingsBtn.classList.add('hidden');
              // Hide wrapper pembungkusnya juga agar tidak dianggap "visible item" oleh logic header
              if(settingsWrapper && settingsWrapper.tagName === 'DIV') settingsWrapper.classList.add('hidden');
          } else {
              settingsBtn.classList.remove('hidden');
              if(settingsWrapper && settingsWrapper.tagName === 'DIV') settingsWrapper.classList.remove('hidden');
          }
      }

      // 7. CLEANUP: SEMBUNYIKAN JUDUL TAB (HEADER) JIKA KOSONG
      // Kita loop elemen di dalam <nav>
      const nav = document.querySelector('nav');
      if (nav) {
          const children = Array.from(nav.children);
          let currentHeader = null;
          let groupHasVisibleItem = false;

          children.forEach((child) => {
              // Deteksi apakah ini elemen Header/Judul?
              // Cirinya: Tag DIV dan punya class 'uppercase' serta 'tracking-widest' (sesuai index.html)
              const isHeader = child.tagName === 'DIV' && child.classList.contains('uppercase') && child.classList.contains('tracking-widest');

              if (isHeader) {
                  // Jika ketemu header baru, proses header sebelumnya dulu
                  if (currentHeader) {
                      if (!groupHasVisibleItem) {
                          currentHeader.classList.add('hidden'); // Sembunyikan header lama karena kosong
                      } else {
                          currentHeader.classList.remove('hidden');
                      }
                  }
                  // Set header baru & reset flag
                  currentHeader = child;
                  groupHasVisibleItem = false;
              } else {
                  // Ini adalah Item Menu (Button atau Wrapper)
                  // Cek apakah item ini terlihat (tidak punya class hidden)
                  if (!child.classList.contains('hidden')) {
                      groupHasVisibleItem = true;
                  }
              }
          });

          // Proses header terakhir (karena loop selesai)
          if (currentHeader) {
              if (!groupHasVisibleItem) {
                  currentHeader.classList.add('hidden');
              } else {
                  currentHeader.classList.remove('hidden');
              }
          }
      }
  }

  // --- FUNGSI HITUNG GRAND TOTAL (UI ONLY - FIXED DISKON) ---
  function calculateGrandTotal() {
    // 1. Hitung Ulang dari Array ORDER_CART agar akurat 100%
    let totalBruto = 0;
    let totalDiskon = 0;

    ORDER_CART.forEach(item => {
        const qty = parseInt(item.qty) || 0;
        const harga = parseFloat(item.hargaJual) || 0;
        const diskonItem = parseFloat(item.diskon) || 0;

        totalBruto += (harga * qty);
        totalDiskon += diskonItem;
    });

    // 2. Ambil Ongkir (Dari Input Manual)
    let textOngkir = document.getElementById('orderOngkir').value;
    let valOngkir = parseFormattedNumber(textOngkir);

    // 3. Hitung Netto & Grand Total
    let totalNettoBarang = totalBruto - totalDiskon;
    let grandTotal = totalNettoBarang + valOngkir;

    // 4. Update UI Ringkasan (Target elemen di index.html)
    // Pastikan ID elemen ini ada di HTML Anda (lihat langkah 2 di bawah)
    
    // Update Subtotal (Murni Barang)
    document.getElementById('cartTotalOmset').innerText = formatRupiah(totalNettoBarang);

    // Update Ongkir Display
    document.getElementById('displayOngkirSummary').innerText = formatRupiah(valOngkir);

    // Update Grand Total
    document.getElementById('grandTotalDisplay').innerText = formatRupiah(grandTotal);

    // [OPSIONAL] Tampilkan Info Diskon jika ada
    const diskonContainer = document.getElementById('summary-discount-row');
    if (diskonContainer) {
        if (totalDiskon > 0) {
            diskonContainer.classList.remove('hidden');
            document.getElementById('displayTotalDiskon').innerText = "- " + formatRupiah(totalDiskon);
        } else {
            diskonContainer.classList.add('hidden');
        }
    }
  }

  // ==========================================================
  // ATUR SEMUA VARIASI (Bulk Set Stok/HPP/Jual)
  // ==========================================================
  function applyBulkVariant() {
    var stokVal = document.getElementById('bulk-var-stok').value;
    var hppVal = document.getElementById('bulk-var-hpp').value;
    var jualVal = document.getElementById('bulk-var-jual').value;
    var marginVal = document.getElementById('bulk-var-margin').value;
    var marginTiktokVal = document.getElementById('bulk-var-margin-tiktok').value;

    if (!stokVal && !hppVal && !jualVal && !marginVal && !marginTiktokVal) {
      Swal.fire('Isi Dulu', 'Isi minimal satu nilai untuk diterapkan.', 'warning');
      return;
    }

    // Format angka dengan titik ribuan
    function formatBulk(val) {
      if (!val) return '';
      var num = String(val).replace(/\D/g, '');
      return num ? new Intl.NumberFormat('id-ID').format(Number(num)) : '';
    }

    var rows = document.querySelectorAll('#modal-variant-container .variant-row');
    var count = 0;

    rows.forEach(function(row) {
      if (stokVal) {
        var el = row.querySelector('.var-qty');
        if (el && !el.hasAttribute('readonly')) { el.value = formatBulk(stokVal); }
      }
      if (hppVal) {
        var el = row.querySelector('.var-price');
        if (el && !el.hasAttribute('readonly')) { el.value = formatBulk(hppVal); }
      }
      if (jualVal) {
        var el = row.querySelector('.var-sell');
        if (el) { el.value = formatBulk(jualVal); }
      }
      if (marginVal) {
        var el = row.querySelector('.var-margin');
        if (el) { el.value = marginVal; }
      }
      if (marginTiktokVal) {
        var el = row.querySelector('.var-margin-tiktok');
        if (el) { el.value = marginTiktokVal; }
      }
      count++;
    });

    if (count > 0) {
      Swal.fire({icon:'success', title:'Diterapkan!', text:'Nilai diterapkan ke ' + count + ' variasi.', timer:1500, showConfirmButton:false});
    }
  }

  function loadBackupPage() {
    // Load sheet list
    google.script.run.withSuccessHandler(function(sheets) {
      var container = document.getElementById('backup-sheet-list');
      if (!container) return;
      container.innerHTML = '';
      sheets.forEach(function(s) {
        var div = document.createElement('label');
        div.className = 'flex items-center justify-between p-2.5 rounded-lg border border-gray-100 hover:border-cyan-200 hover:bg-cyan-50/30 cursor-pointer transition';
        div.innerHTML = '<div class="flex items-center gap-2"><input type="checkbox" class="backup-cb accent-cyan-500 w-4 h-4" value="' + s.name + '"><span class="text-xs font-medium text-slate-700">' + s.name + '</span></div><span class="text-[10px] font-bold text-slate-400">' + s.rows + ' rows</span>';
        container.appendChild(div);
      });
    }).getBackupSheetList();



    // Select all checkbox
    var selAll = document.getElementById('backup-select-all');
    if (selAll) {
      selAll.onclick = function() {
        document.querySelectorAll('.backup-cb').forEach(function(cb) { cb.checked = selAll.checked; });
      };
    }
  }

  function getSelectedSheets() {
    var selected = [];
    document.querySelectorAll('.backup-cb:checked').forEach(function(cb) { selected.push(cb.value); });
    return selected;
  }

  function doBackupDownload() {
    var sheets = getSelectedSheets();
    if (sheets.length === 0) { Swal.fire('Pilih Sheet','Centang minimal 1 sheet untuk backup.','warning'); return; }

    UI.showLoading('Menyiapkan Backup...');
    google.script.run.withSuccessHandler(function(data) {
      UI.close();
      if (!data || data.length === 0) { Swal.fire('Kosong','Tidak ada data untuk di-backup.','info'); return; }

      // Buat workbook Excel pakai SheetJS
      var wb = XLSX.utils.book_new();
      data.forEach(function(sheet) {
        var wsData = [sheet.headers].concat(sheet.data);
        var ws = XLSX.utils.aoa_to_sheet(wsData);
        XLSX.utils.book_append_sheet(wb, ws, sheet.name.substring(0, 31));
      });

      var timestamp = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, 'Backup_Gudang_' + timestamp + '.xlsx');

      var resEl = document.getElementById('backup-result');
      if (resEl) { resEl.classList.remove('hidden'); resEl.textContent = 'File Excel berhasil didownload!'; setTimeout(function(){resEl.classList.add('hidden')}, 3000); }
    }).withFailureHandler(function(err) {
      UI.close();
      Swal.fire('Error', err.message || 'Gagal mengambil data', 'error');
    }).getBackupData(sheets);
  }

  function doBackupDrive() {
    var sheets = getSelectedSheets();
    if (sheets.length === 0) { Swal.fire('Pilih Sheet','Centang minimal 1 sheet.','warning'); return; }

    UI.showLoading('Menyimpan ke Google Drive...');
    google.script.run.withSuccessHandler(function(res) {
      UI.close();
      if (res && res.success) {
        Swal.fire({
          icon: 'success',
          title: 'Backup Berhasil!',
          html: '<p class="text-sm text-slate-600">File: <b>' + res.fileName + '</b></p><a href="' + res.url + '" target="_blank" class="text-blue-600 text-sm font-bold hover:underline">Buka di Google Drive</a>',
          confirmButtonColor: '#0f172a'
        });
      } else {
        Swal.fire('Gagal', res.message || 'Backup gagal', 'error');
      }
    }).withFailureHandler(function(err) {
      UI.close();
      Swal.fire('Error', err.message || 'Gagal backup', 'error');
    }).backupToDrive(sheets);
  }

  function doResetSheet() {
    var sheets = getSelectedSheets();
    if (sheets.length === 0) { Swal.fire('Pilih Sheet','Centang minimal 1 sheet.','warning'); return; }

    Swal.fire({
      title: 'Reset Data?',
      html: '<p class="text-sm text-slate-600 mb-3">Sheet yang akan direset:</p><div class="text-left bg-red-50 p-3 rounded-lg mb-3">' + sheets.map(function(s){return '<div class="text-xs font-bold text-red-700">• '+s+'</div>'}).join('') + '</div><p class="text-xs text-red-500 font-bold">Ketik <span class="bg-red-100 px-1 rounded">RESET</span> untuk konfirmasi:</p>',
      input: 'text',
      inputPlaceholder: 'Ketik RESET',
      showCancelButton: true,
      cancelButtonText: 'Batal',
      confirmButtonText: 'Reset Sekarang',
      confirmButtonColor: '#dc2626',
      inputValidator: function(val) { if (val !== 'RESET') return 'Ketik RESET untuk konfirmasi'; }
    }).then(function(result) {
      if (!result.isConfirmed) return;
      UI.showLoading('Mereset Data...');

      }).withFailureHandler(function(err) {

        Swal.fire('Error', err.message, 'error');
      }).resetSheetData(sheets, 'RESET-CONFIRM');

  function switchHPTab(tab) {
    HP_ACTIVE_TAB = tab;
    var btnH = document.getElementById('hp-tab-hutang');
    var btnP = document.getElementById('hp-tab-piutang');
    btnH.className = 'px-4 py-2 rounded-lg text-sm font-bold transition ' + (tab === 'HUTANG' ? 'bg-white text-rose-600 shadow-sm' : 'text-slate-500 hover:text-slate-700');

  function updateHPFilterNama() {
    var sel = document.getElementById('hp-filter-nama');
    if (!sel) return;
    var names = new Set();
    HP_DATA.forEach(function(r) { if (String(r[1]).toUpperCase() === HP_ACTIVE_TAB) names.add(r[4]); });
    var html = '<option value="ALL">Semua Nama</option>';
    names.forEach(function(n) { html += '<option value="' + n + '">' + n + '</option>'; });
    sel.innerHTML = html;
  }

  function renderHPTable() {
    var tbody = document.getElementById('hp-table-body');
    if (!tbody) return;
    var filterStatus = document.getElementById('hp-filter-status').value;
    var filterNama = document.getElementById('hp-filter-nama').value;
    var search = (document.getElementById('hp-search').value || '').toLowerCase();
    var today = new Date(); today.setHours(0,0,0,0);

    var filtered = HP_DATA.filter(function(r) {
      if (String(r[1]).toUpperCase() !== HP_ACTIVE_TAB) return false;
      var status = String(r[10]).toUpperCase();
      if (filterStatus === 'BELUM_LUNAS' && status !== 'BELUM_LUNAS') return false;
      if (filterStatus === 'LUNAS' && status !== 'LUNAS') return false;
      if (filterStatus === 'JATUH_TEMPO') {
        if (status !== 'BELUM_LUNAS') return false;
        var jt = r[3] ? new Date(r[3]) : null;
        if (!jt || isNaN(jt.getTime()) || jt > today) return false;
      }
      if (filterNama !== 'ALL' && r[4] !== filterNama) return false;
      if (search) {
        var hay = (r[0]+' '+r[4]+' '+r[6]+' '+r[12]).toLowerCase();
        if (hay.indexOf(search) === -1) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-12 text-center text-gray-400 italic">Tidak ada data.</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(function(r) {
      var status = String(r[10]).toUpperCase();
      var isLunas = status === 'LUNAS';
      var jtDate = r[3] ? new Date(r[3]) : null;
      var isOverdue = jtDate && !isNaN(jtDate.getTime()) && !isLunas && jtDate <= today;

      var badge = isLunas
        ? '<span class="px-2 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-bold">LUNAS</span>'
        : isOverdue
          ? '<span class="px-2 py-1 rounded-full bg-red-50 text-red-600 border border-red-200 text-[10px] font-bold animate-pulse">LEWAT TEMPO</span>'
          : '<span class="px-2 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200 text-[10px] font-bold">BELUM LUNAS</span>';

      var totalVal = parseNumber(r[9]);
      var dibayar = parseNumber(r[15] || 0); // Kolom P (index 15) = Sudah Dibayar
      var sisaVal = totalVal - dibayar;

      var aksi = '';
      if (!isLunas) aksi += '<button onclick="lunasHP(\'' + r[0] + '\')" class="px-2 py-1 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-lg text-[10px] font-bold hover:bg-emerald-100 transition">Bayar</button>';
      aksi += '<button onclick="hapusHP(\'' + r[0] + '\')" class="px-2 py-1 bg-red-50 text-red-500 border border-red-200 rounded-lg text-[10px] font-bold hover:bg-red-100 transition">Hapus</button>';

      var sisaHtml = isLunas
        ? '<div class="text-[10px] text-emerald-600 font-bold mt-0.5">Lunas</div>'
        : (dibayar > 0 ? '<div class="text-[10px] text-amber-600 font-bold mt-0.5">Sisa: ' + formatRupiah(sisaVal) + '</div>' : '');

      return '<tr class="hover:bg-gray-50 transition' + (isOverdue ? ' bg-red-50/30' : '') + '">' +
        '<td class="px-4 py-3 text-xs text-slate-600">' + (r[2]||'-') + '</td>' +
        '<td class="px-4 py-3 text-xs ' + (isOverdue?'text-red-600 font-bold':'text-slate-500') + '">' + (r[3]||'-') + '</td>' +
        '<td class="px-4 py-3"><div class="text-sm font-bold text-slate-700">' + r[4] + '</div></td>' +
        '<td class="px-4 py-3"><div class="text-xs font-medium text-slate-700">' + r[6] + '</div><div class="text-[10px] text-slate-400 font-mono">' + r[5] + '</div></td>' +
        '<td class="px-4 py-3 text-center text-sm font-bold">' + r[7] + '</td>' +
        '<td class="px-4 py-3 text-right"><div class="text-sm font-bold text-slate-800">' + formatRupiah(totalVal) + '</div>' + sisaHtml + '</td>' +
        '<td class="px-4 py-3 text-center">' + badge + '</td>' +
        '<td class="px-4 py-3 text-center"><div class="flex items-center justify-center gap-1">' + aksi + '</div></td></tr>';
    }).join('');
  }

  function lunasHP(id) {
    // Cari data transaksi dari cache
    var row = HP_DATA.find(function(r) { return r[0] === id; });
    var totalTagihan = row ? parseNumber(row[9]) : 0;
    var sudahBayar = row ? parseNumber(row[15] || 0) : 0; // Kolom P (index 15) = Sudah Dibayar
    var sisaTagihan = totalTagihan - sudahBayar;

    Swal.fire({
      title: '<span class="text-slate-800 text-lg font-bold">Pembayaran</span>',
      html: '<div class="text-left space-y-4">' +
        '<div class="bg-gray-50 rounded-xl p-4 border border-gray-100">' +
          '<div class="flex justify-between text-sm mb-1"><span class="text-slate-500">Total Tagihan</span><span class="font-bold text-slate-800">' + formatRupiah(totalTagihan) + '</span></div>' +
          '<div class="flex justify-between text-sm mb-1"><span class="text-slate-500">Sudah Dibayar</span><span class="font-bold text-emerald-600">' + formatRupiah(sudahBayar) + '</span></div>' +
          '<div class="flex justify-between text-sm pt-2 border-t border-gray-200"><span class="font-bold text-slate-700">Sisa</span><span class="font-black text-rose-600">' + formatRupiah(sisaTagihan) + '</span></div>' +
        '</div>' +
        '<div>' +
          '<label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Jumlah Bayar Sekarang</label>' +
          '<input type="text" id="swal-bayar-amount" value="' + new Intl.NumberFormat('id-ID').format(sisaTagihan) + '" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg font-bold text-right outline-none focus:border-emerald-500 transition" oninput="this.value=this.value.replace(/[^0-9]/g,\'\').replace(/\\B(?=(\\d{3})+(?!\\d))/g,\'.\')">' +
          '<div class="text-[10px] text-slate-400 mt-1">Isi sesuai jumlah yang dibayar. Bisa bayar sebagian.</div>' +
        '</div>' +
      '</div>',
      showCancelButton: true,
      confirmButtonText: 'Bayar',
      confirmButtonColor: '#059669',
      cancelButtonText: 'Batal',
      width: '420px',
      preConfirm: function() {
        var raw = document.getElementById('swal-bayar-amount').value;

      }

  function renderHPBarangDD(data, keyword, src) {
    var dd = document.getElementById('hp-barang-dropdown');
    var kw = keyword.toLowerCase();
    var matches = [];
    if (src === 'bahan') {
      matches = (data||[]).filter(function(r){return String(r[0]).toLowerCase().indexOf(kw)!==-1||String(r[1]).toLowerCase().indexOf(kw)!==-1;}).slice(0,8).map(function(r){return {sku:r[0],nama:r[1],harga:Number(r[8])||0,stok:r[7]};});
    } else {
      matches = (data||[]).filter(function(r){return String(r[1]).toLowerCase().indexOf(kw)!==-1||String(r[3]).toLowerCase().indexOf(kw)!==-1;}).slice(0,8).map(function(r){
        var dn=r[1]+(r[4]&&r[4]!=='-'&&r[4]!=='Single'?' ('+r[4]+')':'');
        return {sku:r[3],nama:dn,harga:parseNumber(r[11]),stok:r[7]};
      });
    }
    if (matches.length===0) { dd.innerHTML='<div class="p-3 text-xs text-slate-400 text-center">Tidak ditemukan.</div>'; }
    else {
      dd.innerHTML = matches.map(function(m) {
        return '<div class="px-3 py-2 hover:bg-blue-50 cursor-pointer text-sm border-b border-gray-50" onclick="pickHPBarang(\''+m.sku.replace(/'/g,"\\'")+'\',\''+m.nama.replace(/'/g,"\\'")+'\','+m.harga+')"><div class="font-bold text-slate-700">'+m.nama+'</div><div class="flex justify-between text-[10px] text-slate-400"><span class="font-mono">'+m.sku+'</span><span>Stok: '+m.stok+' | '+formatRupiah(m.harga)+'</span></div></div>';
      }).join('');
    }
    dd.classList.remove('hidden');
  }

  function submitHP() {
    var payload = {
      tipe: HP_TIPE_FORM,
      namaPihak: document.getElementById('hp-nama-pihak').value.trim(),
      tanggal: document.getElementById('hp-tanggal').value,
      jatuhTempo: document.getElementById('hp-jatuh-tempo-input').value,
      sku: document.getElementById('hp-sku-barang').value,
      namaBarang: document.getElementById('hp-nama-barang').value || document.getElementById('hp-cari-barang').value,
      qty: Number(document.getElementById('hp-qty').value) || 0,
      harga: parseFormattedNumber(document.getElementById('hp-harga').value),
      catatan: document.getElementById('hp-catatan').value
    };
    if (!payload.namaPihak) { Swal.fire('Error','Nama pihak wajib diisi','warning'); return; }
    if (!payload.namaBarang) { Swal.fire('Error','Pilih barang dulu','warning'); return; }
    if (payload.qty<=0||payload.harga<=0) { Swal.fire('Error','Qty dan Harga harus > 0','warning'); return; }

    UI.showLoading('Menyimpan...');
    google.script.run.withSuccessHandler(function(res) {
      UI.close();
      if (res.success) {
        UI.showSuccess('Tersimpan', res.message);
        closeHPModal();
        loadHutangPiutang();
        // Auto-save kontak baru jika belum ada
        var tipeKontak = HP_TIPE_FORM === 'HUTANG' ? 'SUPPLIER' : 'RESELLER';
        var exists = HP_KONTAK_CACHE.some(function(r){ return String(r[0]).toLowerCase()===payload.namaPihak.toLowerCase() && String(r[1]).toUpperCase()===tipeKontak; });
        if (!exists) {
          google.script.run.addKontak({ nama: payload.namaPihak, tipe: tipeKontak });
        }
      } else { UI.showError('Gagal', res.message); }
    }).addHutangPiutang(payload);
  }

  function submitCekOngkir() {
    var asalId = document.getElementById('ongkir-asal-id').value;
    var tujuanId = document.getElementById('ongkir-tujuan-id').value;
    var berat = Number(document.getElementById('ongkir-berat').value) || 1;

    if (!asalId) { Swal.fire('Error', 'Pilih kota asal dari dropdown.', 'warning'); return; }
    if (!tujuanId) { Swal.fire('Error', 'Pilih kota tujuan dari dropdown.', 'warning'); return; }

    // Kumpulkan kurir yang dicentang
    var kurirChecked = [];
    document.querySelectorAll('.ongkir-kurir:checked').forEach(function(cb) { kurirChecked.push(cb.value); });
    if (kurirChecked.length === 0) { Swal.fire('Error', 'Pilih minimal 1 kurir.', 'warning'); return; }
    var courierStr = kurirChecked.join(':');

    // Loading state
    var btn = document.getElementById('btn-cek-ongkir');
    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Mengecek tarif...';
    if (window.lucide) lucide.createIcons();

    var resultContainer = document.getElementById('ongkir-result');
    resultContainer.innerHTML = '<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-12 text-center"><div class="w-16 h-16 rounded-full bg-sky-50 flex items-center justify-center mx-auto mb-4"><i data-lucide="loader-2" class="w-8 h-8 text-sky-400 animate-spin"></i></div><p class="text-sm text-slate-500 font-medium">Sedang mengecek tarif dari ' + kurirChecked.length + ' kurir...</p></div>';
    if (window.lucide) lucide.createIcons();

    var asalLabel = document.getElementById('ongkir-asal').value;
    var tujuanLabel = document.getElementById('ongkir-tujuan').value;

    google.script.run.withSuccessHandler(function(res) {
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="search" class="w-4 h-4"></i> Cek Tarif Ongkir';
      if (window.lucide) lucide.createIcons();

      if (!res || !res.success) {
        resultContainer.innerHTML = '<div class="bg-white rounded-2xl shadow-sm border border-red-100 p-8 text-center"><div class="w-14 h-14 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-3"><i data-lucide="alert-circle" class="w-7 h-7 text-red-400"></i></div><p class="text-sm font-bold text-red-600">' + ((res && res.message) || 'Gagal mengecek tarif') + '</p></div>';
        if (window.lucide) lucide.createIcons();
        return;
      }

      renderOngkirResult(res.data, asalLabel, tujuanLabel, berat);
    }).withFailureHandler(function(err) {
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="search" class="w-4 h-4"></i> Cek Tarif Ongkir';
      resultContainer.innerHTML = '<div class="bg-white rounded-2xl shadow-sm border border-red-100 p-8 text-center"><p class="text-sm font-bold text-red-600">Error: ' + (err.message || err) + '</p></div>';
      if (window.lucide) lucide.createIcons();
    }).cekOngkir(asalId, tujuanId, berat, courierStr);
  }

      'pos': { bg: 'bg-orange-50', border: 'border-orange-100', text: 'text-orange-700', badge: 'bg-orange-600' },
      'tiki': { bg: 'bg-blue-50', border: 'border-blue-100', text: 'text-blue-700', badge: 'bg-blue-500' }
    };
    var defaultColor = { bg: 'bg-sky-50', border: 'border-sky-100', text: 'text-sky-700', badge: 'bg-sky-600' };

    data.forEach(function(courier) {
      var cName = courier.courier.toLowerCase();
      var color = defaultColor;
      Object.keys(courierColors).forEach(function(k) { if (cName.indexOf(k) !== -1) color = courierColors[k]; });

      html += '<div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">';

      // Header kurir
      html += '<div class="px-5 py-3.5 border-b border-gray-100 flex items-center justify-between ' + color.bg + '">' +
        '<div class="flex items-center gap-3">' +
          '<div class="w-8 h-8 rounded-lg ' + color.badge + ' flex items-center justify-center"><i data-lucide="truck" class="w-4 h-4 text-white"></i></div>' +
          '<div class="font-bold ' + color.text + ' text-sm uppercase tracking-wide">' + courier.courier + '</div>' +
        '</div>' +
        '<span class="text-[10px] font-bold text-slate-400">' + courier.services.length + ' layanan</span>' +
      '</div>';

      // Tabel layanan
      html += '<div class="divide-y divide-gray-50">';
      courier.services.forEach(function(svc) {
        var costFmt = 'Rp ' + svc.cost.toLocaleString('id-ID');
        var etdText = svc.etd ? svc.etd + ' hari' : '-';

        html += '<div class="px-5 py-3 flex items-center justify-between hover:bg-gray-50 transition">' +
          '<div class="flex items-center gap-3 flex-1 min-w-0">' +
            '<span class="px-2.5 py-1 rounded-lg bg-gray-100 text-xs font-bold text-slate-700 border border-gray-200 shrink-0">' + svc.service + '</span>' +
            (svc.description ? '<span class="text-xs text-slate-400 truncate hidden md:inline">' + svc.description + '</span>' : '') +
          '</div>' +
          '<div class="flex items-center gap-4 shrink-0">' +
            '<div class="flex items-center gap-1.5 text-xs text-slate-500"><i data-lucide="clock" class="w-3 h-3"></i><span>' + etdText + '</span></div>' +
            '<div class="text-sm font-black text-slate-800 min-w-[100px] text-right">' + costFmt + '</div>' +
          '</div>' +
        '</div>';
      });
      html += '</div></div>';
    });

    container.innerHTML = html;
    if (window.lucide) lucide.createIcons();
  }

  // ==========================================================
  // SYNC TRACKING SHOPEE + KONFIRMASI RETUR
  // ==========================================================

  // Tombol Sync Manual
  function runManualSync() {
    Swal.fire({
      title: 'Sync Tracking',
      html: '<div class="text-sm text-slate-500">Mengecek status pengiriman semua pesanan <b>Shopee + TikTok</b> yang masih SHIPPED/WAITING.<br><br>Estimasi: 15-30 detik untuk 50 resi.</div>',
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: 'Mulai Sync',
      confirmButtonColor: '#ea580c',
      cancelButtonText: 'Batal'
    }).then(function(r) {
      if (!r.isConfirmed) return;

      var btn = document.getElementById('btn-sync-tracking');
      if (btn) { btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span class="hidden md:inline">Syncing...</span>'; if(window.lucide) lucide.createIcons(); }

      // Tampilkan floating progress
      showSyncFloating();

      google.script.run.withSuccessHandler(function(res) {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i data-lucide="satellite" class="w-4 h-4"></i><span class="hidden md:inline">Sync</span>'; if(window.lucide) lucide.createIcons(); }

        if (res && res.success) {
          var r = res.results || {};
          // Update floating dengan hasil detail
          updateSyncFloatingResult(res);

          loadOrders();
          loadTrackingAlerts();
        } else {
          closeSyncFloating();
          Swal.fire('Info', (res && res.message) || 'Tidak ada data untuk disinkronisasi.', 'info');
        }
      }).withFailureHandler(function(err) {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i data-lucide="satellite" class="w-4 h-4"></i><span class="hidden md:inline">Sync</span>'; if(window.lucide) lucide.createIcons(); }
        closeSyncFloating();
        Swal.fire('Error', err.message || 'Gagal sinkronisasi', 'error');
      }).syncShopeeTracking(true);
    });
  }

  // === FLOATING SYNC PROGRESS ===
  function showSyncFloating() {
    closeSyncFloating();
    var el = document.createElement('div');
    el.id = 'sync-floating-panel';
    el.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="width:32px;height:32px;border-radius:50%;background:#fef3c7;display:flex;align-items:center;justify-content:center;">
            <svg class="animate-spin" style="width:16px;height:16px;color:#d97706;" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
          </div>
          <div>
            <div style="font-size:13px;font-weight:700;color:#1e293b;">Sync Tracking</div>
            <div style="font-size:11px;color:#64748b;">Memproses resi ke server kurir...</div>
          </div>
        </div>
        <button onclick="closeSyncFloating()" style="background:none;border:none;color:#94a3b8;font-size:18px;cursor:pointer;padding:4px;">&times;</button>
      </div>
      <div id="sync-floating-log" style="max-height:250px;overflow-y:auto;font-size:11px;font-family:monospace;line-height:1.6;color:#475569;">
        <div style="color:#d97706;">⏳ Mengirim batch resi ke server...</div>
        <div style="color:#64748b;">Estimasi 15-30 detik, mohon tunggu.</div>
      </div>
    `;
    el.style.cssText = 'position:fixed;bottom:20px;right:20px;width:380px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;z-index:99999;box-shadow:0 20px 60px rgba(0,0,0,0.15);font-family:Inter,system-ui,sans-serif;';
    document.body.appendChild(el);
  }

  function updateSyncFloatingResult(res) {
    var panel = document.getElementById('sync-floating-panel');
    if (!panel) return;

    var r = res.results || {};
    var logEl = document.getElementById('sync-floating-log');
    if (!logEl) return;

    var html = '<div style="color:#16a34a;font-weight:600;margin-bottom:8px;">✓ ' + (res.message || 'Sync selesai') + '</div>';
    html += '<div style="border-top:1px solid #f1f5f9;padding-top:8px;margin-top:4px;">';

    if (r.shipped > 0) html += '<div style="padding:2px 0;"><span style="color:#3b82f6;">🚚</span> ' + r.shipped + ' pesanan <b>DIKIRIM</b></div>';
    if (r.completed > 0) html += '<div style="padding:2px 0;"><span style="color:#16a34a;">✅</span> ' + r.completed + ' pesanan <b>SELESAI</b></div>';
    if (r.lost > 0) html += '<div style="padding:2px 0;"><span style="color:#dc2626;">❌</span> ' + r.lost + ' paket <b>HILANG</b></div>';
    if (r.pendingReturn > 0) html += '<div style="padding:2px 0;"><span style="color:#ea580c;">📦</span> ' + r.pendingReturn + ' menunggu <b>konfirmasi retur</b></div>';
    if (r.skipped > 0) html += '<div style="padding:2px 0;"><span style="color:#94a3b8;">⏸</span> ' + r.skipped + ' belum ada update</div>';
    if (r.errors > 0) html += '<div style="padding:2px 0;"><span style="color:#94a3b8;">⚠️</span> ' + r.errors + ' gagal dicek</div>';

    html += '</div>';
    html += '<div style="margin-top:8px;font-size:10px;color:#94a3b8;">Total: ' + (r.total || 0) + ' resi dicek</div>';

    logEl.innerHTML = html;

    // Ganti icon spinner jadi check
    var iconDiv = panel.querySelector('svg');
    if (iconDiv && iconDiv.parentElement) {
      iconDiv.parentElement.innerHTML = '<span style="font-size:16px;">✓</span>';
      iconDiv.parentElement.style.background = '#dcfce7';
    }
    var subtitle = panel.querySelector('div[style*="color:#64748b"]');
    if (subtitle) subtitle.textContent = 'Selesai!';

    // Auto close after 10 detik
    setTimeout(function() { closeSyncFloating(); }, 10000);
  }

  function closeSyncFloating() {
    var el = document.getElementById('sync-floating-panel');
    if (el) el.remove();
  }

  // Konfirmasi Retur (PENDING_RETURN → RETURNED atau kembali SHIPPED)
  function confirmReturn(orderId, action) {
    var isConfirm = action === 'CONFIRM';
    var title = isConfirm ? 'Konfirmasi Retur?' : 'Tolak Retur?';
    var text = isConfirm ? 'Stok akan dikembalikan ke gudang dan status jadi RETURNED.' : 'Status akan kembali ke SHIPPED (paket dianggap belum retur).';
    var color = isConfirm ? '#059669' : '#dc2626';
    var btnText = isConfirm ? 'Ya, Konfirmasi' : 'Ya, Tolak';

    Swal.fire({ title: title, text: text, icon: 'question', showCancelButton: true, confirmButtonText: btnText, confirmButtonColor: color, cancelButtonText: 'Batal' }).then(function(r) {
      if (!r.isConfirmed) return;
      UI.showLoading('Memproses...');
      google.script.run.withSuccessHandler(function(res) {
        UI.close();
        if (res && res.success) {
          Swal.fire({ icon: 'success', title: 'Berhasil', text: res.message, timer: 2000, showConfirmButton: false });
          loadOrders();
          loadTrackingAlerts();
        } else {
          UI.showError('Gagal', (res && res.message) || 'Gagal memproses');
        }
      }).withFailureHandler(function(err) {
        UI.close();
        Swal.fire('Error', err.message || 'Gagal', 'error');
      }).confirmPendingReturn(orderId, action);
    });
  }

  // Load notification alerts (LOST + PENDING_RETURN)
  function loadTrackingAlerts() {
    google.script.run.withSuccessHandler(function(s) {
      if (!s) return;
      var bar = document.getElementById('tracking-alert-bar');
      var alertLost = document.getElementById('alert-lost');
      var alertPending = document.getElementById('alert-pending');
      if (!bar) return;

      var showBar = false;

      if (s.lost > 0 && alertLost) {
        alertLost.classList.remove('hidden');
        document.getElementById('alert-lost-text').textContent = s.lost + ' paket hilang (LOST)';
        showBar = true;
      } else if (alertLost) {
        alertLost.classList.add('hidden');
      }

      if (s.pendingReturn > 0 && alertPending) {
        alertPending.classList.remove('hidden');
        document.getElementById('alert-pending-text').textContent = s.pendingReturn + ' paket menunggu konfirmasi retur';
        showBar = true;
      } else if (alertPending) {
        alertPending.classList.add('hidden');
      }

      if (showBar) bar.classList.remove('hidden');
      else bar.classList.add('hidden');

      if (window.lucide) lucide.createIcons();
    }).getTrackingSummary();

    // Load countdown timer
    loadSyncCountdown();
  }

  // ==========================================================
  // COUNTDOWN TIMER SYNC TRACKING
  // ==========================================================

  var SYNC_COUNTDOWN_INTERVAL = null;
  var SYNC_NEXT_TIME = null;
  var SYNC_IS_ACTIVE = false;

  function loadSyncCountdown() {
    google.script.run.withSuccessHandler(function(info) {
      if (!info) return;

      SYNC_IS_ACTIVE = !!info.isActive;
      renderSyncToggleButton();

      var lastEl = document.getElementById('sync-last-time');
      var countdownInfo = document.getElementById('sync-countdown-info');

      if (!SYNC_IS_ACTIVE) {
        // Nonaktif — sembunyikan countdown
        if (lastEl) lastEl.textContent = info.lastSync ? 'Terakhir: ' + formatSyncDate(info.lastSync) : 'Belum pernah sync';
        if (countdownInfo) countdownInfo.classList.add('hidden');
        if (SYNC_COUNTDOWN_INTERVAL) { clearInterval(SYNC_COUNTDOWN_INTERVAL); SYNC_COUNTDOWN_INTERVAL = null; }
        return;
      }

      // Aktif — hitung countdown
      var lastSync = info.lastSync ? new Date(info.lastSync) : new Date();
      if (lastEl) lastEl.textContent = info.lastSync ? 'Terakhir: ' + formatSyncDate(info.lastSync) : 'Baru diaktifkan';

      var intervalMs = (info.intervalHours || 6) * 60 * 60 * 1000;
      SYNC_NEXT_TIME = new Date(lastSync.getTime() + intervalMs);

      // Jika next time sudah lewat (misal baru aktifkan), set ke 6 jam dari sekarang
      if (SYNC_NEXT_TIME.getTime() <= Date.now()) {
        SYNC_NEXT_TIME = new Date(Date.now() + intervalMs);
      }

      if (countdownInfo) countdownInfo.classList.remove('hidden');
      if (SYNC_COUNTDOWN_INTERVAL) clearInterval(SYNC_COUNTDOWN_INTERVAL);
      updateSyncCountdown();
      SYNC_COUNTDOWN_INTERVAL = setInterval(updateSyncCountdown, 1000);

      if (window.lucide) lucide.createIcons();
    }).getSyncTimestamp();
  }

  function formatSyncDate(isoStr) {
    try {
      var d = new Date(isoStr);
      var opts = { timeZone:'Asia/Jakarta', day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false };
      return d.toLocaleString('id-ID', opts).replace(/\./g, ':') + ' WIB';
    } catch(e) { return isoStr; }
  }

  function renderSyncToggleButton() {
    var btn = document.getElementById('btn-toggle-sync');
    if (!btn) return;
    if (SYNC_IS_ACTIVE) {
      btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold border transition active:scale-95 bg-emerald-50 text-emerald-700 border-emerald-200';
      btn.innerHTML = '<span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse mr-1"></span> Aktif';
    } else {
      btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold border transition active:scale-95 bg-gray-100 text-slate-500 border-gray-200 hover:bg-orange-50 hover:text-orange-600 hover:border-orange-200';
      btn.textContent = 'Aktifkan';
    }
  }

  function toggleAutoSync() {
    var newState = !SYNC_IS_ACTIVE;
    var title = newState ? 'Aktifkan Auto Sync?' : 'Nonaktifkan Auto Sync?';
    var text = newState ? 'Sistem akan otomatis cek tracking Shopee setiap 6 jam.' : 'Auto sync akan dimatikan. Anda masih bisa sync manual.';
    var color = newState ? '#059669' : '#dc2626';
    var btnText = newState ? 'Ya, Aktifkan' : 'Ya, Matikan';

    Swal.fire({ title: title, text: text, icon: 'question', showCancelButton: true, confirmButtonText: btnText, confirmButtonColor: color, cancelButtonText: 'Batal' }).then(function(r) {
      if (!r.isConfirmed) return;
      UI.showLoading(newState ? 'Mengaktifkan...' : 'Menonaktifkan...');
      google.script.run.withSuccessHandler(function(res) {
        UI.close();
        if (res && res.success) {
          SYNC_IS_ACTIVE = newState;
          renderSyncToggleButton();
          loadSyncCountdown();
          Swal.fire({ icon: 'success', title: 'Berhasil', text: res.message, timer: 2000, showConfirmButton: false });
        } else {
          Swal.fire('Gagal', (res && res.message) || 'Gagal memproses', 'error');
        }
      }).withFailureHandler(function(err) {
        UI.close();
        Swal.fire('Error', err.message || 'Gagal terhubung', 'error');
      }).toggleSyncTrackingTrigger(newState);
    });
  }

  function updateSyncCountdown() {
    var el = document.getElementById('sync-countdown-timer');
    if (!el || !SYNC_NEXT_TIME) return;

    var now = new Date();
    var diff = SYNC_NEXT_TIME.getTime() - now.getTime();

    if (diff <= 0) {
      el.textContent = 'Sedang sync...';
      el.style.color = '#16a34a';
      return;
    }

    var hours = Math.floor(diff / 3600000);
    var mins = Math.floor((diff % 3600000) / 60000);
    var secs = Math.floor((diff % 60000) / 1000);

    var pad = function(n) { return String(n).padStart(2, '0'); };
    el.textContent = pad(hours) + ':' + pad(mins) + ':' + pad(secs);
    el.style.color = diff < 600000 ? '#dc2626' : '#ea580c';
  }


</script>
