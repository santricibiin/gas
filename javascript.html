  async function generatePrintLayout(sku, name, price, qty, type) {
      // 1. Buat Canvas Sementara di Memori (Tidak terlihat user)
      const tempCanvas = document.createElement('canvas');

      // 2. Gambar Kode ke Canvas tersebut
      try {
          await new Promise((resolve, reject) => {
              if (type === 'QR') {
                  // Pastikan library QRCode sudah ada (dari index.html)
                  if (typeof QRCode === 'undefined') reject("Library QRCode belum dimuat. Refresh halaman.");

                  QRCode.toCanvas(tempCanvas, sku, {
                      width: 100,
                      margin: 0,
                      errorCorrectionLevel: 'M'
                  }, function (error) {
                      if (error) reject(error);
                      else resolve();
                  });
              } else {
                  // Pastikan library JsBarcode sudah ada
                  if (typeof JsBarcode === 'undefined') reject("Library JsBarcode belum dimuat.");

                  JsBarcode(tempCanvas, sku, {
                      format: "CODE128",
                      width: 2,
                      height: 50,
                      displayValue: false,
                      margin: 0
                  });
                  resolve();
              }
          });
      } catch (err) {
          Swal.fire("Error", "Gagal membuat kode: " + err, "error");
          return;
      }

      // 3. Ubah Canvas menjadi Gambar (Base64 String)
      // Ini mengubah gambar jadi teks panjang: "data:image/png;base64,....."
      const imgData = tempCanvas.toDataURL("image/png");

      // 4. Siapkan Jendela Print
      const printWindow = window.open('', '_blank');

      // CSS Styles (Tata Letak)
      const style = `
          <style>
              @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

              body {
                  font-family: 'Roboto', sans-serif;
                  margin: 0;
                  padding: 10px; /* Padding kertas dikurangi biar muat lebih banyak */
              }

              .label-container {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 0; /* [PENTING] Jarak antar stiker DIHAPUS agar berdempetan */
                  justify-content: flex-start;
              }

              .label {
                  /* UKURAN STIKER (Bisa Anda ubah, misal 4cm = approx 150px) */
                  width: 150px;
                  height: 150px;

                  /* GARIS TEPI POTONG (Dashed tipis warna abu biar hemat tinta) */
                  border-right: 1px dashed #999;
                  border-bottom: 1px dashed #999;

                  /* Trik agar garis kiri & atas tidak double saat diprint banyak */
                  margin-top: -1px;
                  margin-left: -1px;
                  border-top: 1px dashed #999;
                  border-left: 1px dashed #999;

                  border-radius: 0; /* [PENTING] Sudut dibuat siku (kotak) biar gampang dipotong lurus */

                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                  padding: 5px;
                  text-align: center;
                  page-break-inside: avoid;
                  box-sizing: border-box;
              }

              /* Gambar QR/Barcode */
              img.code-img {
                  max-width: 95%;
                  height: auto;
                  object-fit: contain;
              }

              /* Teks SKU */
              .prod-sku {
                  font-size: 12px;
                  font-weight: bold;
                  margin-top: 5px;
                  color: #000;
                  letter-spacing: 1px;
                  word-break: break-all;
                  line-height: 1.2;
              }

              /* Nama Produk (Opsional: Ditambahkan biar tidak tertukar) */
              .prod-name {
                  font-size: 10px;
                  color: #444;
                  margin-bottom: 5px;
                  max-height: 24px;
                  overflow: hidden;
              }

              @media print {
                  body { padding: 0; }
                  @page { margin: 0.5cm; } /* Margin aman printer standar */
              }
          </style>
      `;

      // HTML Content (Looping Gambar yang sudah jadi)
      let labelsHtml = '<div class="label-container">';
      for (let i = 0; i < qty; i++) {
          labelsHtml += `
              <div class="label">
                  <div class="prod-name">${name.substring(0, 25)}</div> <img src="${imgData}" class="code-img" />
                  <div class="prod-sku">${sku}</div>
              </div>
          `;
      }
      labelsHtml += '</div>';

      // 5. Tulis ke Jendela Baru & Print Otomatis
      printWindow.document.write('<html><head><title>Print ' + sku + '</title>' + style + '</head><body>' + labelsHtml + '</body></html>');
      printWindow.document.close();

      // Tunggu sebentar agar gambar ter-load di jendela baru sebelum print dialog muncul
      printWindow.onload = function() {
          setTimeout(() => {
              printWindow.print();
          }, 500);
      };
  }

function completeProductionProcess(processId) {
    UI.confirm(
        'Selesaikan Proses Jahit?',
        `Data ${processId} akan diposting ke Master Produk & Stok.`,
        'Ya, Selesaikan',
        '#4f46e5'
    ).then(result => {
        if (!result.isConfirmed) return;

        UI.showLoading('Menyelesaikan Proses...');

        google.script.run.withSuccessHandler(res => {
            UI.close();
            if (res && res.success) {
                UI.showSuccess('Berhasil', res.message || 'Proses berhasil diselesaikan.');
                loadProductionProcessTable();
                loadProductionLog();
                loadInitialData();
                if (document.getElementById('cont-prod-material') && !document.getElementById('cont-prod-material').classList.contains('hidden')) {
                    loadMaterialTable();
                }
            } else {
                UI.showError('Gagal', (res && res.message) ? res.message : 'Terjadi kesalahan saat menyelesaikan proses.');
            }
        }).withFailureHandler(err => {
            UI.close();
            UI.showError('Error Server', err.message || 'Gagal memproses permintaan.');
        }).completeProductionProcess(processId);
    });
}

function searchOutputProduct(input) {

    const dropdown = document.getElementById('prod-output-dropdown');

    if (val.length < 1) { dropdown.classList.add('hidden'); return; }

    // Filter: Cari Produk yang Tipenya BUKAN 'BAHAN'
    const matches = productList.filter(row => {
        const txt = (row[1] + " " + row[3]).toLowerCase();
        const type = String(row[16] || '').toUpperCase();
        return txt.includes(val) && type !== 'BAHAN';
    }).slice(0, 10);

    renderProdDropdown(matches, dropdown, (item) => {

// 4. KALKULATOR OTOMATIS (OUTPUT QTY -> BAHAN QTY)
const qtyOutputInput = document.getElementById('prod-output-qty');
if(qtyOutputInput){
    qtyOutputInput.addEventListener('input', calcMaterialNeeds);
}

function calcMaterialNeeds() {
    const outputQty = parseFloat(document.getElementById('prod-output-qty').value) || 0;
    const rows = document.querySelectorAll('#prod-material-container > div');

    rows.forEach(row => {
        const baseQtyEl = row.querySelector('.mat-base-qty');
        const qtyInput = row.querySelector('.mat-qty');

        // Hanya hitung baris yang punya base-qty (Resep Otomatis)
        if (baseQtyEl && qtyInput) {
            const baseQty = parseFloat(baseQtyEl.innerText) || 0;
            const totalNeed = baseQty * outputQty;
            qtyInput.value = Number.isInteger(totalNeed) ? totalNeed : totalNeed.toFixed(2);
        }
    });
}

// 5. PENCARIAN BAHAN BAKU (INGREDIENT)
function searchMaterialProduct(input, rowId) {
    const val = input.value.toLowerCase();
    const parent = document.getElementById(rowId);
    const dropdown = parent.querySelector('.mat-dropdown');

    if (val.length < 1) { dropdown.classList.add('hidden'); return; }

    const matches = productList.filter(row => {
        const txt = (row[1] + " " + row[3]).toLowerCase();
        return txt.includes(val);
    }).sort((a, b) => {
        // Prioritaskan tipe BAHAN
        const typeA = String(a[16] || '').toUpperCase();
        const typeB = String(b[16] || '').toUpperCase();
        return (typeB === 'BAHAN') - (typeA === 'BAHAN');
    }).slice(0, 10);

    renderProdDropdown(matches, dropdown, (item) => {
        input.value = item[1];
        parent.querySelector('.mat-sku').value = item[3];

        const stock = item[7];
        const unit = item[8] || 'Pcs';
        const stockInfo = parent.querySelector('.mat-stock-info');
        stockInfo.innerHTML = `Stok: <b>${stock}</b> ${unit}`;

        parent.querySelector('.mat-qty').setAttribute('max', stock);
        dropdown.classList.add('hidden');
        parent.querySelector('.mat-qty').focus();
    });
}

// Helper Render Dropdown
function renderProdDropdown(items, container, onSelect) {
    container.innerHTML = '';
    container.classList.remove('hidden');

    if (items.length === 0) {
        container.innerHTML = '<div class="p-3 text-xs text-gray-400 text-center">Tidak ditemukan</div>';
        return;
    }

    items.forEach(row => {
        const div = document.createElement('div');
        div.className = 'p-2 hover:bg-blue-50 cursor-pointer border-b border-gray-50 flex items-center gap-3 transition';

        const type = row[16] || 'JADI';
        const badgeColor = type === 'BAHAN' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700';
        const imgUrl = row[14];

        // LOGIKA NAMA LENGKAP: Nama + (Varian)
        const varian = row[4];
        const fullName = row[1] + (varian && varian !== '-' && varian !== 'Single' ? ` (${varian})` : '');

        const imgHtml = imgUrl
            ? `<img src="${imgUrl}" class="w-8 h-8 rounded object-cover border border-gray-200">`
            : `<div class="w-8 h-8 bg-gray-100 rounded flex items-center justify-center"><i data-lucide="package" class="w-4 h-4 text-gray-400"></i></div>`;

        div.innerHTML = `
            ${imgHtml}
            <div class="flex-1">
                <div class="text-xs font-bold text-slate-700 truncate">${fullName}</div>
                <div class="flex justify-between mt-1">
                    <span class="text-[9px] font-mono text-slate-500">${row[3]}</span>
                    <span class="text-[9px] font-bold px-1 rounded ${badgeColor}">${type}</span>
                </div>
            </div>
        `;
        div.onclick = () => onSelect(row);
        container.appendChild(div);
    });
    if(window.lucide) lucide.createIcons({ root: container });
}

// 6. SUBMIT PRODUKSI
function submitProduction(e) {
    e.preventDefault();

    const outputSku = document.getElementById('prod-output-sku').value;
    const outputName = document.getElementById('prod-output-name').value;
    const outputQty = document.getElementById('prod-output-qty').value;
    const tailorName = (document.getElementById('prod-tailor-name')?.value || '').trim();

    if (!outputSku || !outputQty) {
        Swal.fire('Error', 'Pilih Barang Jadi dan jumlahnya!', 'warning');
        return;
    }

    if (!tailorName) {
        Swal.fire('Error', 'Nama penjahit wajib diisi!', 'warning');
        return;
    }

    // Ambil Data Bahan
    const rows = document.querySelectorAll('#prod-material-container > div');
    const materials = [];

    rows.forEach(row => {
        const sku = row.querySelector('.mat-sku').value;
        const qty = row.querySelector('.mat-qty').value;

        // Tambahan: Ambil Nama juga (biar backend tidak bingung kalau SKU salah)
        const nameInput = row.querySelector('input[type="text"]');
        const name = nameInput ? nameInput.value : '';

        if (sku && qty > 0) {
            materials.push({ sku: sku, name: name, qty: qty });
        }
    });

    if (materials.length === 0) {
        Swal.fire('Error', 'Minimal harus ada 1 bahan baku!', 'warning');
        return;
    }

    // [BARU] Ambil Data Biaya Operasional
    const opRows = document.querySelectorAll('.prod-op-row');
    const operationalCosts = [];

    // Ambil outputQty untuk perhitungan final (safety)
    const currentOutputQty = parseFloat(document.getElementById('prod-output-qty').value) || 1;

    opRows.forEach(row => {
        const name = row.querySelector('.op-name').value;
        const costPerUnit = parseFloat(row.getAttribute('data-cost-unit')) || 0;

        // Backend mengharapkan total biaya nominal untuk diproses ke jurnal keuangan
        const totalRowCost = costPerUnit * currentOutputQty;

        if(name && totalRowCost > 0) {
            // Kirim 'cost' sebagai TOTAL BIAYA (Bukan satuan lagi) agar backend Code.gs tinggal jumlahkan
            operationalCosts.push({ name: name, cost: totalRowCost });
        }
    });

    const btn = document.getElementById('btn-submit-prod');
    const originalText = btn.innerHTML;
    btn.innerHTML = 'Memproses...'; btn.disabled = true;

    const form = {
        outputSku: outputSku,
        outputName: document.getElementById('prod-output-name').value,
        outputQty: outputQty,
        tailorName: tailorName,
        materials: materials,
        operationalCosts: operationalCosts
    };

    google.script.run.withSuccessHandler(res => {
        if(res.success) {
            // 1. Tampilkan Notifikasi Sukses
            Swal.fire({
                title: 'Berhasil!',
                text: res.message,
                icon: 'success',
                timer: 1500,
                showConfirmButton: false
            });

            // 2. Tutup Modal
            closeProductionModal();

            // 3. Arahkan ke tab Proses Jahit & refresh antrian
            toggleProdTab('jahit');

        } else {
            Swal.fire('Gagal', res.message, 'error');
        }
        btn.innerHTML = originalText; btn.disabled = false;
    }).withFailureHandler(err => {
        Swal.fire('Error', err.message || 'Terjadi kesalahan server.', 'error');
        btn.innerHTML = originalText; btn.disabled = false;
    }).queueProductionProcess(form);
}

function loadCalcRoasPage() {
    const priceInput = document.getElementById('roas-harga-jual');
    if (!priceInput) return;

    if (!priceInput.value) {
        fillCalcRoasSample();
        return;
    }

function fillCalcRoasSample() {
    const setVal = (id, val) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.value = val;
    };

    // Contoh mendekati ilustrasi screenshot
    setVal('roas-harga-jual', '105.000');
    setVal('roas-hpp', '39.100');
    setVal('roas-admin', '10');
    setVal('roas-pajak', '13.5');
    setVal('roas-ongkir', '5.5');
    setVal('roas-operasional', '7.500');
    setVal('roas-target-profit', '20');
    setVal('roas-cr', '4.02');
    setVal('roas-avg-sales', '1.14');
    setVal('roas-clicks', '200');

    calcRoasRecompute();
}

function calcRoasRecompute() {
    const readMoney = id => parseFormattedNumber(document.getElementById(id)?.value || 0);
    const readPct = id => {
        const n = parseFloat(document.getElementById(id)?.value || 0);
        return isNaN(n) ? 0 : n;
    };
    const readNum = (id, fallback = 0) => {
        const n = parseFloat(document.getElementById(id)?.value || fallback);
        return isNaN(n) ? fallback : n;
    };

    const hargaJual = Math.max(0, readMoney('roas-harga-jual'));
    const hpp = Math.max(0, readMoney('roas-hpp'));
    const adminPct = Math.max(0, readPct('roas-admin'));
    const pajakPct = Math.max(0, readPct('roas-pajak'));
    const ongkirPct = Math.max(0, readPct('roas-ongkir'));
    const operasional = Math.max(0, readMoney('roas-operasional'));
    const targetProfitPct = Math.max(0, readPct('roas-target-profit'));
    const crPct = Math.max(0, readPct('roas-cr'));
    const avgSales = Math.max(0.01, readNum('roas-avg-sales', 1));
    const clicks = Math.max(0, readNum('roas-clicks', 0));

    const elBeRoas = document.getElementById('roas-be-roas');
    const elTargetRoas = document.getElementById('roas-target-roas');
    const elGrossMargin = document.getElementById('roas-gross-margin');
    const elTargetBid = document.getElementById('roas-target-bid');
    const elBeBid = document.getElementById('roas-be-bid');
    const elBudget = document.getElementById('roas-budget');
    const elNetProfit = document.getElementById('roas-net-profit');
    const elWarning = document.getElementById('roas-warning');
    const elPLCard = document.getElementById('roas-pl-card');
    const elPLStatus = document.getElementById('roas-pl-status');
    const elPLValue = document.getElementById('roas-pl-value');
    const elPLReason = document.getElementById('roas-pl-reason');

    const setPL = (mode, valueText, reasonHtml) => {
        if (elPLCard) {
            if (mode === 'profit') {
                elPLCard.className = 'rounded-lg border border-emerald-200 p-3 bg-emerald-50 col-span-2';
            } else if (mode === 'loss') {
                elPLCard.className = 'rounded-lg border border-rose-200 p-3 bg-rose-50 col-span-2';
            } else {
                elPLCard.className = 'rounded-lg border border-slate-200 p-3 bg-slate-50 col-span-2';
            }
        }

        if (elPLStatus) {
            if (mode === 'profit') {
                elPLStatus.className = 'text-lg font-extrabold text-emerald-700';
                elPLStatus.innerText = 'UNTUNG';
            } else if (mode === 'loss') {
                elPLStatus.className = 'text-lg font-extrabold text-rose-700';
                elPLStatus.innerText = 'RUGI';
            } else {
                elPLStatus.className = 'text-lg font-extrabold text-slate-700';
                elPLStatus.innerText = 'IMPAS';
            }
        }

        if (elPLValue) elPLValue.innerText = valueText || 'Selisih profit harian: Rp 0';
        if (elPLReason) elPLReason.innerHTML = reasonHtml || 'Isi angka terlebih dahulu untuk melihat analisis untung/rugi.';
    };

    const resetResult = () => {
        if (elBeRoas) elBeRoas.innerText = '0';
        if (elTargetRoas) elTargetRoas.innerText = '0';
        if (elGrossMargin) elGrossMargin.innerText = '0%';
        if (elTargetBid) elTargetBid.innerText = formatRupiah(0);
        if (elBeBid) elBeBid.innerText = formatRupiah(0);
        if (elBudget) elBudget.innerText = formatRupiah(0);
        if (elNetProfit) elNetProfit.innerText = formatRupiah(0);
        setPL('neutral', 'Selisih profit harian: Rp 0', 'Isi Harga Jual dan HPP terlebih dahulu, lalu sistem akan menjelaskan alasan kenapa simulasi bisa untung atau rugi.');
    };

    const showWarning = msg => {
        if (!elWarning) return;
        if (!msg) {
            elWarning.classList.add('hidden');
            elWarning.innerText = '';
            return;
        }
        elWarning.classList.remove('hidden');
        elWarning.innerText = msg;
    };

    if (hargaJual <= 0 || hpp <= 0) {
        resetResult();
        showWarning('Isi Harga Jual dan HPP terlebih dahulu agar ROAS bisa dihitung.');
        return;
    }

    // --- Rumus Dasar ---
    // Omset/order = harga jual x average sales
    // Biaya variabel non-ads = HPP + biaya % marketplace + biaya operasional
    // Gross margin sebelum ads = (omset - biaya non-ads) / omset
    const revenuePerOrder = hargaJual * avgSales;
    const percentRate = (adminPct + pajakPct + ongkirPct) / 100;
    const variableCostNoAds = (hpp * avgSales) + (revenuePerOrder * percentRate) + operasional;
    const grossProfitNoAds = revenuePerOrder - variableCostNoAds;
    const grossMarginRate = revenuePerOrder > 0 ? (grossProfitNoAds / revenuePerOrder) : 0;

    if (grossMarginRate <= 0) {
        resetResult();
        if (elGrossMargin) elGrossMargin.innerText = `${(grossMarginRate * 100).toFixed(2)}%`;
        setPL(
            'loss',
            'Selisih profit harian: negatif (margin kotor minus)',
            `Margin kotor saat ini <b>${(grossMarginRate * 100).toFixed(2)}%</b>, artinya sebelum biaya iklan pun produk sudah tidak menyisakan margin.<br>
             Penyebab paling umum: harga jual terlalu rendah atau total biaya produk terlalu tinggi.`
        );
        showWarning('Gross margin <= 0. Naikkan harga jual atau turunkan biaya agar iklan tidak merugi.');
        return;
    }

    // Break Even ACOS = gross margin rate
    // Break Even ROAS = 1 / ACOS
    const breakEvenAcosRate = grossMarginRate;
    const breakEvenRoas = 1 / breakEvenAcosRate;

    // Target ACOS = BreakEven ACOS - target profit rate
    // Target ROAS = 1 / Target ACOS
    const targetProfitRate = targetProfitPct / 100;
    const targetAcosRate = breakEvenAcosRate - targetProfitRate;

    if (targetAcosRate <= 0) {
        resetResult();
        if (elBeRoas) elBeRoas.innerText = `${breakEvenRoas.toFixed(2)}`;
        if (elGrossMargin) elGrossMargin.innerText = `${(grossMarginRate * 100).toFixed(2)}%`;
        setPL(
            'neutral',
            'Selisih profit harian: belum valid dihitung',
            `Target profit <b>${targetProfitPct.toFixed(2)}%</b> terlalu tinggi dibanding gross margin <b>${(grossMarginRate * 100).toFixed(2)}%</b>.<br>
             Turunkan target profit atau naikkan margin agar Target ROAS valid.`
        );
        showWarning('Target profit terlalu tinggi. Nilai target profit harus lebih kecil dari gross margin.');
        return;
    }

    const targetRoas = 1 / targetAcosRate;
    const crRate = crPct / 100;

    // CPC/BID dari ACOS:
    // ACOS = AdsCost / Revenue, sementara Revenue per click = (Revenue per order x CR)
    // Maka CPC max = Revenue per order x ACOS x CR
    const breakEvenBid = crRate > 0 ? (revenuePerOrder * breakEvenAcosRate * crRate) : 0;
    const targetBid = crRate > 0 ? (revenuePerOrder * targetAcosRate * crRate) : 0;

    const budgetHarian = targetBid * clicks;

    // Estimasi profit harian
    const orders = clicks * crRate;
    const gmvHarian = orders * revenuePerOrder;
    const biayaProdukHarian = orders * variableCostNoAds;
    const netProfitHarian = gmvHarian - biayaProdukHarian - budgetHarian;

    if (elBeRoas) elBeRoas.innerText = `${breakEvenRoas.toFixed(2)}`;
    if (elTargetRoas) elTargetRoas.innerText = `${targetRoas.toFixed(2)}`;
    if (elGrossMargin) elGrossMargin.innerText = `${(grossMarginRate * 100).toFixed(2)}%`;
    if (elTargetBid) elTargetBid.innerText = formatRupiah(Math.round(targetBid));
    if (elBeBid) elBeBid.innerText = formatRupiah(Math.round(breakEvenBid));
    if (elBudget) elBudget.innerText = formatRupiah(Math.round(budgetHarian));
    if (elNetProfit) {
        elNetProfit.innerText = formatRupiah(Math.round(netProfitHarian));
        elNetProfit.className = `text-lg font-bold ${netProfitHarian >= 0 ? 'text-emerald-600' : 'text-rose-600'}`;
    }

    const diffText = `Selisih profit harian: ${formatRupiah(Math.round(netProfitHarian))}`;
    const relationText = targetBid <= breakEvenBid
        ? 'Target BID saat ini masih di bawah / sama dengan Break Even BID (lebih aman untuk profit).'
        : 'Target BID saat ini di atas Break Even BID (risiko rugi lebih tinggi jika performa turun).';

    if (netProfitHarian > 0) {
        setPL(
            'profit',
            diffText,
            `Simulasi <b>UNTUNG</b> karena total margin setelah biaya produk masih lebih besar dari biaya iklan harian.<br>
             Detail: GMV Harian <b>${formatRupiah(Math.round(gmvHarian))}</b>, Biaya Produk Harian <b>${formatRupiah(Math.round(biayaProdukHarian))}</b>, Budget Iklan <b>${formatRupiah(Math.round(budgetHarian))}</b>.<br>
             ${relationText}`
        );
    } else if (netProfitHarian < 0) {
        setPL(
            'loss',
            diffText,
            `Simulasi <b>RUGI</b> karena biaya iklan + biaya produk lebih besar dari margin yang dihasilkan.<br>
             Detail: GMV Harian <b>${formatRupiah(Math.round(gmvHarian))}</b>, Biaya Produk Harian <b>${formatRupiah(Math.round(biayaProdukHarian))}</b>, Budget Iklan <b>${formatRupiah(Math.round(budgetHarian))}</b>.<br>
             Perbaikan cepat: turunkan BID, naikkan CR, atau tingkatkan margin produk.`
        );
    } else {
        setPL(
            'neutral',
            diffText,
            `Simulasi <b>IMPAS</b>. Pendapatan bersih kira-kira sama dengan total biaya produk dan iklan.<br>
             Sedikit peningkatan CR atau sedikit penurunan BID biasanya langsung membuat hasil jadi untung.`
        );
    }

    if (crRate <= 0) {
        showWarning('CR masih 0%. Isi CR agar kalkulasi Target BID dan budget lebih akurat.');
    } else {
        showWarning('');
    }
}

function searchCalcPercentProduct(input, rowId) {
    const keyword = String(input.value || '').toLowerCase().trim();
    const rowEl = document.getElementById(rowId);
    if (!rowEl) return;

    const dropdown = rowEl.querySelector('.cp-prod-dropdown');
    if (!dropdown) return;

    loadCalcPercentProducts();

    if (!keyword) {
        dropdown.classList.add('hidden');
        return;
    }

    const source = Array.isArray(CALC_PERCENT_PRODUCTS) && CALC_PERCENT_PRODUCTS.length > 0
        ? CALC_PERCENT_PRODUCTS
        : (Array.isArray(productList) ? productList : []);

    const matches = source.filter(r => {
        const name = String(r[1] || '').toLowerCase();
        const sku = String(r[3] || '').toLowerCase();
        const varian = String(r[4] || '').toLowerCase();
        return name.includes(keyword) || sku.includes(keyword) || varian.includes(keyword);
    }).slice(0, 10);

    dropdown.innerHTML = '';
    dropdown.classList.remove('hidden');

    if (matches.length === 0) {
        dropdown.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">Produk tidak ditemukan</div>';
        return;
    }

    matches.forEach(item => {
        const hpp = parseNumber(item[9]);
        const name = item[1] || '-';
        const sku = item[3] || '-';
        const varian = item[4] && item[4] !== '-' && item[4] !== 'Single' ? `(${item[4]})` : '';

        const opt = document.createElement('div');
        opt.className = 'p-2 hover:bg-violet-50 cursor-pointer border-b border-gray-50';
        opt.innerHTML = `
          <div class="text-xs font-bold text-slate-700 truncate">${name} ${varian}</div>
          <div class="text-[10px] text-slate-500 flex justify-between mt-0.5">
              <span class="font-mono">${sku}</span>
              <span class="font-bold text-emerald-600">HPP: ${formatRupiah(hpp)}</span>
          </div>
        `;

        opt.onclick = () => {
            rowEl.querySelector('.cp-prod-input').value = `${name} ${varian}`.trim();
            rowEl.querySelector('.cp-prod-sku').value = sku;

            const hppInput = rowEl.querySelector('.cp-hpp');
            if (hppInput) {
                hppInput.value = formatCurrencyValue(hpp);
            }

            dropdown.classList.add('hidden');
            calcPercentRecompute(rowId);
        };

        dropdown.appendChild(opt);
    });
}

function calcPercentRecompute(rowId) {
    const row = document.getElementById(rowId);
    if (!row) return;

    const hppVal = parseFormattedNumber(row.querySelector('.cp-hpp')?.value || 0);

    let totalPercent = 0;
    row.querySelectorAll('.cp-fee-percent').forEach(inp => {
        const n = parseFloat(inp.value);
        if (!isNaN(n) && n > 0) totalPercent += n;
    });

    const remainPercent = 100 - totalPercent;
    const includeOrder = row.querySelector('.cp-opt-order')?.checked;
    const includeRetur = row.querySelector('.cp-opt-retur')?.checked;

    const extraCost = (includeOrder ? 1250 : 0) + (includeRetur ? 350 : 0);
    const isValid = remainPercent > 0;

    const baseResult = isValid ? (hppVal / (remainPercent / 100)) : 0;
    const finalResult = isValid ? (baseResult + extraCost) : 0;

    // Update Rp per fee row (harga jual final × persen fee = Rp potongan)
    const feeRows = row.querySelectorAll('.cp-fee-list > div');
    feeRows.forEach(feeRow => {
        const pctInput = feeRow.querySelector('.cp-fee-percent');
        const rpDisplay = feeRow.querySelector('.cp-fee-rp');
        if (pctInput && rpDisplay) {
            const pct = parseFloat(pctInput.value) || 0;
            const rpValue = Math.round(finalResult * (pct / 100));
            rpDisplay.innerText = formatRupiah(rpValue);
        }
    });

    const elPot = row.querySelector('.cp-sum-pot');
    const elRemain = row.querySelector('.cp-sum-remain');
    const elBase = row.querySelector('.cp-sum-base');
    const elExtra = row.querySelector('.cp-sum-extra');
    const elFinal = row.querySelector('.cp-sum-final');
    const warning = row.querySelector('.cp-warning');

    if (elPot) elPot.innerText = `${totalPercent.toFixed(2).replace(/\.00$/, '')}%`;
    if (elRemain) {
        elRemain.innerText = `${remainPercent.toFixed(2).replace(/\.00$/, '')}%`;
        elRemain.className = `cp-sum-remain text-lg font-bold ${isValid ? 'text-blue-600' : 'text-rose-600'}`;
    }
    if (elBase) elBase.innerText = formatRupiah(Math.round(baseResult));
    if (elExtra) elExtra.innerText = formatRupiah(extraCost);
    if (elFinal) elFinal.innerText = formatRupiah(Math.round(finalResult));

    if (warning) warning.classList.toggle('hidden', isValid);
}

// 1. HITUNG BARIS BAHAN (Dipanggil saat Qty diubah)
function calculateDesignRow(element) {
    const row = element.closest('.grid-row-material');

    const hpp = parseFloat(row.querySelector('.des-mat-hpp').value) || 0;
    const qty = parseFloat(row.querySelector('.des-mat-qty').value) || 0;

    const subtotal = hpp * qty;

    // UPDATE DISINI: Gunakan .value karena sekarang elemennya <input>
    row.querySelector('.des-display-sub').value = subtotal.toLocaleString('id-ID');
    row.querySelector('.des-mat-sub').value = subtotal;

    calculateDesignStats();
}

// 5. UPDATE KALKULASI TOTAL (RINCIAN DETAIL)
function calculateDesignStatsV2() {
    // A. Subtotal Bahan Baku (Raw)
    let totalRaw = 0;
    document.querySelectorAll('.sub-raw').forEach(el => totalRaw += parseFloat(el.value) || 0);

    // B. Subtotal Kemasan (Pack)
    let totalPack = 0;
    document.querySelectorAll('.sub-pack').forEach(el => totalPack += parseFloat(el.value) || 0);

    // C. Subtotal Ops
    let totalOps = 0;
    document.querySelectorAll('.des-cost-val').forEach(el => totalOps += parseFormattedNumber(el.value));

    // D. Grand Total & Margin
    const grandTotalHPP = Math.round(totalRaw + totalPack + totalOps);
    const margin = parseFloat(document.getElementById('global-margin').value) || 0;
    const profit = Math.round(grandTotalHPP * margin / 100);
    const recPrice = grandTotalHPP + profit;

    BASE_HPP = grandTotalHPP; // Update Global Variable untuk tabel

    // E. Update UI (Input Form)
    document.getElementById('subtotal-display-raw').innerText = 'Rp ' + Math.round(totalRaw).toLocaleString('id-ID');
    document.getElementById('subtotal-display-pack').innerText = 'Rp ' + Math.round(totalPack).toLocaleString('id-ID');
    document.getElementById('subtotal-display-ops').innerText = 'Rp ' + Math.round(totalOps).toLocaleString('id-ID');

    // F. Update UI (Sidebar Summary)
    document.getElementById('summary-raw').innerText = 'Rp ' + Math.round(totalRaw).toLocaleString('id-ID');
    document.getElementById('summary-pack').innerText = 'Rp ' + Math.round(totalPack).toLocaleString('id-ID');
    document.getElementById('summary-ops').innerText = 'Rp ' + Math.round(totalOps).toLocaleString('id-ID');
    document.getElementById('summary-hpp').innerText = 'Rp ' + grandTotalHPP.toLocaleString('id-ID');
    document.getElementById('summary-profit-val').innerText = 'Rp ' + profit.toLocaleString('id-ID');
    document.getElementById('display-rec-price').innerText = 'Rp ' + recPrice.toLocaleString('id-ID');

    document.getElementById('calc-hpp-value').value = grandTotalHPP;
}

// 6. SUBMIT DESAIN (SIMPAN PRODUK BARU)
function submitDesignV2() {
    const btn = document.getElementById('btn-save-v2');

    // 1. Header
    const name = document.getElementById('des-name').value.trim();
    const catSelect = document.getElementById('des-cat');
    const category = catSelect.value;
    const parentSku = document.getElementById('des-sku').value;

    if(!name || !category || !parentSku) {
        Swal.fire('Data Kurang', 'Lengkapi Identitas Produk dulu.', 'warning');
        return;
    }

    // 2. Resep (Untuk disimpan sebagai referensi)
    const materials = [];
    document.querySelectorAll('.grid-row-material').forEach(row => {
        const matName = row.querySelector('.des-mat-search').value;

        // AMBIL SKU DARI HIDDEN INPUT
        const matSku = row.querySelector('.des-mat-sku').value;

        const qty = row.querySelector('.des-mat-qty').value;

        // Simpan Object Lengkap (SKU + Nama + Qty)
        if(matName && qty) {
            materials.push({
                sku: matSku,
                name: matName,
                qty: qty
            });
        }
    });

    const costs = [];
    document.querySelectorAll('#des-cost-container > div').forEach(row => {
        const name = row.querySelector('.des-cost-name').value;
        // Ambil value, hapus format currency (titik), ubah ke angka
        const val = parseFormattedNumber(row.querySelector('.des-cost-val').value);

        if(name && val > 0) {
            costs.push({ name: name, cost: val });
        }
    });

    // 3. Ambil Data Tabel Variasi
    const variants = [];
    const rows = document.querySelectorAll('#table-variant-body tr.row-variant');

    if(rows.length === 0) {
        Swal.fire('Tabel Kosong', 'Klik "Generate Tabel" sebelum menyimpan.', 'warning');
        return;
    }

    rows.forEach(row => {
        variants.push({
            sku: row.querySelector('.var-sku').value,
            name: row.querySelector('.var-name').value, // Misal "Merah - S"
            hpp: parseFloat(row.querySelector('.var-hpp-raw').value),
            price: parseFormattedNumber(row.querySelector('.var-price').value),
            margin: row.querySelector('.var-margin').value
        });
    });

    // 4. Kirim Payload
    const payload = {
        header: {
            sku: parentSku,
            name: name,
            category: category,
            materials: materials, // Resep global
            costs: costs
        },
        variants: variants // Array of objects
    };

    // UI Loading
    const oldText = btn.innerHTML;
    btn.innerHTML = 'Menyimpan...';
    btn.disabled = true;

    google.script.run.withSuccessHandler(res => {
        btn.innerHTML = oldText;
        btn.disabled = false;

        if(res.success) {
            Swal.fire({
                title: 'Sukses!',
                text: `${variants.length} Produk berhasil disimpan.`,
                icon: 'success',
                timer: 1500,
                showConfirmButton: false
            });

            closeDesignModal();
            loadInitialData();

        } else {
            Swal.fire('Gagal', res.message, 'error');
        }
    }).saveProductDesignV2(payload);
}

// FUNGSI HITUNG HARGA SATUAN (HPP)
function calculateBulkUnit(element) {
    const row = element.closest('.grid');

    // 1. Ambil Qty (Support Desimal)
    let rawQty = row.querySelector('.bulk-qty').value;
    // Ubah koma jadi titik biar JS bisa hitung (1,5 jadi 1.5)
    rawQty = rawQty.replace(/,/g, '.'); 
    const qtyVal = parseFloat(rawQty) || 0;

    // 2. Ambil Total Harga (Tetap format ribuan)
    const totalVal = parseFormattedNumber(row.querySelector('.bulk-total').value);

    const hppInput = row.querySelector('.bulk-hpp');

    if (qtyVal > 0 && totalVal > 0) {
        const hpp = totalVal / qtyVal;
        // Tampilkan HPP dibulatkan (Rupiah biasanya bulat)
        hppInput.value = hpp.toLocaleString('id-ID', { maximumFractionDigits: 0 });
    } else {
        hppInput.value = '-';
    }
}

function refreshBulkSku(btn) {

function submitBulkMaterials(e) {
    e.preventDefault();

    const date = document.getElementById('bulk-date').value;
    const rows = document.querySelectorAll('#bulk-mat-container > div');
    const items = [];

    rows.forEach(row => {
        const invoice = row.querySelector('.bulk-inv').value.trim();
        const name = row.querySelector('.bulk-name').value.trim();
        const cat = row.querySelector('.bulk-cat').value;
        const unit = row.querySelector('.bulk-unit').value;
        const sku = row.querySelector('.bulk-sku').value.trim();

        // UBAH CARA AMBIL QTY (Agar desimal terbaca)
        let rawQty = row.querySelector('.bulk-qty').value;
        rawQty = rawQty.replace(/,/g, '.'); // Pastikan format titik
        const qty = parseFloat(rawQty) || 0;

        const hppStr = row.querySelector('.bulk-hpp').value;
        const hpp = hppStr === '-' ? 0 : parseFormattedNumber(hppStr);

        // AMBIL VALUE RAK
        const rack = row.querySelector('.bulk-rack').value.trim() || '-';

        if (name && sku) {
            if(qty <= 0 || hpp <= 0) { return; }

            items.push({
                invoice: invoice,
                name: name,
                category: cat,
                unit: unit,
                sku: sku,
                qty: qty,
                hpp: hpp,
                rack: rack // Kirim Rack ke Backend
            });
        }
    });

    if (items.length === 0) {
        Swal.fire('Data Tidak Lengkap', 'Isi minimal 1 baris data lengkap.', 'warning');
        return;
    }

    Swal.fire({
        title: 'Simpan Gudang Bahan?',
        text: `Mendaftarkan ${items.length} item bahan baku baru.`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Ya, Simpan',
        confirmButtonColor: '#059669'
    }).then((result) => {
        if (result.isConfirmed) {
            const btn = document.getElementById('btn-save-bulk');
            const oriText = btn.innerHTML;
            btn.innerHTML = 'Menyimpan...'; btn.disabled = true;

            const payload = { date: date, items: items };

            google.script.run.withSuccessHandler(res => {
                if(res.success) {
                    Swal.fire('Berhasil!', res.message, 'success');
                    closeMaterialModal();
                    if(document.getElementById('cont-prod-material').classList.contains('hidden') === false){
                        loadMaterialTable();
                    }
                } else {
                    Swal.fire('Info', res.message, 'info');
                    closeMaterialModal();
                }
                btn.innerHTML = oriText; btn.disabled = false;
            }).saveBulkMaterials(payload);
        }
    });
}

function toggleProdTab(tab) {

    const btnMat = document.getElementById('tab-prod-material');

    const viewHist = document.getElementById('cont-prod-history');

    viewMat.classList.add('hidden');
    viewJahit.classList.add('hidden');

    btnHist.className = "pb-3 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-800 transition flex items-center gap-2";
    btnMat.className = "pb-3 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-emerald-600 transition flex items-center gap-2";

// Helper Format Rupiah (Jaga-jaga jika belum ada)
function formatRupiah(angka) {

    return 'Rp ' + new Intl.NumberFormat('id-ID').format(angka);

// 1. LOGIKA HAPUS
function deleteMaterial(sku, name) {
    Swal.fire({
        title: 'Hapus Bahan?',
        text: `Anda yakin ingin menghapus "${name}" (${sku})? Data stok akan hilang permanen.`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#e11d48', // Rose Red
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Ya, Hapus',
        cancelButtonText: 'Batal'
    }).then((result) => {
        if (result.isConfirmed) {
            // Tampilkan Loading
            Swal.fire({title: 'Menghapus...', didOpen: () => Swal.showLoading()});

            google.script.run.withSuccessHandler(res => {
                if(res.success) {
                    Swal.fire('Terhapus!', res.message, 'success');
                    loadMaterialTable(); // Refresh Tabel
                } else {
                    Swal.fire('Gagal', res.message, 'error');

// 1. LOAD KATEGORI (Simpan Kode di data-code)
function loadDesignCategories() {
    const select = document.getElementById('des-cat');
    select.innerHTML = '<option value="">Loading...</option>';

    google.script.run.withSuccessHandler(data => {
        select.innerHTML = '<option value="">Pilih Kategori...</option>';

        if (!data || data.length === 0) {
            // Fallback jika Config kosong
            const opt = document.createElement('option');
            opt.value = "General";
            opt.innerText = "General";
            opt.setAttribute('data-code', 'GEN');
            select.appendChild(opt);
        } else {
            // Data dari Config: [0]=Nama, [1]=Kode
            data.forEach(row => {
                const namaKat = row[0];
                const kodeKat = row[1] || 'PRD'; // Default PRD jika kode kosong

                const opt = document.createElement('option');
                opt.value = namaKat;
                opt.innerText = namaKat;

                // INI KUNCINYA: Simpan kode kategori di atribut HTML
                opt.setAttribute('data-code', kodeKat);

                select.appendChild(opt);

function refreshDesignSku() {
    const catSelect = document.getElementById('des-cat');
    const inputSku = document.getElementById('des-sku');
    const btnIcon = document.querySelector('button[onclick="refreshDesignSku()"] i'); // Ambil ikon

    // Efek putar ikon biar user tau proses berjalan
    if(btnIcon) btnIcon.classList.add('animate-spin');

    const selectedOpt = catSelect.options[catSelect.selectedIndex];

    if (!selectedOpt || selectedOpt.value === "") {
        inputSku.value = "";
        inputSku.placeholder = "Pilih Kategori Dulu";
        if(btnIcon) btnIcon.classList.remove('animate-spin');
        return;
    }

    const categoryCode = selectedOpt.getAttribute('data-code');

    inputSku.value = 'Checking...';
    inputSku.readOnly = true;

    google.script.run.withSuccessHandler(newSku => {
        inputSku.value = newSku;
        inputSku.readOnly = false; // Buka kunci agar user bisa edit manual jika perlu

        // Matikan efek putar
        if(btnIcon) btnIcon.classList.remove('animate-spin');

    }).generateNextProductSku(categoryCode);
}

function searchMaterialCustom(input) {
    const row = input.closest('.grid-row-material');
    const type = row.getAttribute('data-type'); // 'raw' atau 'pack'
    const resultsDiv = row.querySelector('.custom-results');
    const keyword = input.value.toLowerCase();

    // --- FIX BARU: ANGKAT LAYER SAAT MENCARI ---
    // Reset semua row lain ke z-10 dulu
    document.querySelectorAll('.grid-row-material').forEach(r => r.style.zIndex = '10');
    // Set row yang sedang aktif ke z-50 agar dropdown-nya ada di paling atas
    row.style.zIndex = '50';
    // -------------------------------------------

    if (keyword.length < 1) {
        resultsDiv.classList.add('hidden');
        return;
    }

    const matches = MATERIAL_CACHE.filter(m => {
        // 1. Cek Nama atau SKU (Cocokkan teks)
        const textMatch = m.name.toLowerCase().includes(keyword) || m.sku.toLowerCase().includes(keyword);

        // 2. Cek Kategori (Bersihkan spasi & huruf kecil biar akurat)
        // Ambil kategori dari data, ubah ke huruf kecil, buang spasi depan/belakang
        const itemCat = (m.category || '').toLowerCase().trim();

        let catMatch = false;

        if (type === 'raw') {
            // Section Atas: Hanya munculkan jika kategori mengandung kata 'bahan baku'
            catMatch = itemCat === 'bahan baku';
        } else {
            // Section Bawah: Munculkan SELAIN bahan baku (Kemasan, Pendukung, dll)
            catMatch = itemCat !== 'bahan baku';
        }

        return textMatch && catMatch;
    }).slice(0, 10); // Batasi 10 hasil

    if (matches.length > 0) {
        resultsDiv.innerHTML = matches.map(m => `
            <div onclick="selectMaterialCustom(this, '${m.sku}', '${m.name.replace(/'/g, "\\'")}', '${m.unit}', ${m.hpp})"
                 class="px-3 py-2 hover:bg-blue-50 cursor-pointer border-b border-gray-100 last:border-0 transition group">
                <div class="flex justify-between items-center">
                    <div>
                        <div class="font-bold text-slate-700 text-sm group-hover:text-blue-700">${m.name}</div>
                        <div class="flex gap-2 mt-0.5">
                            <span class="text-[10px] text-slate-400 font-mono border border-slate-200 px-1 rounded bg-slate-50">${m.sku}</span>
                            <span class="text-[10px] bg-gray-100 text-gray-500 px-1.5 rounded font-bold">${m.category}</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-emerald-600 text-sm">Rp ${m.hpp.toLocaleString('id-ID')}</div>
                        <div class="text-[10px] text-slate-400">Stok: ${m.unit}</div>
                    </div>
                </div>
            </div>
        `).join('');
        resultsDiv.classList.remove('hidden');
    } else {
        // Pesan jika tidak ketemu (Memberi petunjuk ke user)
        const msg = type === 'raw' ? 'Bukan kategori Bahan Baku' : 'Bukan kategori Kemasan';
        resultsDiv.innerHTML = `
            <div class="px-3 py-3 text-center text-slate-400 text-xs italic">
                Tidak ditemukan.<br>
                <span class="text-[10px] text-slate-300">Filter: ${msg}</span>
            </div>`;
        resultsDiv.classList.remove('hidden');
    }
}

let VARIANT_TAGS = []; // Menyimpan list ["Merah - S", "Hitam - 38"]
let BASE_HPP = 0;

// 1. INPUT HANDLER UNTUK VARIASI
function handleVariantInput(e) {
    if (e.key === 'Enter') {
        e.preventDefault(); // Jangan submit form
        addVariantFromInput();
    }
}

function addVariantFromInput() {
    const input = document.getElementById('variant-input');
    const val = input.value.trim();

    if (val && !VARIANT_TAGS.includes(val)) {
        VARIANT_TAGS.push(val);
        renderVariantChips();
        input.value = ''; // Reset input
    } else if (VARIANT_TAGS.includes(val)) {
        // Efek visual jika duplikat (opsional)
        input.classList.add('bg-red-50');
        setTimeout(() => input.classList.remove('bg-red-50'), 200);
    }
}

function removeVariantTag(index) {
    VARIANT_TAGS.splice(index, 1);
    renderVariantChips();
}

function renderVariantChips() {
    const container = document.getElementById('variant-chips');

    if (VARIANT_TAGS.length === 0) {
        container.innerHTML = '<span class="text-xs text-slate-400 italic py-1">Belum ada variasi. Produk akan dianggap "Single".</span>';

// 2. GENERATE TABEL FINALISASI
function generateVariantTable() {
    const tbody = document.getElementById('table-variant-body');
    const parentSku = document.getElementById('des-sku').value;

    if (!parentSku || parentSku === 'LOADING...') {
        Swal.fire('Error', 'SKU Induk belum siap. Pilih kategori dulu.', 'warning');
        return;
    }

    // Hitung ulang HPP dulu untuk memastikan data fresh
    calculateDesignStatsV2();

    // Default Margin
    const globalMargin = parseFloat(document.getElementById('global-margin').value) || 30;
    const recPrice = Math.round(BASE_HPP + (BASE_HPP * globalMargin / 100));

    // Jika tidak ada variasi, buat 1 baris "Single"
    const variantsToRender = VARIANT_TAGS.length > 0 ? VARIANT_TAGS : ['Single'];

    tbody.innerHTML = variantsToRender.map((variant, index) => {
        // Logic SKU Anak: Parent + Variant (Cleaned)
        // Contoh: KMJ-1001 + "Merah - S" -> KMJ-1001-MERAH-S
        let childSku = parentSku;
        if (variant !== 'Single') {
            const cleanVariant = variant.toUpperCase().replace(/[^A-Z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
            childSku = `${parentSku}-${cleanVariant}`;
        }

        return `
        <tr class="hover:bg-slate-800/50 transition group row-variant" data-variant="${variant}">
            <td class="px-4 py-3">
                <input type="text" class="var-name bg-transparent border-none text-white font-bold w-full outline-none" value="${variant}" readonly>
            </td>
            <td class="px-4 py-3">
                <input type="text" class="var-sku bg-slate-950/30 border border-slate-700 rounded px-2 py-1 text-slate-300 font-mono text-xs w-full" value="${childSku}">
            </td>
            <td class="px-4 py-3 text-right">
                <div class="text-slate-400 text-xs">Rp</div>
                <input type="text" class="var-hpp bg-transparent border-none text-right text-slate-300 font-medium w-full outline-none" value="${BASE_HPP.toLocaleString('id-ID')}" readonly>
                <input type="hidden" class="var-hpp-raw" value="${BASE_HPP}">
            </td>
            <td class="px-4 py-3 text-center">
                <div class="flex items-center justify-center gap-1">
                    <input type="number" class="var-margin w-12 bg-slate-700 border-none rounded text-center text-amber-400 text-xs font-bold py-1" value="${globalMargin}" oninput="updateRowPrice(this)">
                    <span class="text-slate-500 text-[10px]">%</span>
                </div>
            </td>
            <td class="px-4 py-3 text-right">
                <input type="text" class="var-price bg-slate-100 text-slate-900 border-none rounded px-2 py-1.5 text-right font-bold w-full focus:ring-2 focus:ring-emerald-500 outline-none"
                       value="${recPrice.toLocaleString('id-ID')}" oninput="formatCurrencyInput(this); updateRowMargin(this)">
            </td>
            <td class="px-4 py-3 text-center">
                <button onclick="this.closest('tr').remove()" class="text-slate-600 hover:text-rose-500 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </td>
        </tr>
        `;
    }).join('');

    if(window.lucide) lucide.createIcons();
}

function applyGlobalMargin() {
    const margin = parseFloat(document.getElementById('global-margin').value) || 0;
    const recPrice = Math.round(BASE_HPP + (BASE_HPP * margin / 100));

    document.getElementById('display-rec-price').innerText = 'Rp ' + recPrice.toLocaleString('id-ID');
}

// Update Harga saat Margin Baris diubah
function updateRowPrice(inputMargin) {
    const row = inputMargin.closest('tr');
    const hpp = parseFloat(row.querySelector('.var-hpp-raw').value) || 0;
    const margin = parseFloat(inputMargin.value) || 0;

    const newPrice = Math.round(hpp + (hpp * margin / 100));
    row.querySelector('.var-price').value = newPrice.toLocaleString('id-ID');
}

// Update Margin saat Harga Baris diubah (Reverse Calculation)
function updateRowMargin(inputPrice) {
    const row = inputPrice.closest('tr');
    const hpp = parseFloat(row.querySelector('.var-hpp-raw').value) || 0;
    const price = parseFormattedNumber(inputPrice.value) || 0;

    if (hpp > 0) {
        const profit = price - hpp;
        const newMargin = (profit / hpp) * 100;
        row.querySelector('.var-margin').value = Math.round(newMargin); // Bulatkan biar rapi
    }
}

// [javascript.html] - UPDATE HITUNG SUB-TOTAL BARIS

function calculateRowSubtotal(inputQty) {
    const row = inputQty.closest('.grid-row-material');

    // Ambil Data
    const hpp = parseFloat(row.querySelector('.des-mat-hpp').value) || 0;
    const qty = parseFloat(inputQty.value) || 0;

    // Hitung Subtotal
    const subtotal = Math.round(hpp * qty);

    // Update Tampilan Subtotal
    row.querySelector('.des-display-sub').value = subtotal.toLocaleString('id-ID');
    row.querySelector('.des-mat-sub').value = subtotal;

    // Panggil Total Global V2
    if (typeof calculateDesignStatsV2 === "function") {
        calculateDesignStatsV2();
    } else {
        console.error("Fungsi calculateDesignStatsV2 belum ada!");
    }
}

  // 3. FUNGSI PENCARIAN BAHAN BAKU (Live Search)
  function handleMaterialSearch(input, rowId) {
      const keyword = input.value.toLowerCase();
      const parent = document.getElementById(rowId);
      const dropdown = parent.querySelector('.mat-dropdown');
      const hiddenSku = parent.querySelector('.mat-sku');

      if (!keyword) {
          dropdown.classList.add('hidden');
          return;
      }

      // Filter dari materialList (Pastikan backend kirim: [0]SKU, [1]Nama, [2]Kategori, [7]Stok, [8]Satuan)
      const matches = materialList.filter(row => {
          const text = (row[1] + " " + row[0]).toLowerCase();
          return text.includes(keyword);
      }).slice(0, 8); // Batasi 8 hasil

      dropdown.innerHTML = '';

      if (matches.length === 0) {
          dropdown.innerHTML = '<div class="p-2 text-[10px] text-gray-400 text-center">Tidak ditemukan</div>';
      } else {
          matches.forEach(m => {
              const div = document.createElement('div');
              div.className = 'p-2 hover:bg-emerald-50 cursor-pointer border-b border-gray-50 text-xs text-slate-700';
              div.innerHTML = `

                      <span class="font-mono bg-gray-100 px-1 rounded">${m[0]}</span>
                      <span>Stok: ${m[7]} ${m[8]}</span>
                  </div>
              `;
              div.onclick = () => {
                  input.value = m[1]; // Set Nama ke Input
                  hiddenSku.value = m[0]; // Set SKU ke Hidden
                  dropdown.classList.add('hidden');
              };
              dropdown.appendChild(div);
          });
      }
      dropdown.classList.remove('hidden');
  }

  // --- [BARU] HITUNG RINCIAN MODAL REALTIME ---
  function calculateProductionSummary() {
      let totalMaterial = 0;
      let totalOps = 0;

      const outputQty = parseFloat(document.getElementById('prod-output-qty').value) || 1;

      // 1. UPDATE & HITUNG BAHAN BAKU
      const matRows = document.querySelectorAll('.prod-mat-row');
      matRows.forEach(row => {
          const hppSatuan = parseFloat(row.getAttribute('data-hpp')) || 0;
          const qtyBase = parseFloat(row.getAttribute('data-base')) || 0;

          const currentQtyNeed = qtyBase * outputQty;
          const currentSubtotal = currentQtyNeed * hppSatuan;

          // Update UI Bahan
          const qtyInput = row.querySelector('.mat-qty');
          if(qtyInput) qtyInput.value = parseFloat(currentQtyNeed.toFixed(2));

          const subDisplay = row.querySelector('.mat-subtotal');
          if(subDisplay) subDisplay.innerText = formatRupiah(currentSubtotal);

          totalMaterial += currentSubtotal;
      });

      // 2. UPDATE & HITUNG BIAYA OPERASIONAL (VARIABLE COST)
      const opRows = document.querySelectorAll('.prod-op-row');
      opRows.forEach(row => {
          // Ambil Biaya per Unit dari atribut data atau input hidden
          const costPerUnit = parseFloat(row.getAttribute('data-cost-unit')) || 0;

          // Hitung Total: Biaya Satuan x Jumlah Produksi
          const totalRowCost = costPerUnit * outputQty;

          // Update UI Operasional
          const qtyDisplay = row.querySelector('.col-span-2 span');
          if(qtyDisplay) qtyDisplay.innerText = `x ${outputQty}`;

          const subDisplay = row.querySelector('.op-subtotal');
          if(subDisplay) subDisplay.innerText = formatRupiah(totalRowCost);

          totalOps += totalRowCost;
      });

      // 3. Grand Total
      const grandTotal = totalMaterial + totalOps;
      const hppUnit = outputQty > 0 ? (grandTotal / outputQty) : 0;

      // 4. Update Sidebar Summary
      if(document.getElementById('summ-mat-total')) document.getElementById('summ-mat-total').innerText = formatRupiah(totalMaterial);
      if(document.getElementById('summ-ops-total')) document.getElementById('summ-ops-total').innerText = formatRupiah(totalOps);
      if(document.getElementById('summ-grand-total')) document.getElementById('summ-grand-total').innerText = formatRupiah(grandTotal);
      if(document.getElementById('summ-hpp-unit')) document.getElementById('summ-hpp-unit').innerText = formatRupiah(hppUnit);
  }

          const ingredients = response.data ? (response.data.mats || response.data.materials || []) : [];
          if (ingredients.length > 0) {
              ingredients.forEach(ing => {
                  // Backend sekarang sudah mengirimkan .unit dan .hpp yang benar
                  // Kita tidak perlu mencari di cache lagi.
                  addRecipeMatRow(ing.sku, ing.name, ing.unit, ing.qty, ing.hpp);
              });
          } else {
              addRecipeMatRow(); // Baris kosong default
          }

          // B. Load Biaya Operasional

  // SUBMIT RESEP (Hitung HPP & Kirim Biaya Ops)
  function submitRecipe(e) {
      e.preventDefault();

      const parentSku = document.getElementById('recipe-parent-sku').value;
      if(!parentSku) { Swal.fire('Error', 'Pilih produk dulu.', 'warning'); return; }

      // 1. Ambil Data Bahan & Hitung Subtotal Bahan
      const ingredients = [];
      let totalMatCost = 0;

      document.querySelectorAll('.rec-mat-row').forEach(row => {
          const sku = row.querySelector('.rec-mat-sku').value;
          const name = row.querySelector('.rec-mat-name').value;
          const qty = parseFloat(row.querySelector('.rec-mat-qty').value) || 0;

          // Ambil HPP dari atribut data yang tersimpan di row HTML
          const hppSatuan = parseFloat(row.getAttribute('data-hpp')) || 0;

          if(sku && qty > 0) {
              ingredients.push({ sku, name, qty });
              totalMatCost += (qty * hppSatuan);
          }
      });

      // 2. Ambil Data Biaya Ops & Hitung Subtotal Ops
      const costs = [];
      let totalOpsCost = 0;

      document.querySelectorAll('.rec-cost-row').forEach(row => {
          const name = row.querySelector('.rec-cost-name').value;
          const costStr = row.querySelector('.rec-cost-val').value;
          const cost = parseFormattedNumber(costStr); // Bersihkan format Rp

          if(name && cost > 0) {
              costs.push({ name, cost });
              totalOpsCost += cost;
          }
      });

      // Validasi: Minimal ada 1 data
      if(ingredients.length === 0 && costs.length === 0) {
          Swal.fire('Data Kosong', 'Isi minimal 1 bahan baku atau biaya operasional.', 'warning'); return;
      }

      // 3. Hitung Grand Total HPP Baru
      const newHpp = Math.round(totalMatCost + totalOpsCost);

      // UI Loading
      const btn = document.getElementById('btn-save-recipe');
      const oldText = btn.innerHTML;
      btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Menyimpan...';
      btn.disabled = true;
      if(window.lucide) lucide.createIcons();

      // 4. Kirim Data Lengkap ke Backend
      google.script.run.withSuccessHandler(res => {
          if (res.success) {
              Swal.fire({
                  title: 'Berhasil!',
                  html: `Resep diperbarui.<br><b>HPP Baru: ${formatRupiah(newHpp)}</b>`,
                  icon: 'success',
                  timer: 2500,
                  showConfirmButton: false
              });

              closeRecipeModal();
              loadInitialData(); // Update data global agar tabel produk berubah
          } else {
              Swal.fire('Gagal', res.message, 'error');
          }

          btn.innerHTML = oldText; btn.disabled = false;
          if(window.lucide) lucide.createIcons();

      }).saveRecipe({
          parentSku: parentSku,
          ingredients: ingredients,
          costs: costs,
          newHpp: newHpp // <--- INI DATA KUNCI YANG DIKIRIM KE BACKEND
      });
  }

  function toggleFilterMenu(e) {

      const chevron = document.getElementById('chevron-filter');

  document.addEventListener('click', function(e) {

      const btn = document.querySelector('button[onclick^="toggleFilterMenu"]');

      if (dropdown && !dropdown.classList.contains('hidden')) {
          // [FIX] Tambahkan pengecekan: !e.target.closest('.flatpickr-calendar')
          // Agar saat user klik tanggal di kalender, dropdown filter tidak tertutup paksa
          const isClickInsideCalendar = e.target.closest('.flatpickr-calendar') || e.target.closest('.flatpickr-month');

          if (!dropdown.contains(e.target) && !btn.contains(e.target) && !isClickInsideCalendar) {

          }

  // 3. Logic Apply Preset Filter
  function applyFilter(type) {
      const today = new Date();
      let start, end;
      let label = '';

      switch (type) {
          case 'TODAY':
              start = new Date(); end = new Date();
              label = 'Hari Ini';
              break;
          case 'YESTERDAY':
              start = new Date(); start.setDate(today.getDate() - 1);
              end = new Date(start);
              label = 'Kemarin';
              break;
          case 'LAST_7_DAYS':
              end = new Date();
              start = new Date(); start.setDate(today.getDate() - 6);
              label = '7 Hari Terakhir';
              break;
          case 'THIS_MONTH':
              start = new Date(today.getFullYear(), today.getMonth(), 1);
              end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
              label = 'Bulan Ini';
              break;
          case 'LAST_MONTH':
              start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
              end = new Date(today.getFullYear(), today.getMonth(), 0);
              label = 'Bulan Lalu';
              break;
          case 'ALL_TIME':
              start = new Date(2020, 0, 1);
              end = new Date();
              label = 'Semua Waktu';
              break;
      }

      if (start && end) {
          updateFilterButtonUI(label);
          loadDashboardData(start, end);

          // Tutup dropdown
          const dropdown = document.getElementById('filter-dropdown');
          if(dropdown) dropdown.classList.add('hidden');
      }
  }

  // 6. Load Data Utama dari Server
  function loadDashboardData(startObj, endObj) {
      if(!startObj || !endObj) return; // Safety check

      // Simpan ke global state
      CURRENT_START = startObj;
      CURRENT_END = endObj;

      // Helper: Konversi Tanggal ke YYYY-MM-DD (Timezone Safe)
      const toISODate = (dt) => {
          if(!(dt instanceof Date)) return '';
          // Mengatasi pergeseran timezone
          const offset = dt.getTimezoneOffset() * 60000;
          return (new Date(dt - offset)).toISOString().slice(0, 10);
      };

      const startStr = toISODate(startObj);
      const endStr = toISODate(endObj);

      console.log(`Loading Dashboard: ${startStr} - ${endStr}`);

      // UI Loading Effect
      const ids = ['kpi-omset', 'kpi-profit', 'kpi-count', 'kpi-asset-real'];
      ids.forEach(id => {
          const el = document.getElementById(id);
          if(el) el.innerHTML = '<span class="animate-pulse text-gray-300">...</span>';
      });

      // Panggil Backend
      google.script.run
          .withSuccessHandler(renderDashboardUI)
          .withFailureHandler(err => {
              console.error("Error:", err);
              // Jangan pakai Swal error besar, cukup log atau toast kecil agar tidak mengganggu
              const kpiEl = document.getElementById('kpi-omset');
              if(kpiEl) kpiEl.innerText = "Error";
          })
          .getAdvancedDashboardData(startStr, endStr);
  }

                     : "https://ui-avatars.com/api/?name=" + (config.owner_name || 'Admin');

      // [FIX OTOMATIS] Jika URL masih format lama (uc?export=view), ubah ke format thumbnail
      if (imgUrl.includes("drive.google.com/uc?")) {
          // Ambil ID File dari URL lama

      const previewEl = document.getElementById('preview-profile-img');
      const currentValEl = document.getElementById('current-profile-img');

      if(previewEl) previewEl.src = imgUrl;
      // Simpan URL yang sudah diperbaiki ke hidden input agar saat save nanti terupdate di sheet

  let newProfileImgFile = null; // Variable global temp

  function previewProfileImage(input) {
      if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = function(e) {
              document.getElementById('preview-profile-img').src = e.target.result;
              // Simpan object file untuk dikirim ke backend
              const file = input.files[0];

                      data: ex.target.result.split(',')[1],
                      mimeType: file.type,
                      name: file.name
                  };
              };
              readerObj.readAsDataURL(file);

          reader.readAsDataURL(input.files[0]);
      }
  }

  // --- CLIENT SIDE: IMAGE COMPRESSION & PREVIEW ---

  // 1. Fungsi Utama: Preview & Kompres Gambar
  function previewLocalImage(input) {
      if (input.files && input.files[0]) {
          const file = input.files[0];

          // Kita pakai FileReader untuk membaca, lalu Image & Canvas untuk resize
          const reader = new FileReader();
          reader.onload = function(e) {
              const img = new Image();
              img.src = e.target.result;

              img.onload = function() {
                  // --- SETTING KOMPRESI ---
                  const MAX_WIDTH = 200; // Kecilkan ke 200px (Cukup untuk avatar)
                  const MAX_HEIGHT = 200;

                  let width = img.width;
                  let height = img.height;

                  // Hitung rasio agar tidak gepeng
                  if (width > height) {
                      if (width > MAX_WIDTH) {
                          height *= MAX_WIDTH / width;
                          width = MAX_WIDTH;
                      }
                  } else {
                      if (height > MAX_HEIGHT) {
                          width *= MAX_HEIGHT / height;
                          height = MAX_HEIGHT;
                      }
                  }

                  // Proses Gambar di Canvas
                  const canvas = document.createElement('canvas');
                  canvas.width = width;
                  canvas.height = height;
                  const ctx = canvas.getContext('2d');
                  ctx.drawImage(img, 0, 0, width, height);

                  // --- HASIL AKHIR (BASE64) ---
                  // Kualitas 0.6 (60%) agar file sangat ringan
                  const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);

                  // Tampilkan di Preview
                  document.getElementById('preview-profile-img').src = compressedDataUrl;

                  // Simpan ke Hidden Input (Ini yang dikirim ke server)
                  document.getElementById('profile-img-base64').value = compressedDataUrl;

                  console.log("Gambar dikompres. Panjang string: " + compressedDataUrl.length);
              }
          }
          reader.readAsDataURL(file);
      }
  }

  // --- LOGIN FUNCTION YANG SUDAH DIPERBAIKI ---
  function handleLogin(e) {
      if(e) e.preventDefault(); // Mencegah reload form

      // 1. [FIX ERROR] Gunakan ID yang benar sesuai index.html
      const userEl = document.getElementById('username');
      const passEl = document.getElementById('password');
      const btn = document.getElementById('signin-button');
      const errorMsg = document.getElementById('login-error');

      // Validasi elemen ada (Safety Check)
      if (!userEl || !passEl) {
          console.error("Elemen input login tidak ditemukan!");
          return;
      }

      const userVal = userEl.value;
      const passVal = passEl.value;

      // UI Loading
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Masuk...</span>';
      btn.disabled = true;
      if (errorMsg) errorMsg.classList.add('hidden');
      if (window.lucide) lucide.createIcons();

      // 2. [FIX BACKEND] Panggil fungsi 'doLogin' (sesuai Code.gs), bukan 'verifyUser'
      google.script.run
          .withSuccessHandler(function(res) {
              btn.disabled = false;
              btn.innerHTML = originalText;
              if (window.lucide) lucide.createIcons();

              if (res.success) {
                  // LOGIN SUKSES
                  currentUser = res.user || { username: userVal };

                  // 3. [FITUR BARU] SIMPAN SESI (SESSION PERSISTENCE)
                  // Simpan data user & waktu login saat ini
                  const sessionData = {
                      user: currentUser,
                      lastActivity: new Date().getTime() // Waktu login dalam milidetik
                  };
                  localStorage.setItem('bantuSellerSession', JSON.stringify(sessionData));

                   // Pindah ke Splash Screen dulu
                   document.getElementById('login-screen').classList.add('hidden');
                   showSplashThenDashboard(currentUser);

              } else {
                  // LOGIN GAGAL
                  if (errorMsg) {
                      errorMsg.textContent = res.message;
                      errorMsg.classList.remove('hidden');
                  } else {
                      Swal.fire({ icon: 'error', title: 'Login Gagal', text: res.message });
                  }
              }
          })
          .withFailureHandler(function(err) {
              console.error(err);
              btn.disabled = false;
              btn.innerHTML = originalText;
              if (window.lucide) lucide.createIcons();
              if (errorMsg) {
                  errorMsg.textContent = "Koneksi Gagal: " + err.message;
                  errorMsg.classList.remove('hidden');
              }
          })
          .doLogin(userVal, passVal, (bsGetLicense() || {}).sheetId || ''); // Kirim sheetId
  }

  // --- INISIALISASI (AUTO LOGIN CHECK) ---
  document.addEventListener('DOMContentLoaded', () => {
      if(window.lucide) lucide.createIcons();

      // ------------------------------------------------------------------
      // 1. [FITUR BARU] CEK SESI TERSIMPAN SAAT HALAMAN DIMUAT
      // ------------------------------------------------------------------
      const savedSession = localStorage.getItem('bantuSellerSession');
      let isAutoLoggedIn = false;

      if (savedSession) {
          try {
              const sess = JSON.parse(savedSession);
              const now = new Date().getTime();
              const oneDay = 24 * 60 * 60 * 1000; // 24 Jam dalam milidetik

              // Cek apakah sesi valid (kurang dari 1 hari yang lalu)
               if (now - sess.lastActivity < oneDay) {
                   // Sesi Valid -> Skip Login Screen, tampilkan Splash
                   currentUser = sess.user;

                   document.getElementById('login-screen').classList.add('hidden');
                   showSplashThenDashboard(currentUser);
                   isAutoLoggedIn = true;
              } else {
                  // Sesi Expired -> Hapus dan minta login lagi
                  localStorage.removeItem('bantuSellerSession');
              }
          } catch (e) {
              console.error("Gagal membaca sesi", e);
              localStorage.removeItem('bantuSellerSession');
          }
      }

      // Jika tidak login otomatis, pastikan form login siap
      if (!isAutoLoggedIn) {
          const loginForm = document.getElementById('login-form');
          if(loginForm) {
              // Hapus listener lama (opsional) dan pasang yang baru mengarah ke handleLogin
              loginForm.onsubmit = handleLogin;
          }
      }

      // 1. Toggle Password View
      const toggleBtn = document.getElementById('toggle-login-password');
      if(toggleBtn) {
          toggleBtn.addEventListener('click', function() {
              const input = document.getElementById('password');
              const icon = this.querySelector('i'); // Mengambil elemen icon di dalam tombol

              if (input.type === 'password') {
                  input.type = 'text';
                  // Ganti icon ke eye-off
                  if(icon) icon.setAttribute('data-lucide', 'eye-off');
              } else {
                  input.type = 'password';
                  // Ganti icon ke eye
                  if(icon) icon.setAttribute('data-lucide', 'eye');
              }
              if(window.lucide) lucide.createIcons();
          });
      }

      // 2. Submit Form
      const loginForm = document.getElementById('login-form');
      if(loginForm) {
          loginForm.addEventListener('submit', function(e) {
              e.preventDefault();

              // Ambil elemen berdasarkan ID di HTML Login Baru
              const userVal = document.getElementById('username').value;
              const passVal = document.getElementById('password').value;
              const btn = document.getElementById('signin-button');
              const errorMsg = document.getElementById('login-error');

              const originalBtnContent = btn.innerHTML;

              // Tampilkan Loading
              btn.disabled = true;
              btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>Masuk...</span>`;
              if(errorMsg) errorMsg.classList.add('hidden');

              // Panggil Backend
              google.script.run
                  .withSuccessHandler((res) => {
                      btn.disabled = false;
                      btn.innerHTML = originalBtnContent;
                      if(window.lucide) lucide.createIcons();

                       if (res.success) {
                           // LOGIN SUKSES
                           currentUser = res.user || { username: userVal };

                           // Tampilkan Splash lalu Dashboard
                           document.getElementById('login-screen').classList.add('hidden');
                           showSplashThenDashboard(currentUser);

                      } else {
                          // LOGIN GAGAL
                          if(errorMsg) {
                              errorMsg.textContent = res.message;
                              errorMsg.classList.remove('hidden');
                          } else {
                              alert(res.message);
                          }
                      }
                  })

                      btn.disabled = false;

                      if(errorMsg) {

  // --- 1. PREPARE EDIT USER (Isi Form dengan Data Lama) ---
  function prepareEditUser(index) {
      const user = GLOBAL_USERS_DATA[index];
      if(!user) return;

      // 1. Buka Modal (Ini akan me-reset form ke mode Add dulu)
      openAddUserModal();

      // 2. OVERRIDE KE MODE EDIT
      document.querySelector('#modal-add-user h3').innerText = "Edit User";
      document.getElementById('formMode').value = "edit";
      document.getElementById('oldUsername').value = user[0];

      const form = document.getElementById('formAddUser');
      form.username.value = user[0];
      form.email.value = user[1] || "";
      form.role.value = user[3];

      // 3. [FIX] ATUR PASSWORD UNTUK EDIT (TIDAK WAJIB)
      const passInput = form.querySelector('input[name="password"]');
      if(passInput) {
          passInput.required = false; // Boleh kosong saat edit
          passInput.placeholder = "Biarkan kosong jika tetap";
          passInput.value = ""; // Pastikan value kosong agar tidak menimpa password lama dengan text kosong
      }

      // 4. Centang Checkbox Permissions
      try {
          const accessObj = JSON.parse(user[4]);
          for (const [moduleId, actions] of Object.entries(accessObj)) {
              for (const [action, isActive] of Object.entries(actions)) {
                  if(isActive) {
                      const chk = document.querySelector(`input[name="perm_${moduleId}"][value="${action}"]`);
                      if(chk) chk.checked = true;
                  }
              }
          }
      } catch(e) {
          console.log("No valid access JSON");
      }
  }
