
<script>
  // ==========================================================
  // BUATSIMPEL LICENSE SYSTEM
  // ==========================================================
  const BS_LICENSE_KEY = 'bs_gudang_license';
  const BS_VERIFY_INTERVAL = 86400000; // 24 jam

  function bsGetLicense() {
    try { return JSON.parse(localStorage.getItem(BS_LICENSE_KEY)); } catch(e) { return null; }
  }

  function bsSaveLicense(data) {
    localStorage.setItem(BS_LICENSE_KEY, JSON.stringify(data));
  }

  function bsShowLicense() {
    var lic = document.getElementById('license-screen');
    var login = document.getElementById('login-screen');
    var dash = document.getElementById('dashboard-screen');
    if (lic) { lic.classList.remove('hidden'); lic.style.display = 'flex'; }
    if (login) { login.classList.add('hidden'); login.style.display = 'none'; }
    if (dash) { dash.classList.add('hidden'); dash.style.display = 'none'; }
    // Reset input fields
    var codeInput = document.getElementById('lic-code');
    var emailInput = document.getElementById('lic-email');
    var errEl = document.getElementById('lic-error');
    if (codeInput) codeInput.value = '';
    if (emailInput) emailInput.value = '';
    if (errEl) errEl.classList.add('hidden');
  }

  function bsShowLogin() {
    document.getElementById('license-screen').classList.add('hidden');
    document.getElementById('license-screen').style.display = 'none';
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('login-screen').style.display = 'flex';
  }

  function bsParseExp(dateStr) {
    if (!dateStr) return null;
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) d = new Date(dateStr.replace(' ', 'T') + '+07:00');
    if (isNaN(d.getTime())) return null;
    return d;
  }

  function bsIsLicenseValid() {
    var lic = bsGetLicense();
    if (!lic || !lic.code || !lic.expired) return false;
    var exp = bsParseExp(lic.expired);
    if (!exp || Date.now() >= exp.getTime()) return false;
    return true;
  }

  function bsActivate() {
    var code = document.getElementById('lic-code').value.trim().toUpperCase();
    var email = document.getElementById('lic-email').value.trim().toLowerCase();
    var sheetIdInput = document.getElementById('lic-sheet-id');
    var sheetId = sheetIdInput ? sheetIdInput.value.trim() : '';
    var errEl = document.getElementById('lic-error');
    var btn = document.getElementById('lic-activate-btn');

    if (!code || !email) {
      errEl.textContent = 'Isi kode dan email';
      errEl.classList.remove('hidden');
      return;
    }
    if (!sheetId || sheetId.length < 10) {
      errEl.textContent = 'ID Spreadsheet wajib diisi (minimal 10 karakter)';
      errEl.classList.remove('hidden');
      return;
    }

    btn.disabled = true;
    var spanEl = btn.querySelector('span');
    if (spanEl) spanEl.textContent = 'Memverifikasi...';
    errEl.classList.add('hidden');

    try {
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          if (spanEl) spanEl.textContent = 'Aktivasi';
          if (res && res.ok) {
            bsSaveLicense({
              code: code,
              email: email,
              plan: res.plan,
              expired: res.expired,
              sheetId: sheetId,
              lastVerify: Date.now()
            });
            // Tampilkan login + init semua komponen
            bsShowLogin();
            try { checkSession(); } catch(e) {}
            try { initTheme(); } catch(e) {}
            try { bsInitBanner(); } catch(e) {}
            try { if (typeof loadSettings === 'function') loadSettings(); } catch(e) {}
            try { if (window.lucide) lucide.createIcons(); } catch(e) {}
            // Setup login form listener
            var lf = document.getElementById('login-form');
            if (lf) {
              lf.replaceWith(lf.cloneNode(true));
              document.getElementById('login-form').addEventListener('submit', handleLoginSubmit);
            }
            var tpb = document.getElementById('toggle-login-password');
            if (tpb) {
              tpb.addEventListener('click', function() {
                var inp = document.getElementById('password');
                inp.type = inp.type === 'password' ? 'text' : 'password';
              });
            }
          } else {
            errEl.textContent = (res && res.msg) || 'Aktivasi gagal';
            errEl.classList.remove('hidden');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          if (spanEl) spanEl.textContent = 'Aktivasi';
          errEl.textContent = 'Gagal terhubung ke server: ' + (err.message || err);
          errEl.classList.remove('hidden');
        })
        .checkBuatSimpelLicense(code, email, sheetId);
    } catch(e) {
      btn.disabled = false;
      if (spanEl) spanEl.textContent = 'Aktivasi';
      errEl.textContent = 'Error: ' + e.message;
      errEl.classList.remove('hidden');
    }
  }

  function bsBackgroundVerify(code) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && !res.ok) {
          // Expired atau revoked
          localStorage.removeItem(BS_LICENSE_KEY);
          bsShowLicense();
        } else if (res && res.ok) {
          const lic = bsGetLicense();
          if (lic) {
            lic.lastVerify = Date.now();
            if (res.expired) lic.expired = res.expired;
            bsSaveLicense(lic);
          }
        }
      })
      .withFailureHandler(function() {
        // Offline = grace period, tetap jalan
      })
      .verifyBuatSimpelLicense(code);
  }

  // --- LICENSE BANNER (countdown di dashboard) ---
  function bsInitBanner() {
    var lic = bsGetLicense();
    var banner = document.getElementById('bs-license-banner');
    if (!banner || !lic || !lic.expired) return;

    var exp = bsParseExp(lic.expired);
    if (!exp) return;

    banner.classList.remove('hidden');

    var planLabels = {'2menit':'2 Menit (Test)','1bulan':'1 Bulan','3bulan':'3 Bulan','6bulan':'6 Bulan','1tahun':'1 Tahun'};
    var planEl = document.getElementById('bs-plan-badge');
    if (planEl) planEl.textContent = planLabels[lic.plan] || lic.plan;

    // Tampilkan tanggal expired dalam WIB
    var expEl = document.getElementById('bs-expired-date');
    if (expEl) {
      var optsDate = {timeZone:'Asia/Jakarta', day:'2-digit', month:'short', year:'numeric'};
      var optsTime = {timeZone:'Asia/Jakarta', hour:'2-digit', minute:'2-digit', hour12:false};
      expEl.textContent = exp.toLocaleDateString('id-ID', optsDate) + ' ' + exp.toLocaleTimeString('id-ID', optsTime).replace(/\./g, ':') + ' WIB';
    }

    function updateCountdown() {
      var now = Date.now();
      var diff = exp.getTime() - now;
      var cdEl = document.getElementById('bs-countdown');
      var statusEl = document.getElementById('bs-license-status');
      if (!cdEl) return;

      if (diff <= 0) {
        cdEl.textContent = 'EXPIRED';
        cdEl.style.color = '#fca5a5';
        if (statusEl) { statusEl.textContent = 'Lisensi Habis'; statusEl.style.color = '#fca5a5'; }
        if (banner) { banner.style.background = 'linear-gradient(135deg, #991b1b, #dc2626)'; }
        localStorage.removeItem(BS_LICENSE_KEY);
        setTimeout(function() { bsShowLicense(); }, 2000);
        return;
      }

      var days = Math.floor(diff / 86400000);
      var hours = Math.floor((diff % 86400000) / 3600000);
      var mins = Math.floor((diff % 3600000) / 60000);
      var secs = Math.floor((diff % 60000) / 1000);

      var parts = [];
      if (days > 0) parts.push(days + 'h');
      parts.push(hours + 'j');
      parts.push(mins + 'm');
      parts.push(secs + 'd');

      cdEl.textContent = parts.join(' ');

      if (diff < 86400000) {
        cdEl.style.color = '#fde68a';
        if (statusEl) statusEl.textContent = 'Segera Expired!';
      } else {
        if (statusEl) statusEl.textContent = 'Lisensi Aktif';
      }
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  }

  // --- STATE MANAGEMENT ---
  let productList = [];
  let historyList = [];
  let activeScanMode = 'IN';
  let currentUser = null;;
  let html5QrcodeScanner = null;
  let GLOBAL_USERS_DATA = [];
    let CALC_PERCENT_PRODUCTS = [];

  // ==========================================
  // --- UI HELPER (MODERN ALERTS) ---
  // ==========================================
  const UI = {
      // 1. LOADING MODERN (Minimalis & Bersih)
      showLoading: (title = 'Memuat Data...') => {
          Swal.fire({
              html: `
                  <div class="flex flex-col items-center justify-center p-4">
                      <div class="relative w-16 h-16 mb-4">
                          <div class="absolute inset-0 border-4 border-slate-100 rounded-full"></div>
                          <div class="absolute inset-0 border-4 border-blue-600 rounded-full border-t-transparent animate-spin"></div>
                          <div class="absolute inset-0 flex items-center justify-center">
                              <i data-lucide="database" class="w-6 h-6 text-blue-600"></i>
                          </div>
                      </div>
                      <h3 class="text-lg font-bold text-white tracking-wide">${title}</h3>
                      <p class="text-xs text-slate-300 mt-1">Mohon tunggu sebentar...</p>
                  </div>
              `,
              showConfirmButton: false,
              allowOutsideClick: false,
              background: 'transparent', // Transparan agar terlihat floating
              backdrop: 'rgba(15, 23, 42, 0.8)', // Slate-900 agak gelap
              customClass: {
                  popup: 'modern-loading-popup'
              },
              didOpen: () => {
                  if(window.lucide) lucide.createIcons();
              }
          });
      },

      // 2. SUKSES (Toast Kecil di Pojok)
      showSuccess: (title, message) => {
          Swal.fire({
              icon: 'success',
              title: title,
              text: message,
              toast: true,
              position: 'top-end',
              showConfirmButton: false,
              timer: 3000,
              timerProgressBar: true,
              background: '#ffffff',
              iconColor: '#10b981', // Emerald-500
              customClass: {
                  popup: 'rounded-xl shadow-xl border border-slate-100',
                  title: 'text-sm font-bold text-slate-700',
                  htmlContainer: 'text-xs text-slate-500'
              }
          });
      },

      // 3. ERROR (Modal Modern)
      showError: (title, message) => {
          Swal.fire({
              icon: 'error',
              title: title,
              text: message,
              confirmButtonText: 'Tutup',
              confirmButtonColor: '#f43f5e', // Rose-500
              background: '#fff',
              customClass: {
                  popup: 'rounded-2xl',
                  confirmButton: 'rounded-xl px-6 py-2.5 font-bold text-sm shadow-lg shadow-rose-200'
              }
          });
      },

      // 4. KONFIRMASI (Untuk Hapus/Simpan)
      confirm: (title, text, confirmText, confirmColor = '#0f172a') => {
          return Swal.fire({
              title: title,
              text: text,
              icon: 'question',
              showCancelButton: true,
              confirmButtonText: confirmText,
              cancelButtonText: 'Batal',
              confirmButtonColor: confirmColor,
              cancelButtonColor: '#f1f5f9', // Slate-100
              reverseButtons: true,
              customClass: {
                  popup: 'rounded-2xl p-6',
                  confirmButton: 'rounded-xl px-6 py-3 font-bold text-sm shadow-lg',
                  cancelButton: 'rounded-xl px-6 py-3 font-bold text-sm text-slate-500 hover:bg-slate-200 border border-slate-200'
              }
          });
      },

      close: () => Swal.close()
  };

  // --- INIT & CONFIG ---
  const MINIMUM_STOCK_LIMIT = 10;

  document.addEventListener('DOMContentLoaded', () => {
    if(window.lucide) lucide.createIcons();

    // 0. CEK LISENSI BUATSIMPEL DULU - HARUS VALID SEBELUM APAPUN
    var licBtn = document.getElementById('lic-activate-btn');
    if (licBtn) {
      licBtn.addEventListener('click', bsActivate);
    }
    var licCodeInput = document.getElementById('lic-code');
    var licEmailInput = document.getElementById('lic-email');
    if (licCodeInput) licCodeInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { if (licEmailInput) licEmailInput.focus(); } });
    if (licEmailInput) licEmailInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') bsActivate(); });

    // Cek lisensi - STOP di sini kalau tidak valid
    if (!bsIsLicenseValid()) {
      bsShowLicense();
      return; // STOP - jangan lanjut ke checkSession / initTheme / apapun
    }

    // Lisensi valid - lanjut ke login
    bsShowLogin();

    // Background verify setiap 24 jam
    var bsLic = bsGetLicense();
    if (bsLic && (Date.now() - (bsLic.lastVerify || 0) > BS_VERIFY_INTERVAL)) {
      bsBackgroundVerify(bsLic.code);
    }

    // 1. CEK SESI LOGIN SAAT PERTAMA LOAD
    checkSession();
    initTheme();

    // Init license banner countdown
    bsInitBanner();
    if(typeof loadSettings === 'function') {
        loadSettings(); 
    }

    // 2. SETUP LISTENER LOGIN FORM (Single Source of Truth)
    const loginForm = document.getElementById('login-form');
    if(loginForm) {
        // Hapus listener lama untuk mencegah double submit
        loginForm.replaceWith(loginForm.cloneNode(true));
        // Ambil ulang elemen setelah replace
        document.getElementById('login-form').addEventListener('submit', handleLoginSubmit);
    }

    // 3. SETUP TOGGLE PASSWORD LOGIN
    const toggleBtn = document.getElementById('toggle-login-password');
    if(toggleBtn) {
        toggleBtn.addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                if(icon) icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                if(icon) icon.setAttribute('data-lucide', 'eye');
            }
            if(window.lucide) lucide.createIcons();
        });
    }

    // 4. SETUP SCANNER MANUAL TRIGGER (halaman expedition + modal scanner)
    const manualMainInput = document.getElementById('manualResiInputMain');
    const manualModalInput = document.getElementById('manualResiInputModal');
    const manualMainBtn = document.getElementById('btnManualTriggerMain');

    [manualMainInput, manualModalInput].forEach((el) => {
        if (!el) return;
        el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === 'NumpadEnter' || e.key === 'Tab') {
                e.preventDefault();
                const source = (this.id === 'manualResiInputModal') ? 'modal' : 'main';
                handleManualTrigger(source);
            }
        });
    });

    if(manualMainBtn) {
        manualMainBtn.addEventListener('click', function() {
            handleManualTrigger('main');
        });
    }

        // 5. BRIDGE scanner eksternal (domain cpanel)
    initExternalScannerBridge();

        // 6. BRIDGE scanner bluetooth (keyboard wedge)
        initBluetoothScannerBridge();
  });

  // --- DATA LOADING (CORE) ---
  function loadInitialData() {
    // 1. TAMPILKAN LOADING STATE SEKARANG (Agar user tidak bingung)
    const tbody = document.getElementById('table-body-content');
    if(tbody) {
        tbody.innerHTML = `
          <tr>
              <td colspan="10" class="text-center py-12">
                  <div class="flex flex-col items-center justify-center gap-3 animate-pulse">
                      <i data-lucide="loader-2" class="w-8 h-8 text-blue-600 animate-spin"></i>
                      <span class="text-sm font-medium text-slate-500">Sedang mengambil data terbaru...</span>
                  </div>
              </td>
          </tr>
        `;
        if(window.lucide) lucide.createIcons();
    }

    loadProductionLog();

    // 2. Ambil Master Produk dari Server
    google.script.run.withSuccessHandler(data => {
      // DEBUG: Cek di Console browser (F12) berapa data yang masuk
      console.log("🔥 DATA DITERIMA SERVER:", data);
      console.log("Jumlah Baris:", data ? data.length : 0);

      // Simpan ke Global Variable
      productList = data || [];

      // Render Tabel Langsung (Tanpa peduli tab apa yang aktif, update saja dom-nya)
      renderProductTable();

      // Update Dashboard Assets
      if(typeof updateDashboardAssets === 'function') {
         updateDashboardAssets();
      }

    }).withFailureHandler(error => {
       console.error("GAGAL LOAD PRODUK:", error);
       if(tbody) {
           tbody.innerHTML = `
             <tr>
               <td colspan="10" class="text-center py-8 text-red-500">
                 <div class="font-bold">Gagal memuat data!</div>
                 <div class="text-xs">${error.message}</div>
               </td>
             </tr>`;
       }
    }).getProductList();
  }

  function updateDashboardAssets() {
    if(!productList.length) return;

    // Hitung Total Aset (Kolom K / Index 10) & Stok (Kolom H / Index 7)
    let totalAsset = 0;
    let totalStock = 0;
    let lowCount = 0;

    productList.forEach(row => {
       // Konversi string "10.000" atau "Rp 10.000" jadi angka murni
       const stock = parseNumber(row[7]);
       const asset = parseNumber(row[10]);

       totalStock += stock;
       totalAsset += asset;
       if(stock <= MINIMUM_STOCK_LIMIT) lowCount++;
    });

    if(document.getElementById('kpi-asset')) {
        document.getElementById('kpi-asset').innerHTML = `
          <h3 class="text-xl font-bold text-slate-800">${formatRupiah(totalAsset)}</h3>
          <p class="text-xs text-slate-400">Stok Menipis: <span id="kpi-low" class="${lowCount>0?'text-red-500 font-bold':'text-slate-500'}">${lowCount}</span></p>
        `;
    }
  }

  // --- MULTI-TENANT HELPER ---
  function getMySheetId() {
    var lic = bsGetLicense();
    return (lic && lic.sheetId) ? lic.sheetId : '';
  }

  function syncSheetIdToBackend() {
    var sid = getMySheetId();
    if (sid) google.script.run.setActiveSheetId(sid);
  }

  // --- SPLASH SCREEN TRANSITION ---
  function showSplashThenDashboard(user) {
    var splash = document.getElementById('splash-screen');
    var dashboard = document.getElementById('dashboard-screen');
    if (!splash || !dashboard) {
      dashboard.classList.remove('hidden');
      switchPage('dashboard');
      loadInitialData();
      return;
    }

    splash.style.display = 'flex';
    var lastPage = localStorage.getItem('lastActivePage') || 'dashboard';

    // Fungsi yang buka dashboard setelah splash
    function openDashboard() {
      splash.classList.add('fade-out');
      setTimeout(function() {
        splash.style.display = 'none';
        splash.classList.remove('fade-out');
        dashboard.classList.remove('hidden');
        switchPage(lastPage);
        loadInitialData();
        if (typeof Swal !== 'undefined' && user) {
          Swal.mixin({ toast: true, position: 'top', showConfirmButton: false, timer: 3000 })
            .fire({ icon: 'success', title: 'Selamat Datang, ' + (user.fullname || user.username || 'User') });
        }
      }, 600);
    }

    // Sync sheet_id ke backend DULU, baru buka dashboard
    var sid = getMySheetId();
    if (sid) {
      google.script.run
        .withSuccessHandler(function() { setTimeout(openDashboard, 1500); })
        .withFailureHandler(function() { setTimeout(openDashboard, 1500); })
        .setActiveSheetId(sid);
    } else {
      setTimeout(openDashboard, 2500);
    }
  }

  // --- NAVIGATION (FIXED: SIDEBAR + OPNAME VIEW) ---
  function switchPage(pageId) {
    // 1. Simpan Sesi Halaman Terakhir
    const savedSession = localStorage.getItem('bantuSellerSession');
    if (savedSession) {
        try {
            const sess = JSON.parse(savedSession);
            sess.lastActivity = new Date().getTime();
            localStorage.setItem('bantuSellerSession', JSON.stringify(sess));
        } catch(e) {}
    }
    localStorage.setItem('lastActivePage', pageId);

    // 2. UPDATE UI SIDEBAR (Supaya Sub-Menu Nyala)
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.sub-nav-item').forEach(el => el.classList.remove('active'));

    // Cek Menu Utama
    const activeBtn = document.querySelector(`.nav-item[onclick*="'${pageId}'"]`);
    if (activeBtn) activeBtn.classList.add('active');

    // Cek Sub Menu (Warna + Buka Dropdown Otomatis)
    const activeSub = document.querySelector(`.sub-nav-item[onclick*="'${pageId}'"]`);
    if (activeSub) {
        activeSub.classList.add('active');
        const parentDropdown = activeSub.closest('div[id^="submenu-"]');
        if (parentDropdown) {
            parentDropdown.classList.remove('hidden');
            const parentBtn = parentDropdown.previousElementSibling;
            if (parentBtn) {
                const chevron = parentBtn.querySelector('.chevron');
                if (chevron) chevron.classList.add('rotate-180');
            }
        }
    }

    // 3. ATUR TAMPILAN (VIEW) - PERBAIKAN LOGIKA DISINI
    document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));

    let viewId = 'view-' + pageId;

    // Mapping Khusus:
    if(pageId === 'products') viewId = 'view-table';
    if(pageId === 'history') viewId = 'view-table';
    if(pageId === 'stock-in') viewId = 'view-form';

    // [PENTING] Pastikan Stock Opname masuk ke view yang benar
    if(pageId === 'stock-opname') viewId = 'view-stock-opname';

    const target = document.getElementById(viewId);
    if(target) target.classList.remove('hidden');

    // 4. LOAD DATA (PANGGIL FUNGSI YANG BENAR)
    if (pageId === 'dashboard') {
        setTimeout(initDashboard, 100);
    }
    else if (pageId === 'products') {
        loadInitialData();
    }
    else if (pageId === 'orders') {
        loadOrders();
        initOrderFilter();
        loadTrackingAlerts();
    }
    else if (pageId === 'expedition') {
        loadExpeditionData();
        initExpeditionFilter();
    }
    else if (pageId === 'stock-in') {
        setupForm('stock-in');
    }
    else if (pageId === 'stock-opname') {
        loadStockOpname();
    }
    else if (pageId === 'profit') {
        loadProfitPage();
    }
    else if (pageId === 'profit-tiktok') {
        loadTiktokProfitPage();
    }
    else if (pageId === 'cek-ongkir') {
        // Static page, hanya render icons
        setTimeout(function() { if (window.lucide) lucide.createIcons(); }, 100);
    }
    else if (pageId === 'hutang-piutang') {
        loadHutangPiutang();
    }
    else if (pageId === 'backup') {
        loadBackupPage();
    }
    else if (pageId === 'production') {
        loadProductionLog();
    }
    else if (pageId === 'calc-percent') {
        loadCalcPercentPage();
    }
    else if (pageId === 'calc-roas') {
        loadCalcRoasPage();
    }
    else if (pageId === 'logs') {
        loadActivityLogs();
    }
    else if (pageId === 'users') {
        loadUsersData();
    }
    else if (pageId === 'settings') {
        loadSettings();
    }
    else if (pageId === 'logout') {
        confirmLogout(); // Panggil fungsi logout
        return;
    }
    else if (pageId === 'docs') {
        // Dokumentasi - static page, hanya perlu render icons
        setTimeout(function() { if (window.lucide) lucide.createIcons(); }, 100);
    }
    else if (pageId === 'history') {
         const thead = document.getElementById('table-header-row');
         const tbody = document.getElementById('table-body-content');
         if(thead) {
             thead.innerHTML = `<th class="px-6 py-3">Waktu</th><th class="px-6 py-3">Tipe</th><th class="px-6 py-3">Produk</th><th class="px-6 py-3 text-right">Jumlah</th><th class="px-6 py-3">Keterangan</th>`;
         }
         if(tbody) tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-slate-400 italic">Silakan akses riwayat detail per produk melalui menu <b>Master Produk</b> > Tombol <b>History</b>.</td></tr>`;
    }

    // Mobile Sidebar Close
    if(window.innerWidth < 768) {
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('sidebar-overlay').classList.add('hidden');
    }
    if(window.lucide) lucide.createIcons();
  }

  // --- UI INTERACTION: SIDEBAR ---
  function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('sidebar-overlay');

    // Cari tombol collapse
    const btn = document.querySelector('button[title="Collapse Sidebar"]');
    // Cari icon di dalamnya (bisa i atau svg)
    const icon = btn ? btn.querySelector('i, svg') : null;

    if (window.innerWidth < 768) {
        sb.classList.toggle('-translate-x-full');
        ov.classList.toggle('hidden');
    } else {
        sb.classList.toggle('collapsed');

        // --- LOGIKA GANTI ICON ---
        if (icon) {
            if (sb.classList.contains('collapsed')) {
                // Jika tertutup -> Ubah jadi Panah Kanan (Show)
                icon.setAttribute('data-lucide', 'chevrons-right');
                btn.setAttribute('title', 'Expand Sidebar'); // Update tooltip
            } else {
                // Jika terbuka -> Ubah jadi Panah Kiri (Hide)
                icon.setAttribute('data-lucide', 'chevrons-left');
                btn.setAttribute('title', 'Collapse Sidebar');
            }
        }
    }

    // [WAJIB] Render ulang icon agar perubahan terlihat
    if(window.lucide) lucide.createIcons();
  }

  // 2. Theme Toggle (Dark / Light Mode) - FIXED
  function toggleTheme() {
      const html = document.documentElement;
      const btn = document.getElementById('btn-theme-toggle');

      if (!btn) return;

      if (html.classList.contains('dark')) {
          // Ubah ke LIGHT
          html.classList.remove('dark');
          localStorage.setItem('theme', 'light');

          btn.classList.remove('text-yellow-400');
          // Kita timpa total HTML di dalam tombol agar icon ter-reset
          btn.innerHTML = '<i data-lucide="moon" class="w-5 h-5"></i>';
      } else {
          // Ubah ke DARK
          html.classList.add('dark');
          localStorage.setItem('theme', 'dark');

          btn.classList.add('text-yellow-400');
          // Kita timpa total HTML di dalam tombol agar icon ter-reset
          btn.innerHTML = '<i data-lucide="sun" class="w-5 h-5"></i>';
      }

      // Render ulang icon dari tag <i> yang baru kita masukkan
      if(window.lucide) lucide.createIcons();
  }

  // 3. Init Theme (Panggil saat Load) - FIXED
  function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const btn = document.getElementById('btn-theme-toggle');

      if (!btn) return;

      // Default Light Mode (Kecuali user pernah set Dark)
      if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          btn.classList.add('text-yellow-400');
          btn.innerHTML = '<i data-lucide="sun" class="w-5 h-5"></i>';
      } else {
          // Force Light Mode
          document.documentElement.classList.remove('dark');
          btn.classList.remove('text-yellow-400');
          btn.innerHTML = '<i data-lucide="moon" class="w-5 h-5"></i>';
      }

      if(window.lucide) lucide.createIcons();
  }

  // --- PRODUCT TABLE RENDERER (TAMBAH KOLOM MASUK) ---
  // Variabel Global untuk membatasi tampilan (agar ringan)
  let RENDER_LIMIT = 50;

  // --- 1. FUNGSI RENDER TABEL (UPDATE FIX KOLOM MASUK) ---
  // --- HELPER: Extract data dari row array ---
  function _extractRowData(row) {
      var sku = row[3] || '';
      var nama = row[1] || '';
      var varian = row[4] || '';
      var kategori = row[2] || '';
      var lokasi = row[12] || '';
      var barcodeDb = row[15] || '';
      var codeToPrint = (barcodeDb && barcodeDb.toString().trim() !== '') ? barcodeDb : sku;
      var awal = parseNumber(row[5]);
      var keluar = parseNumber(row[6]);
      var sisa = parseNumber(row[7]);
      var masuk = row[20] ? parseNumber(row[20]) : 0;
      var hpp = parseNumber(row[9]);
      var jual = parseNumber(row[11]);
      var aset = parseNumber(row[10]);
      var satuan = row[8] || 'Pcs';
      var imgUrl = '';
      if (row[14] && row[14].toString().length > 5) imgUrl = row[14];
      else if (row[13] && row[13].toString().length > 5) imgUrl = row[13];
      return { sku:sku, nama:nama, varian:varian, kategori:kategori, lokasi:lokasi, codeToPrint:codeToPrint, awal:awal, keluar:keluar, sisa:sisa, masuk:masuk, hpp:hpp, jual:jual, aset:aset, satuan:satuan, imgUrl:imgUrl };
  }

  function _esc(str) { return (str || '').replace(/'/g, "\\'"); }
  function _escClean(str) { return (str || '').replace(/'/g, ""); }

  function _imgHtml(url) {
      return url
          ? '<div class="w-10 h-10 rounded-lg overflow-hidden border border-gray-200 bg-white shrink-0"><img src="' + url + '" class="w-full h-full object-cover" onerror="this.src=\'https://placehold.co/100x100?text=No+Img\'"></div>'
          : '<div class="w-10 h-10 rounded-lg bg-gray-100 flex items-center justify-center text-gray-300 border border-gray-200 shrink-0"><i data-lucide="image-off" class="w-4 h-4"></i></div>';
  }

  function _stockBadge(sisa, satuan) {

  // --- TOGGLE EXPAND/COLLAPSE VARIASI ---
  window.toggleVariantGroup = function(parentSku) {
      var rows = document.querySelectorAll('.variant-child-' + CSS.escape(parentSku));
      var icon = document.getElementById('expand-icon-' + parentSku);
      if (!rows.length) return;
      var isHidden = rows[0].classList.contains('hidden');

      rows.forEach(function(r) {
          if (isHidden) {
              r.classList.remove('hidden');
              r.style.animation = 'fadeIn 0.2s ease';
          } else {
              r.classList.add('hidden');
              r.style.animation = '';
          }
      });

      if (icon) {
          icon.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
      }
  };

  function renderProductTable(dataInput = null) {
      const thead = document.getElementById('table-header-row');
      const tbody = document.getElementById('table-body-content');
      const footerInfo = document.getElementById('table-footer-info');

      const dataSource = dataInput || productList;

      thead.innerHTML = `
        <th class="px-4 py-4 w-[80px] text-xs font-bold uppercase text-slate-500">Foto</th>
        <th class="px-6 py-4 w-[25%] text-xs font-bold uppercase text-slate-500">Info Produk</th>
        <th class="px-4 py-4 w-[15%] text-xs font-bold uppercase text-slate-500">Kategori</th>
        <th class="px-4 py-4 text-center w-[8%] text-xs font-bold uppercase text-slate-400">Awal</th>
        <th class="px-4 py-4 text-center w-[8%] text-xs font-bold uppercase text-blue-500">Masuk</th>
        <th class="px-4 py-4 text-center w-[8%] text-xs font-bold uppercase text-rose-500">Keluar</th>
        <th class="px-4 py-4 text-center w-[8%] text-xs font-bold uppercase text-emerald-600">Sisa</th>
        <th class="px-6 py-4 text-right w-[15%] text-xs font-bold uppercase text-slate-500">Harga</th>
        <th class="px-6 py-4 text-right w-[15%] text-xs font-bold uppercase text-slate-500">Aset</th>
        <th class="px-4 py-4 text-center w-[10%] text-xs font-bold uppercase text-slate-500">Aksi</th>
      `;

      if(!Array.isArray(dataSource) || dataSource.length === 0) {
          tbody.innerHTML = '<tr><td colspan="10" class="px-6 py-12 text-center text-gray-400">Data Kosong</td></tr>';
          return;
      }

      // --- STEP 1: Group by SKU Induk (Parent) ---
      var grouped = {};
      var groupOrder = [];
      var limitedData = dataSource.slice(0, RENDER_LIMIT);

      limitedData.forEach(function(row) {
          var parentSku = String(row[0] || '').trim();
          var key = parentSku || String(row[3] || '').trim();
          if (!grouped[key]) {
              grouped[key] = [];
              groupOrder.push(key);
          }
          grouped[key].push(row);
      });

      // --- STEP 2: Render ---
      var html = '';
      var totalProducts = 0;

      groupOrder.forEach(function(key) {
          var variants = grouped[key];
          totalProducts++;

          if (variants.length === 1) {
              html += _buildSingleRow(variants[0]);
          } else {
              var safeId = key.replace(/[^a-zA-Z0-9]/g, '_');
              html += _buildParentRow(variants[0], variants, safeId);
              for (var v = 0; v < variants.length; v++) {
                  html += _buildChildRow(variants[v], safeId, v === variants.length - 1);
              }
          }
      });

      tbody.innerHTML = html;

      if(footerInfo) {
          footerInfo.innerText = totalProducts + ' produk (' + limitedData.length + ' variasi) dari ' + dataSource.length + ' total data.';
      }
      lucide.createIcons();
  }

  // --- 2. FUNGSI PENCARIAN (VERSI CEPAT / ARRAY FILTER) ---
  function filterTable() {
    const input = document.getElementById('searchBox');
    const filterText = input.value.toLowerCase().trim();

    // Jika pencarian kosong, kembalikan ke data utama (productList)
    if (!filterText) {
        renderProductTable(productList);
        return;
    }

    // Filter: jika salah satu variasi match, tampilkan SEMUA variasi dari parent yang sama
    // Ini agar grouped view tetap konsisten
    var matchedParents = new Set();
    productList.forEach(function(row) {
        var nama = String(row[1] || "").toLowerCase();
        var sku = String(row[3] || "").toLowerCase();
        var varian = String(row[4] || "").toLowerCase();
        var parentSku = String(row[0] || "").trim();

        if (nama.includes(filterText) || sku.includes(filterText) || varian.includes(filterText)) {
            matchedParents.add(parentSku || sku); // Gunakan SKU jika parent kosong
        }
    });

    var filteredResults = productList.filter(function(row) {
        var parentSku = String(row[0] || "").trim();
        var sku = String(row[3] || "").trim();
        return matchedParents.has(parentSku || sku);
    });

    // Render ulang tabel HANYA dengan data hasil pencarian
    renderProductTable(filteredResults);
  }

  // --- SETUP FORM (RESET LOGIC) ---
  function setupForm(type) {
    // 1. Generate No Referensi
    const now = new Date();
    const inv = `TRX/${now.getDate()}${now.getMonth()+1}/${Math.floor(Math.random()*10000)}`;
    const refInput = document.getElementById('trxRef');
    if(refInput) refInput.value = inv;

    // 2. Setup Tanggal
    flatpickr("#trxDate", { dateFormat: "Y-m-d", defaultDate: "today" });

    // 3. Reset Tampilan Khusus Stock In
    if(type === 'stock-in') {
        const container = document.getElementById('stockInContainer');
        const toggle = document.getElementById('newProductToggle');
        const prodSection = document.getElementById('newProductSection');
        const btnAdd = document.getElementById('btnAddRow');

        if(container) container.innerHTML = ''; // Hapus baris lama
        if(toggle) toggle.classList.remove('hidden');
        if(prodSection) prodSection.classList.add('hidden');
        if(btnAdd) btnAdd.classList.remove('hidden');

        // Reset Toggle ke posisi OFF (Mode Restock)
        const checkNew = document.getElementById('isNewProduct');
        if(checkNew) {
            checkNew.checked = false;
            toggleNewProductFields();
        }

        // Tambah 1 baris input default
        addStockInRow();
    }

    }

  // --- UTILS & HELPERS ---
  function parseNumber(val) {
    if(typeof val === 'number') return val;
    if(!val) return 0;
    // Hapus 'Rp', titik ribuan, spasi -> lalu parse
    const clean = String(val).replace(/[^0-9,-]+/g,"").replace(',', '.');
    return parseFloat(clean) || 0;
  }

  function formatRupiah(num) {
    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);
  }

  function formatDate(dateInput) {
    if (dateInput === null || dateInput === undefined || dateInput === '') return '-';

    // 1. Jika Input adalah Angka (Serial Excel dari Library XLSX)
    if (typeof dateInput === 'number') {
        // Excel serial date mulai dari 30 Des 1899
        // Rumus konversi ke JS Time: (Serial - 25569) * 86400 * 1000
        const jsDate = new Date(Math.round((dateInput - 25569) * 86400 * 1000));
        return formatOutputDate(jsDate);
    }

    // 2. Jika Input adalah String (Teks)
    if (typeof dateInput === 'string') {
        const s = dateInput.trim();
        let d = null;

        // POLA A: DD/MM/YYYY HH:mm:ss (Format Indonesia/UK dengan Waktu)
        // Contoh: "27/12/2025 22:05:00" atau "27-12-2025"
        // Regex ini menangkap: Group 1 (Tgl), Group 2 (Bln), Group 3 (Thn), Group 4-6 (Jam, Menit, Detik opsional)
        const matchIndo = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})(?:\s(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);

        if (matchIndo) {
             const day = parseInt(matchIndo[1], 10);
             const month = parseInt(matchIndo[2], 10) - 1; // JS Month mulai 0 (Jan) s/d 11 (Des)
             const year = parseInt(matchIndo[3], 10);
             const hour = matchIndo[4] ? parseInt(matchIndo[4], 10) : 0;
             const min = matchIndo[5] ? parseInt(matchIndo[5], 10) : 0;
             const sec = matchIndo[6] ? parseInt(matchIndo[6], 10) : 0;

             d = new Date(year, month, day, hour, min, sec);
        }
        // POLA B: YYYY-MM-DD (Format ISO/Database)
        // Contoh: "2025-12-27"
        else if (/^\d{4}[\/\-\.]\d{1,2}[\/\-\.]\d{1,2}/.test(s)) {
             d = new Date(s);
        }
        // POLA C: Fallback (Coba parse langsung)
        else {
             d = new Date(s);
        }

        return formatOutputDate(d);
    }

    // 3. Jika Input sudah Date Object
    if (dateInput instanceof Date) {
        return formatOutputDate(dateInput);
    }

    return '-';
  }

  // Helper kecil untuk seragamkan output tampilan akhir (FIX: Dengan Detik)
  function formatOutputDate(d) {
      if (!d || isNaN(d.getTime())) return '-';

      const pad = (n) => String(n).padStart(2, '0');
      const day = pad(d.getDate());
      const month = pad(d.getMonth() + 1);
      const year = d.getFullYear();
      
      const hour = pad(d.getHours());
      const min = pad(d.getMinutes());
      const sec = pad(d.getSeconds()); // Tambahkan Detik

      // Format Wajib: DD/MM/YYYY HH:mm:ss
      return `${day}/${month}/${year} ${hour}:${min}:${sec}`;
  }

      if (value !== '') {

  // --- FUNGSI BULK UPDATE HARGA ---
  function handleBulkInput(type, input) {
      // 1. Format input bulk itu sendiri (biar ada titiknya)
      formatCurrencyInput(input);
      const value = input.value;

      // 2. Cari semua baris variasi yang ada
      const rows = document.querySelectorAll('#modal-variant-container .variant-row');

      // 3. Loop dan update value
      rows.forEach(row => {
          if (type === 'HPP') {
              const field = row.querySelector('.var-price');
              if(field) field.value = value;
          } else if (type === 'SELL') {
              const field = row.querySelector('.var-sell');
              if(field) field.value = value;
          }
      });
  }

  // --- OPTIMASI LOAD KATEGORI (Gunakan String Join agar Cepat) ---
  function loadCategoryData() {
    const select = document.getElementById('modal-new-cat');
    if (select.options.length > 1) return; // Stop jika sudah ada isinya

    // Panggil Server
    google.script.run.withSuccessHandler(data => {
        let html = '<option value="" disabled selected>- Pilih Kategori -</option>';

        if (!data || data.length === 0) {
            html += '<option value="GEN" data-code="GEN">General</option>';
        } else {
            // TEKNIK JOIN: Gabungkan string dulu baru masukkan ke DOM (1x Render)
            // Jauh lebih ringan daripada appendChild satu-satu
            html += data.map(row => {
                const name = row[0];
                const code = row[1] || name.substring(0,3).toUpperCase();
                return `<option value="${name}" data-code="${code}">${name}</option>`;
            }).join('');
        }

        select.innerHTML = html;
    }).getConfigData();
  }

  // --- FUNGSI UTAMA: SIMPAN TRANSAKSI (DENGAN UPLOAD GAMBAR) ---
  async function submitTransaction(e) {
    e.preventDefault();

    if (IS_EDIT_MODE) {
        submitEditProduct();
        return;
    }

    const btn = document.querySelector('#formStockIn button[type="submit"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = 'Mengupload Gambar...'; btn.disabled = true;

    let payload = {
        type: 'IN',
        date: document.getElementById('modal-date').value,
        ref: document.getElementById('modal-ref').value,
        isNew: document.getElementById('modal-isNew').checked,
        items: []
    };

    try {
        if (payload.isNew) {
            payload.name = toTitleCase(document.getElementById('modal-new-name').value);
            const catSelect = document.getElementById('modal-new-cat');
            payload.category = catSelect.value;
            payload.categoryCode = catSelect.options[catSelect.selectedIndex]?.dataset.code || 'GEN';
            payload.unit = toTitleCase(document.getElementById('modal-new-unit').value);
            payload.location = document.getElementById('modal-new-rack').value.toUpperCase() || '-';
            payload.parentSku = document.getElementById('modal-new-parent-sku').value;

            const mainImgInput = document.getElementById('main-image-upload');
            payload.mainImage = null;
            if(mainImgInput.files.length > 0) {
                payload.mainImage = await fileToBase64(mainImgInput.files[0]);
            }

            const varRows = document.querySelectorAll('#modal-variant-container .variant-row');
            payload.variations = [];

            if(varRows.length === 0) throw new Error("Minimal harus ada 1 variasi.");

            for (const row of varRows) {
                 const vSku = row.querySelector('.var-sku').value;
                 const vName = row.querySelector('.var-name').value.trim();
                 const vQty = parseFormattedNumber(row.querySelector('.var-qty').value);
                 const vHpp = parseFormattedNumber(row.querySelector('.var-price').value);
                 const vSell = parseFormattedNumber(row.querySelector('.var-sell').value);

                 // --- AMBIL NILAI BARCODE ---
                 const vBarcode = row.querySelector('.var-barcode').value.trim();

                 const vImgInput = row.querySelector('.var-img-input');
                 let vImagePayload = null;
                 if(vImgInput && vImgInput.files.length > 0) {
                     vImagePayload = await fileToBase64(vImgInput.files[0]);
                 }

                 // Push variasi jika ada nama ATAU ada data lain (stok/hpp/jual)
                 if(vName || vQty || vHpp || vSell) {
                      var vMarginEl = row.querySelector('.var-margin');
                      var vAdmin = vMarginEl ? parseFloat(vMarginEl.value) || 0 : 0;
                      var vMarginTiktokEl = row.querySelector('.var-margin-tiktok');
                      var vAdminTiktok = vMarginTiktokEl ? parseFloat(vMarginTiktokEl.value) || 0 : 0;
                      payload.variations.push({
                          sku: vSku,
                          name: vName || ('Variasi ' + (payload.variations.length + 1)),
                          qty: vQty || 0,
                          price: vHpp,
                          sellPrice: vSell,
                          adminPct: vAdmin,
                          adminTiktok: vAdminTiktok,
                          image: vImagePayload,
                          barcode: vBarcode
                      });
                  }
            }

        } else {
            // Mode Restock
            const rows = document.querySelectorAll('#modal-list-container > div');
            rows.forEach(row => {
                const sku = row.querySelector('.row-sku').value;
                const qty = parseFormattedNumber(row.querySelector('.row-qty').value);
                const price = parseFormattedNumber(row.querySelector('.row-price').value);
                if (sku && qty) payload.items.push({ sku, qty, price: price });
            });
            if (payload.items.length === 0) throw new Error("Isi barang dulu.");
        }

        google.script.run.withSuccessHandler(res => {
            Swal.fire('Berhasil', res.message, 'success');
            closeStockInModal(); loadInitialData();
            btn.innerHTML = originalText; btn.disabled = false;
        }).withFailureHandler(err => {
            Swal.fire('Gagal', err.message, 'error');
            btn.innerHTML = originalText; btn.disabled = false;
        }).handleTransaction(payload);

    } catch (error) {
        Swal.fire('Error', error.message, 'warning');
        btn.innerHTML = originalText; btn.disabled = false;
    }
  }

  // --- FUNGSI SUBMIT KHUSUS EDIT ---
  async function submitEditProduct() {
     const btn = document.querySelector('#formStockIn button[type="submit"]');
     const originalText = btn.innerHTML;
     btn.innerHTML = 'Mengupdate...'; btn.disabled = true;

     try {
         const allRows = document.querySelectorAll('#modal-variant-container .variant-row');
         const parentSku = document.getElementById('modal-new-parent-sku').value;
         const prodName = toTitleCase(document.getElementById('modal-new-name').value);
         const category = document.getElementById('modal-new-cat').value;
         const unit = toTitleCase(document.getElementById('modal-new-unit').value);
         const location = document.getElementById('modal-new-rack').value.toUpperCase();

         let mainImagePayload = null;
         const mainImgInput = document.getElementById('main-image-upload');
         if(mainImgInput && mainImgInput.files.length > 0) {
             mainImagePayload = await fileToBase64(mainImgInput.files[0]);
         }

         // Pisahkan: variasi lama (SKU readonly) vs variasi baru (SKU editable)
         var existingUpdates = [];
         var newVariations = [];

         for (const row of allRows) {
             const skuInput = row.querySelector('.var-sku');
             const isReadonly = skuInput.hasAttribute('readonly');
             const vSku = skuInput.value.trim();
             const vName = row.querySelector('.var-name').value.trim();
             const vSell = parseFormattedNumber(row.querySelector('.var-sell').value);
             const vMargin = parseFloat(row.querySelector('.var-margin')?.value) || 0;
             const vMarginTiktok = parseFloat(row.querySelector('.var-margin-tiktok')?.value) || 0;
             const vBarcode = row.querySelector('.var-barcode')?.value.trim() || '';

             let vImagePayload = null;
             const vImgInput = row.querySelector('.var-img-input');
             if(vImgInput && vImgInput.files.length > 0) {
                 vImagePayload = await fileToBase64(vImgInput.files[0]);
             }

             if (isReadonly && vSku) {
                 // Variasi lama — update data yang bisa diubah
                 existingUpdates.push({
                     originalSku: vSku,
                     parentSku: parentSku,
                     name: prodName,
                     category: category,
                     unit: unit,
                     location: location,
                     sku: vSku,
                     varName: vName,
                     sellPrice: vSell,
                     adminPct: vMargin,
                     adminTiktok: vMarginTiktok,
                     barcode: vBarcode,
                     newMainImage: mainImagePayload,
                     newVarImage: vImagePayload
                 });
             } else if (vName || parseFormattedNumber(row.querySelector('.var-qty')?.value) || parseFormattedNumber(row.querySelector('.var-price')?.value)) {
                 // Variasi baru — perlu ditambahkan
                 const vQty = parseFormattedNumber(row.querySelector('.var-qty').value);
                 const vHpp = parseFormattedNumber(row.querySelector('.var-price').value);
                 newVariations.push({
                     sku: vSku,
                     name: vName || ('Variasi ' + (newVariations.length + 1)),
                     qty: vQty,
                     price: vHpp,
                     sellPrice: vSell,
                     adminPct: vMargin,
                     adminTiktok: vMarginTiktok,
                     barcode: vBarcode,
                     image: vImagePayload
                 });
             }
         }

         // 1. Update variasi yang sudah ada (satu per satu)
         var updateCount = existingUpdates.length;
         var doneCount = 0;
         var hasError = false;

         function checkAllDone() {
             doneCount++;
             if (doneCount >= updateCount + (newVariations.length > 0 ? 1 : 0)) {
                 var msg = 'Berhasil update ' + updateCount + ' variasi.';
                 if (newVariations.length > 0) msg += ' Ditambahkan ' + newVariations.length + ' variasi baru.';
                 Swal.fire('Berhasil', msg, 'success');
                 closeStockInModal();
                 loadInitialData();
                 IS_EDIT_MODE = false;
                 EDIT_TARGET_SKU = null;
                 btn.innerHTML = originalText; btn.disabled = false;
             }
         }

         if (updateCount === 0 && newVariations.length === 0) {
             throw new Error('Tidak ada perubahan untuk disimpan.');
         }

         // Update existing
         existingUpdates.forEach(function(payload) {
             google.script.run.withSuccessHandler(function() {
                 checkAllDone();
             }).withFailureHandler(function(err) {
                 if (!hasError) { hasError = true; Swal.fire('Error', err.message, 'error'); }
                 btn.innerHTML = originalText; btn.disabled = false;
             }).updateProductData(payload);
         });

         // 2. Tambah variasi baru via handleTransaction (type IN, isNew, append ke parent yang sama)
         if (newVariations.length > 0) {
             var addPayload = {
                 type: 'IN',
                 isNew: true,
                 parentSku: parentSku,
                 name: prodName,
                 category: category,
                 unit: unit,
                 location: location,
                 mainImage: mainImagePayload,
                 ref: 'ADD-VAR-' + Date.now(),
                 variations: newVariations
             };

             google.script.run.withSuccessHandler(function() {
                 checkAllDone();
             }).withFailureHandler(function(err) {
                 if (!hasError) { hasError = true; Swal.fire('Error', 'Gagal tambah variasi: ' + err.message, 'error'); }
                 btn.innerHTML = originalText; btn.disabled = false;
             }).handleTransaction(addPayload);
         }

         // Jika tidak ada update existing, hanya variasi baru
         if (updateCount === 0 && newVariations.length > 0) {
             // checkAllDone akan dipanggil oleh handleTransaction callback
         }

     } catch (error) {
         Swal.fire('Error', error.message, 'error');
         btn.innerHTML = originalText; btn.disabled = false;
     }
  }

  //HELPER: Convert File to Base64 (Agar bisa dikirim ke Google Script)
  const fileToBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve({
          data: reader.result.split(',')[1], // Ambil datanya saja (hapus header data:image...)
          mimeType: file.type,
          fileName: file.name
      });
      reader.onerror = error => reject(error);
  });

  // --- UTILS: FORMAT CURRENCY INPUT ---

  // 1. Format saat mengetik (Menambah titik otomatis)
  function formatCurrencyInput(input) {
      // Hapus karakter selain angka
      let value = input.value.replace(/\D/g, '');

      // Tambahkan titik ribuan
      if (value) {
          value = new Intl.NumberFormat('id-ID').format(value);
      }

      input.value = value;
  }

  // 2. Bersihkan format saat simpan (Menghapus titik agar jadi angka murni)
  function parseFormattedNumber(val) {
      if (!val) return 0;
      // Hapus semua titik, lalu jadikan Number
      return Number(String(val).replace(/\./g, '')) || 0;
  }

  // --- FUNGSI BARU: SALIN NILAI KE SEMUA BARIS ---
  function copyValueToAll(button, fieldClass) {
      // 1. Cari baris tempat tombol diklik (sumber)
      const sourceRow = button.closest('.variant-row');
      // 2. Ambil nilai dari input di baris sumber tersebut
      const sourceValue = sourceRow.querySelector('.' + fieldClass).value;

      if(!sourceValue || sourceValue === '0') {
          // Opsional: Beri tahu jika nilai kosong
          // Swal.fire('Info', 'Isi nilai terlebih dahulu.', 'info');
          return;
      }

      // 3. Ambil semua baris variasi
      const allRows = document.querySelectorAll('#modal-variant-container .variant-row');

      // 4. Loop semua baris dan tempel nilainya
      let count = 0;
      allRows.forEach(row => {
          // Skip baris sumber itu sendiri (agar efisien)
          if(row !== sourceRow) {
               const targetField = row.querySelector('.' + fieldClass);
               targetField.value = sourceValue;
               count++;
          }
      });

      // 5. Beri feedback visual kecil (ikon berubah jadi centang sebentar)
      if(count > 0) {
          const originalHtml = button.innerHTML;
          button.innerHTML = '<i data-lucide="check" class="w-3 h-3 text-emerald-500"></i>';
          lucide.createIcons({ root: button });

          setTimeout(() => {
              button.innerHTML = originalHtml;
              lucide.createIcons({ root: button });
          }, 1000);
      }
  }

  // --- FUNGSI PREVIEW GAMBAR (CLIENT SIDE) ---
  function handleImagePreview(input, previewId, placeholderId) {
      const preview = document.getElementById(previewId);
      const placeholder = document.getElementById(placeholderId);

      const file = input.files[0];

      if (file) {
          // Validasi ukuran (optional, contoh max 2MB)
          if(file.size > 2 * 1024 * 1024) {
              Swal.fire('Error', 'Ukuran file maksimal 2MB', 'warning');
              input.value = ''; // Reset input
              return;
          }

          // Gunakan FileReader untuk membaca file sebagai URL data
          const reader = new FileReader();
          reader.onload = function(e) {
              preview.src = e.target.result;
              preview.classList.remove('hidden'); // Tampilkan gambar
              placeholder.classList.add('hidden'); // Sembunyikan icon placeholder
          }
          reader.readAsDataURL(file);
      } else {
          // Jika batal pilih file, reset tampilan
          preview.src = '';
          preview.classList.add('hidden');
          placeholder.classList.remove('hidden');
      }
  }

  // --- FUNGSI HAPUS PRODUK (SECURED) ---

      if (!currentUser || !currentUser.username) {
          Swal.fire('Error', 'Sesi habis. Silakan login ulang.', 'error');
          return;

      UI.confirm(
          'Hapus Produk?',
          `Anda yakin ingin menghapus "${nama}"?`,

              google.script.run.withSuccessHandler((res) => {

                      UI.showSuccess('Terhapus!', res.message);
                      loadInitialData();
                  } else {
                      // Tampilkan pesan "AKSES DITOLAK" dari backend
                      UI.showError('Gagal', res.message);
                  }
              }).deleteProductBySku(sku, currentUser.username);

  // Helper kecil untuk format value di input
  function formatCurrencyValue(val) {
      if(!val) return '0';
      return new Intl.NumberFormat('id-ID').format(val);
  }

  // --- HELPER: FORMAT TEXT CAPITALIZED ---
  function toTitleCase(str) {
      if (!str) return "";
      // 1. Ubah semua jadi huruf kecil dulu
      // 2. Ubah huruf pertama setiap kata jadi besar
      return str.toLowerCase().replace(/\b\w/g, s => s.toUpperCase());
  }

  // --- HELPER: GENERATE SKU CODE PINTAR ---
  function generateSmartVarCode(name) {
      if(!name) return "";
      const clean = name.toUpperCase();

      // Pisahkan berdasarkan spasi, garis miring (/), strip (-), atau KOMA (,)
      const parts = clean.split(/[\s\/\-,]+/).filter(i => i.length > 0);

      if(parts.length >= 2) {
          // KASUS 2 KATA ATAU LEBIH (Cth: "Putih,XL" atau "Merah / XL")
          // Ambil 3 huruf depan kata pertama + kata terakhir (full)
          // "Putih,XL" → PUT-XL
          // "Putih,XXS" → PUT-XXS
          const prefix = parts[0].substring(0,3);
          const suffix = parts[parts.length - 1];
          return prefix + '-' + suffix;
      } else {
          // KASUS 1 KATA (Cth: "Polos")
          // Ambil 5 huruf pertama (lebih panjang agar unik)
          // Hasil: POLOS
          return clean.replace(/[^a-zA-Z0-9]/g, '').substring(0, 5);
      }
  }

  // LOGIKA FILTER CHANNEL MULTI-SELECT

  // 1. INIT FILTER (Dipanggil saat halaman orders dibuka)
  function initOrderFilter() {
      // Ambil Config Channel dari Server
      google.script.run.withSuccessHandler(data => {
          // Data Config: Col E (Index 4) = Nama, Col F (Index 5) = Icon
          // Filter yang valid saja
          AVAILABLE_CHANNELS = data.filter(row => row[4]).map(row => ({

  // 2. RENDER DROPDOWN
  function renderChannelFilterDropdown() {
      const listContainer = document.getElementById('filter-channel-list');
      if(!listContainer) return;

      listContainer.innerHTML = AVAILABLE_CHANNELS.map(c => {

  // 3. TOGGLE SINGLE CHANNEL
  function toggleSingleChannel(checkbox) {
      const val = checkbox.value;
      if (checkbox.checked) {
          FILTER_SELECTED_CHANNELS.add(val);
      } else {
          FILTER_SELECTED_CHANNELS.delete(val);
      }

      // Cek status "Select All" checkbox
      const allChk = document.getElementById('chk-all-channels');
      if(allChk) {
          // Jika jumlah yg dipilih == total channel, maka Select All dicentang
          allChk.checked = (FILTER_SELECTED_CHANNELS.size === AVAILABLE_CHANNELS.length);
      }

      updateFilterLabel();
      filterOrderTable(); // Trigger Filter Table Realtime
  }

  // 4. TOGGLE SELECT ALL
  function toggleAllChannels(checkbox) {
      const checkboxes = document.querySelectorAll('#filter-channel-list input[type="checkbox"]');

      if (checkbox.checked) {
          // Centang Semua
          FILTER_SELECTED_CHANNELS.clear();
          AVAILABLE_CHANNELS.forEach(c => FILTER_SELECTED_CHANNELS.add(c.name));
          checkboxes.forEach(chk => chk.checked = true);
      } else {
          // Uncentang Semua
          FILTER_SELECTED_CHANNELS.clear();
          checkboxes.forEach(chk => chk.checked = false);
      }

  // 5. UPDATE LABEL BUTTON
  function updateFilterLabel() {
      const label = document.getElementById('filter-channel-label');
      const total = AVAILABLE_CHANNELS.length;
      const selected = FILTER_SELECTED_CHANNELS.size;

      if (selected === 0) {
          label.innerText = "Pilih Channel";
          label.className = "truncate max-w-[100px] text-gray-400 italic";
      } else if (selected === total) {
          label.innerText = "Semua Channel";

  // 2. PROCESS RAW DATA (GROUPING)
  // Data mentah dari sheet (berulang per item) diubah jadi 1 Object per Order ID
  function processOrderData(rawData) {
      if(!rawData || rawData.length === 0) {
          ALL_ORDERS_CACHE = [];
          renderOrderPagination();
          return;
      }

      const grouped = {};
      const orderIds = []; // Untuk menjaga urutan waktu (terbaru diatas)

      rawData.forEach(row => {
          // Mapping Index: 0=ID, 1=Tgl, 2=Channel, 3=Kurir, 4=Resi, 6=Nama, 8=Variasi, 9=Qty, 11=Total, 14=Status
          const id = row[0];

          if (!grouped[id]) {
              grouped[id] = {
                  id: row[0],
                  date: row[1],
                  channel: row[2],
                  courier: row[3],
                  resi: row[4],
                  status: row[14],
                  items: [],
                  totalOmset: 0,
                  searchString: "" // String gabungan untuk pencarian cepat
              };
              orderIds.push(id);
          }

          grouped[id].items.push({
              name: row[6],
              variant: row[8],
              qty: parseInt(row[9]) || 0
          });

          grouped[id].totalOmset += (parseNumber(row[11]) || 0);
          grouped[id].totalHpp = (grouped[id].totalHpp || 0) + (parseNumber(row[13]) || 0);

          // Gabungkan teks untuk pencarian (ID + Resi + Nama Produk + Variasi + Customer + Channel + Kurir)
          grouped[id].searchString += `${row[0]} ${row[4]} ${row[6]} ${row[8]} ${row[21]} ${row[2]} ${row[3]} `.toLowerCase();
      });

      // Konversi Object ke Array agar bisa dipaginasi
      ALL_ORDERS_CACHE = orderIds.map(id => grouped[id]);

      // Reset Filter & Halaman
      FILTERED_ORDERS = [...ALL_ORDERS_CACHE];
      ORDER_PAGE = 1;

      renderOrderPagination();
  }

      const startIndex = (ORDER_PAGE - 1) * ORDER_LIMIT;

  function updateFooterUI(start, end, total) {

      const total = FILTERED_ORDERS.length;

      if (ORDER_PAGE < maxPage) {
          ORDER_PAGE++;
          renderOrderPagination();
      }
  }

  function prevOrderPage() {
      if (ORDER_PAGE > 1) {
          ORDER_PAGE--;
          renderOrderPagination();

  // 6. FUNGSI SEARCH (PENCARIAN CEPAT DI ARRAY)
  function filterOrderTable() {
    const input = document.getElementById('searchOrderBox');
    const keyword = input ? input.value.toLowerCase().trim() : '';

    FILTERED_ORDERS = ALL_ORDERS_CACHE.filter(order => {
        // 1. Cek Keyword (cari di searchString yang sudah lengkap)
        const matchKeyword = !keyword || order.searchString.includes(keyword);

        // 2. Cek Channel (contains match, case-insensitive)
        var orderCh = (order.channel || '').toLowerCase();
        var matchChannel = FILTER_SELECTED_CHANNELS.size === 0 || Array.from(FILTER_SELECTED_CHANNELS).some(function(ch) {
          var filterCh = ch.toLowerCase();
          return orderCh.includes(filterCh) || filterCh.includes(orderCh);
        });

        return matchKeyword && matchChannel;
    });

    ORDER_PAGE = 1; // Reset ke halaman 1
    renderOrderPagination();
  }

  // --- LACAK RESI (BinderByte via Backend) ---
  function openTrackingModal(resi) {
    if (!resi || resi === '-') return;

    Swal.fire({
      title: '',
      html: `
        <div class="text-center py-8">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-100 mb-4">
            <svg class="w-6 h-6 text-emerald-600 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
          </div>
          <div class="text-sm font-bold text-slate-700">Melacak resi...</div>

        </div>`,
      showConfirmButton: false,
      allowOutsideClick: true,
      customClass: { popup: 'rounded-2xl' }
    });

    // OPTIMASI: Langsung fetch ke PHP (skip GAS middleman, 2-3× lebih cepat)
    var cleanResi = resi.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    var trackingUrl = (appConfig && appConfig.tracking_api_url) || 'https://dataeasy.web.id/api/tracking.php';
    
    fetch(trackingUrl + '?awb=' + cleanResi)
      .then(function(response) { return response.json(); })
      .then(function(res) {
        if (!res.success) {
          Swal.fire({ icon: 'warning', title: 'Tidak Ditemukan', text: res.message, confirmButtonColor: '#4F46E5' });
          return;
        }
        renderTrackingModal(resi, res);
      })
      .catch(function(err) {
        // Fallback ke GAS jika fetch langsung gagal (CORS issue, dll)
        google.script.run
          .withSuccessHandler(function(res) {
            if (!res.success) {
              Swal.fire({ icon: 'warning', title: 'Tidak Ditemukan', text: res.message, confirmButtonColor: '#4F46E5' });
              return;
            }
            renderTrackingModal(resi, res);
          })
          .withFailureHandler(function(e) {
            Swal.fire({ icon: 'error', title: 'Gagal', text: e.message || 'Tidak dapat melacak resi', confirmButtonColor: '#4F46E5' });
          })
          .trackResi(resi);
      });
  }

  // 4. FUNGSI EDIT ORDER (SIMPLE)
  function editOrder(orderId) {
    // Tampilkan Loading
    Swal.fire({ title: 'Memuat Data Order...', didOpen: () => Swal.showLoading() });

    google.script.run.withSuccessHandler(function(response) {
      Swal.close();

      // [PERBAIKAN PENTING] Cek apakah response ada isinya
      if (!response) {
         Swal.fire('Error Sistem', 'Server tidak merespon (Null Data). Coba refresh halaman.', 'error');
         return;
      }

      if (!response.success) {
        Swal.fire('Gagal Memuat', response.message, 'error');
        return;
      }

      const h = response.header;
      const items = response.items;

      // 1. BUKA MODAL INPUT (Sama seperti buat pesanan baru)
      openInputOrderModal();

      // 2. ISI FIELD HEADER
      document.getElementById('orderId').value = h.id;
      document.getElementById('orderChannel').value = h.channel;
      document.getElementById('orderCourier').value = h.kurir;
      document.getElementById('orderResi').value = h.resi;

      // [TAMBAHAN] ISI DATA CUSTOMER KE FORM EDIT
      document.getElementById('orderCustName').value = h.custName || '';
      document.getElementById('orderCustPhone').value = h.custPhone || '62';
      document.getElementById('orderCustAddress').value = h.custAddress || '';
      document.getElementById('orderOngkir').value = formatCurrencyValue(h.ongkir);
      
      // Isi Search Kecamatan (Jika ada)
      if(h.kecamatan) {
          document.getElementById('orderKecamatanSearch').value = h.kecamatan;
          // Opsional: Simpan full string kecamatan agar saat save ulang tidak hilang
      }
      
      // Update Tampilan Dropdown Custom
      if(document.getElementById('dd-channel-display')) 
          document.getElementById('dd-channel-display').innerHTML = `<span class="text-sm font-bold text-slate-800">${h.channel}</span>`;
      
      if(document.getElementById('dd-courier-display'))
          document.getElementById('dd-courier-display').innerHTML = `<span class="text-sm font-bold text-slate-800">${h.kurir}</span>`;

      // Set Tanggal
      const fpEl = document.querySelector("#orderDate");
      if(fpEl && fpEl._flatpickr) fpEl._flatpickr.setDate(h.tgl);

      // Kunci ID Pesanan
      const idInput = document.getElementById('orderId');
      if(idInput) {
          idInput.readOnly = true;
          idInput.style.backgroundColor = "#f3f4f6"; 
      }

      // 3. SET STATE KE MODE EDIT
      IS_ORDER_EDIT_MODE = true;
      EDIT_ORDER_ID_REF = h.id;
      EDIT_ORDER_DATE_REF = h.tgl;

      // 4. ISI KERANJANG (CART)
      ORDER_CART = []; 
      
      items.forEach(item => {
          ORDER_CART.push({
              skuInduk: item.skuInduk,
              skuVariasi: item.skuVariasi || item.skuInduk,
              namaProduk: item.namaProduk,
              variasi: item.variasi,
              stokTersedia: 999, // Bypass stok visual saat edit
              qty: item.qty,
              hargaBeli: item.hpp,
              hargaJual: item.hargaJual,
              diskon: item.diskon,
              img: item.img || "" 
          });
      });

      // Render Tabel Keranjang
      renderOrderCart();

      // 5. UBAH TOMBOL SIMPAN
      const btnSave = document.getElementById('btnSaveOrder');
      if(btnSave) {
          btnSave.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> UPDATE PERUBAHAN';
          btnSave.classList.remove('bg-blue-600', 'hover:bg-blue-700');
          btnSave.classList.add('bg-amber-500', 'hover:bg-amber-600'); 
      }

      // Beri notifikasi kecil
      Swal.fire({
        toast: true, position: 'top-end', icon: 'info', 
        title: 'Mode Edit Aktif', text: 'Silakan ubah item dan klik Update.',
        timer: 3000, showConfirmButton: false
      });

    }).withFailureHandler(function(error) {
       Swal.close();
       console.error(error);
       Swal.fire('Error Koneksi', error.message, 'error');
    }).getFullOrderDetails(orderId);
  }

  // HELPER WARNA CHANNEL
  function getChannelStyle(channelName) {
      if(!channelName) return 'bg-gray-100 text-gray-600 border-gray-200';

      const c = channelName.toLowerCase();
      if(c.includes('shopee')) return 'bg-orange-50 text-orange-600 border-orange-100';

  // D. SEARCH PRODUK (LIVE SEARCH DI MODAL)
  function handleOrderProductSearch(input) {
      const keyword = input.value.toLowerCase();
      const dropdown = document.getElementById('orderProductDropdown');

      // Safety check: Pastikan elemen ada
      if(!dropdown) {
          console.error("Dropdown element not found!");
          return;
      }

      // 1. Cek Apakah Data Produk Ada?
      if (!productList || productList.length === 0) {
          dropdown.innerHTML = '<div class="p-3 text-xs text-red-500 text-center">Data produk belum siap. Coba refresh halaman.</div>';
          dropdown.classList.remove('hidden');
          return;
      }

      // 2. Syarat Minimal 1 Karakter (Biar lebih responsif)
      if (keyword.length < 1) {
          dropdown.classList.add('hidden');
          return;
      }

      // 3. Filter Data (Dengan Safety Check per Baris)
      const matches = productList.filter(row => {
          // Pastikan baris data valid (tidak null/undefined)
          if (!row) return false;

          // [1]=Nama, [3]=SKU, [4]=Varian (Gabungkan jadi satu string pencarian)
          const name = String(row[1] || "").toLowerCase();
          const sku = String(row[3] || "").toLowerCase();
          const varName = String(row[4] || "").toLowerCase();

          return name.includes(keyword) || sku.includes(keyword) || varName.includes(keyword);
      }).slice(0, 10); // Ambil 10 hasil teratas

      // 4. Render Hasil
      dropdown.innerHTML = '';

      if (matches.length === 0) {
          dropdown.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center italic">Produk tidak ditemukan</div>';
      } else {
          matches.forEach(row => {
              // Siapkan data tampilan
              const stock = parseNumber(row[7]);
              const imgUrl = row[14] || row[13];
              // Nama + Varian
              const displayName = row[1] + (row[4] && row[4] !== '-' && row[4] !== 'Single' ? ` (${row[4]})` : '');

              // Styling Stok
              let stockBadge = stock > 0
                  ? `<span class="text-[10px] px-2 py-0.5 rounded bg-emerald-100 text-emerald-700 font-bold border border-emerald-200">Sisa ${stock}</span>`
                  : `<span class="text-[10px] px-2 py-0.5 rounded bg-rose-100 text-rose-700 font-bold border border-rose-200">Habis</span>`;

              // Gambar Placeholder jika kosong
              const imgHtml = imgUrl
                  ? `<img src="${imgUrl}" class="w-full h-full object-cover">`
                  : `<div class="w-full h-full flex items-center justify-center bg-slate-100 text-slate-400"><i data-lucide="image" class="w-4 h-4"></i></div>`;

              const item = document.createElement('div');
              item.className = "p-2.5 hover:bg-blue-50 cursor-pointer flex items-center gap-3 border-b border-gray-50 last:border-0 transition group";

              // Event Klik: Pilih Produk
              item.onclick = () => selectOrderProduct(row);

              item.innerHTML = `
                  <div class="w-10 h-10 rounded-lg border border-gray-200 overflow-hidden shrink-0 bg-white shadow-sm">
                      ${imgHtml}
                  </div>
                  <div class="flex-1 min-w-0">
                      <div class="text-sm font-bold text-slate-700 truncate group-hover:text-blue-600 transition">${displayName}</div>
                      <div class="flex justify-between items-center mt-1">
                          <span class="text-[10px] font-mono bg-gray-100 px-1.5 rounded text-slate-500 border border-gray-200">${row[3]}</span>
                          ${stockBadge}
                      </div>
                  </div>
              `;
              dropdown.appendChild(item);
          });

          // Render icon lucide di dalam dropdown
          if(window.lucide) lucide.createIcons({ root: dropdown });
      }

      dropdown.classList.remove('hidden');
  }

  // E. SAAT PRODUK DIPILIH
  // --- GLOBAL VARIABLE BARU ---
  let ORDER_CART = [];

  // 1. UPDATE: SAAT PRODUK DIPILIH DARI PENCARIAN
  function selectOrderProduct(row) {
      // Mapping Index Master Produk:
      // [0]=SkuInduk, [1]=Nama, [3]=SkuVar, [4]=VarName, [7]=Stok, [9]=HPP, [11]=HargaJual, [14]=Img

      const skuVar = row[3];
      const stok = parseNumber(row[7]);

      // AMBIL HARGA
      const hpp = parseNumber(row[9]);      // Kolom J (Index 9)
      const jual = parseNumber(row[11]);    // Kolom L (Index 11)

      if (stok <= 0) {
          Swal.fire('Stok Habis', 'Produk ini stoknya 0.', 'error'); return;
      }

      const existingItem = ORDER_CART.find(item => item.skuVariasi === skuVar);
      if (existingItem) {
          Swal.fire('Sudah Ada', 'Produk sudah ada di keranjang.', 'warning'); return;
      }

      ORDER_CART.push({
          skuInduk: row[0],
          skuVariasi: skuVar,
          namaProduk: row[1],
          variasi: row[4] || '-',
          stokTersedia: stok,
          qty: 1,

          // SIMPAN DATA HARGA
          hargaBeli: hpp,
          hargaJual: jual,

          img: row[14]
      });

      // Reset UI Search
      document.getElementById('orderSearchProduct').value = '';
      document.getElementById('orderProductDropdown').classList.add('hidden');

      renderOrderCart();
  }

          html += `

              <button type="button" onclick="deleteCartItem(${index})" class="md:hidden absolute top-3 right-3 text-gray-300 hover:text-red-500 p-1">

                      <div class="text-[10px] text-slate-400 mt-1 font-mono flex flex-wrap gap-1">

                      </div>
                      <div class="md:hidden text-[11px] text-emerald-600 font-bold mt-1">
                          @ ${formatRupiah(item.hargaJual)}
                      </div>
                  </div>
              </div>

              <div class="w-full md:col-span-4 flex items-center gap-3 mb-3 md:mb-0">
                  
                  <div class="flex-1">
                      <label class="md:hidden text-[9px] font-bold text-slate-400 uppercase mb-1 block">Qty</label>
                      <div class="flex items-center border border-gray-200 rounded-lg overflow-hidden h-[38px] bg-white shadow-sm">
                          <button type="button" onclick="updateQty(${index}, -1)" class="w-10 h-full bg-gray-50 hover:bg-gray-200 border-r border-gray-200 text-slate-600 flex items-center justify-center active:bg-gray-300 transition">
                              <i data-lucide="minus" class="w-4 h-4"></i>
                          </button>
                          <input type="number" value="${item.qty}" min="1" max="${item.stokTersedia}" onchange="updateQtyManual(${index}, this.value)" class="w-full h-full text-center text-sm font-bold text-slate-800 outline-none p-0 focus:bg-blue-50 appearance-none">
                          <button type="button" onclick="updateQty(${index}, 1)" class="w-10 h-full bg-gray-50 hover:bg-gray-200 border-l border-gray-200 text-slate-600 flex items-center justify-center active:bg-gray-300 transition">
                              <i data-lucide="plus" class="w-4 h-4"></i>
