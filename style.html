<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      darkMode: 'class', // <--- PENTING: Tambahkan ini agar browser TIDAK otomatis mode gelap
      theme: {
        extend: {
          // Menggabungkan Font & Animasi agar tampilan tetap rapi
          fontFamily: { 
            sans: ['"Source Sans 3"', '"Plus Jakarta Sans"', 'sans-serif'] 
          },
          colors: { sidebar: '#1e293b', header: '#0f172a', active: '#4f46e5' },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'slide-up': 'slideUp 0.5s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>

<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
  /* FORCE FONT GLOBAL */
  body, input, select, button, textarea, table, th, td {
    font-family: "Source Sans 3", sans-serif !important;
    -webkit-tap-highlight-color: transparent;
  }

  /* FIX: Mobile viewport height (address bar browser) */
  html, body {
    height: 100vh;
    height: 100dvh; /* Dynamic viewport height - prevents cut-off by mobile address bar */
  }

  /* Custom Input */
  .custom-input {
    height: 50px;
    border-radius: 0.5rem;
    border: 1px solid #e2e8f0;
    background-color: #f8fafc;
    padding: 0 1rem;
    font-size: 0.875rem;
    color: #334155;
    transition: all 0.2s;
    width: 100%;
  }
  .custom-input:focus {
    outline: none;
    border-color: #4F46E5;
    background-color: #fff;
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
  }

  /* Navigation Active State */
  .nav-item.active {
    background-color: #4F46E5;
    color: white;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .nav-item.active i { color: white; opacity: 1; }
  .nav-item:hover:not(.active) { background-color: rgba(255,255,255,0.05); }

  /* Utilities */
  .glass-effect { backdrop-filter: blur(4px); }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

  /* Scrollbar Halus */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* HIDE NUMBER SPINNER (PANAH NAIK TURUN) */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type=number] {
    -moz-appearance: textfield; /* Firefox */
  }

  /* OVERRIDE SWEETALERT2 AGAR LEBIH MODERN */
    div:where(.swal2-container) {
        z-index: 9999 !important; /* Pastikan selalu di atas */
    }

    div:where(.swal2-popup) {
        font-family: inherit !important; /* Ikuti font website */
        border-radius: 16px !important; /* Rounded-2xl */
        padding: 2rem !important;
        box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25) !important;
    }

    div:where(.swal2-title) {
        font-size: 1.25rem !important; /* Text-xl */
        font-weight: 700 !important;
        color: #1e293b !important; /* Slate-800 */
    }

    div:where(.swal2-html-container) {
        font-size: 0.875rem !important; /* Text-sm */
        color: #64748b !important; /* Slate-500 */
    }

    /* Custom Loading Background */
    .modern-loading-popup {
        background: transparent !important;
        box-shadow: none !important;
    }
  
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    .animate-fade-in {
        animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
        animation: fadeInUp 0.5s ease-out forwards;
    }

    /* 2. STYLE ANIMASI LOGIN */
    @keyframes blob-bounce {
        0% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0, 0) scale(1); }
    }
    .animate-blob {
        animation: blob-bounce 10s infinite alternate;
    }

    @keyframes fade-in-up {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up {
        animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* === SPLASH SCREEN LOADING === */
    #splash-screen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #splash-screen.fade-out { opacity: 0; visibility: hidden; }

    .splash-logo {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 20px 60px rgba(79,70,229,0.4);
      animation: splash-bounce 1.2s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    .splash-logo svg { width: 36px; height: 36px; color: white; }

    .splash-title {
      margin-top: 24px; font-size: 22px; font-weight: 800; color: white;
      letter-spacing: -0.02em; opacity: 0;
      animation: splash-text 0.8s 0.3s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    .splash-subtitle {
      margin-top: 6px; font-size: 12px; font-weight: 600; color: #6366f1;
      text-transform: uppercase; letter-spacing: 0.15em; opacity: 0;
      animation: splash-text 0.8s 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    .splash-bar-track {
      margin-top: 32px; width: 180px; height: 3px; border-radius: 99px;
      background: rgba(255,255,255,0.08); overflow: hidden; opacity: 0;
      animation: splash-text 0.6s 0.7s ease forwards;
    }
    .splash-bar-fill {
      height: 100%; width: 0; border-radius: 99px;
      background: linear-gradient(90deg, #4f46e5, #7c3aed, #4f46e5);
      background-size: 200% 100%;
      animation: splash-progress 1.8s 0.9s ease-in-out forwards, splash-shimmer 1s linear infinite;
    }

    .splash-dots { margin-top: 16px; display: flex; gap: 6px; opacity: 0; animation: splash-text 0.6s 0.8s ease forwards; }
    .splash-dot {
      width: 6px; height: 6px; border-radius: 50%; background: #4f46e5;
      animation: splash-pulse 1.2s ease-in-out infinite;
    }
    .splash-dot:nth-child(2) { animation-delay: 0.2s; }
    .splash-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes splash-bounce {
      0% { opacity: 0; transform: scale(0.3) translateY(40px); }
      60% { transform: scale(1.08) translateY(-4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes splash-text {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes splash-progress {
      0% { width: 0; }
      50% { width: 70%; }
      100% { width: 100%; }
    }
    @keyframes splash-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes splash-pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Efek Fokus Input */
    .login-input-group:focus-within label { color: #4f46e5; }
    .login-input-group:focus-within i { color: #4f46e5; }

    /* Active State untuk Sub-Menu */
    .sub-nav-item.active {
      background-color: rgba(255, 255, 255, 0.1) !important; /* Latar transparan */
      color: #ffffff !important; /* Teks Putih */
      font-weight: 700 !important; /* Teks Tebal */
      border-right: 3px solid #6366f1; /* Garis ungu di kanan */
    }

    /* --- STYLING SIDEBAR MINI (ICON ONLY) --- */
  
    /* 1. Perkecil Lebar Sidebar */
    #sidebar.collapsed {
        width: 72px !important;
    }

    /* 2. Sembunyikan Teks Label, Judul, dan Panah */
    #sidebar.collapsed span, 
    #sidebar.collapsed h1, 
    #sidebar.collapsed p,
    #sidebar.collapsed .chevron,
    #sidebar.collapsed .tracking-widest, /* Judul Section */
    #sidebar.collapsed #sidebar-user-name { /* Nama User di bawah */
        display: none !important; 
    }

    /* 3. Tengahkan Icon Menu */
    #sidebar.collapsed .nav-item {
        justify-content: center !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }
    #sidebar.collapsed .nav-item i {
        margin-right: 0 !important;
    }

    /* 4. Rapikan Header (Collapsed) */
    #sidebar.collapsed > div:first-child {
        padding: 12px 0 !important;
        justify-content: center !important;
    }
    #sidebar.collapsed > div:first-child > div {
        justify-content: center !important;
    }
    #sidebar.collapsed > div:first-child > div > div:last-child {
        display: none !important;
    }
    
    /* 5. Sembunyikan Submenu yang sedang terbuka */
    #sidebar.collapsed div[id^="submenu-"] {
        display: none !important;
    }

    /* --- FIX SIDEBAR FOOTER (COLLAPSED MODE) --- */
  
    /* 1. Atur Container Footer agar vertikal & tengah */
    #sidebar.collapsed > div:last-child {
        padding: 10px 4px !important;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* 2. Sembunyikan Detail yang tidak perlu */
    #sidebar.collapsed #sidebar-user-name,
    #sidebar.collapsed #sidebar-user-role,
    #sidebar.collapsed .text-emerald-500,
    #sidebar.collapsed .w-0\.5 {
        display: none !important;
    }

    /* 3. Atur Baris Profil (Hanya Gambar) */
    #sidebar.collapsed > div:last-child > div {
        flex-direction: column !important;
        align-items: center !important;
        gap: 8px !important;
    }
    
    #sidebar.collapsed > div:last-child img {
        margin: 0 auto !important;
        width: 32px !important;
        height: 32px !important;
    }

    /* 4. Tombol-tombol footer collapsed */
    #sidebar.collapsed > div:last-child .shrink-0 {
        flex-direction: column !important;
        gap: 2px !important;
    }

    /* --- MOBILE SIDEBAR FIX --- */
    @media (max-width: 767px) {
        #sidebar {
            padding-top: 0 !important;
            max-height: 100vh !important;
            max-height: 100dvh !important; /* Dynamic viewport height (modern browsers) */
        }
    }

    /* ======================================================= */
  /* --- AUTO DARK MODE MAGIC (OVERRIDE SYSTEM) --- */
  /* ======================================================= */
  /* Script ini memaksa tampilan menjadi gelap saat class 'dark' aktif */
  /* Tanpa perlu edit HTML satu per satu */

  /* 1. Background Utama (Body & Main Container) */
  .dark body, 
  .dark main, 
  .dark #main-container,
  .dark .view-section { 
      background-color: #0f172a !important; /* Slate-900 (Sangat Gelap) */
      color: #e2e8f0 !important; /* Teks Terang */
  }

  /* 2. Kartu / Card / Container Putih */
  .dark .bg-white,
  .dark .bg-white\/80 { 
      background-color: #1e293b !important; /* Slate-800 (Card Gelap) */
      border-color: #334155 !important;     /* Border Samar */
      color: #f8fafc !important;            /* Teks Putih */
      box-shadow: none !important;          /* Hilangkan bayangan biar flat */
  }

  /* 3. Background Abu-abu Muda (Header Tabel, Sidebar Item, dll) */
  .dark .bg-gray-50, 
  .dark .bg-slate-50, 
  .dark .bg-gray-100 { 
      background-color: #0f172a !important; /* Samakan dengan background utama */
      border-color: #334155 !important;
  }

  /* 4. Teks Judul & Label (Hitam -> Putih) */
  .dark .text-slate-800, 
  .dark .text-slate-700, 
  .dark .text-gray-800, 
  .dark .text-gray-700 { 
      color: #f1f5f9 !important; /* Slate-100 */
  }

  /* 5. Teks Deskripsi (Abu -> Abu Terang) */
  .dark .text-slate-500, 
  .dark .text-slate-600, 
  .dark .text-gray-500, 
  .dark .text-gray-600 { 
      color: #94a3b8 !important; /* Slate-400 */
  }

  /* 6. Form Input & Select (Otomatis Gelap) */
  .dark input:not([type="checkbox"]):not([type="radio"]), 
  .dark select, 
  .dark textarea,
  .dark .custom-input { 
      background-color: #334155 !important; /* Slate-700 */
      border-color: #475569 !important;     /* Slate-600 */
      color: #ffffff !important; 
  }
  .dark input::placeholder { color: #94a3b8 !important; }

  /* 7. Garis Pembatas (Border) */
  .dark .border-gray-100, 
  .dark .border-gray-200,
  .dark .border-slate-100, 
  .dark .border-slate-200,
  .dark .divide-gray-100 > * + * { 
      border-color: #334155 !important; /* Slate-700 */
  }

  /* 8. Tabel Hover Effect */
  .dark tr:hover td,
  .dark .group:hover { 
      background-color: #334155 !important; /* Highlight saat hover */
  }
  
  /* 9. SweetAlert (Pop-up) Gelap */
  .dark div:where(.swal2-popup) {
      background: #1e293b !important;
      color: #f8fafc !important;
      border: 1px solid #334155;
  }
  .dark div:where(.swal2-title) { color: #f8fafc !important; }
  .dark div:where(.swal2-html-container) { color: #cbd5e1 !important; }

  /* --- INVOICE MODERN STYLING --- */
  .invoice-container {
      background: white;
      padding: 40px;
      width: 100%;
      max-width: 210mm; /* Lebar A4 */
      margin: 0 auto;
      font-family: 'Inter', sans-serif; /* Font Modern */
      color: #334155; /* Slate-700 */
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); /* Bayangan halus di preview */
  }

  .invoice-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 40px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 20px;
  }

  .invoice-logo {
      max-height: 60px; /* Batasi tinggi logo biar proporsional */
      max-width: 180px;
      object-fit: contain;
  }

  .invoice-title {
      font-size: 32px;
      font-weight: 800;
      color: #1e293b; /* Slate-800 */
      text-transform: uppercase;
      letter-spacing: -0.5px;
      text-align: right;
  }

  .invoice-meta {
      text-align: right;
      font-size: 14px;
      color: #64748b;
      margin-top: 5px;
  }

  .bill-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 40px;
  }

  .bill-section h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8; /* Slate-400 */
      font-weight: 700;
      margin-bottom: 8px;
  }

  .bill-section p {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      margin: 0;
  }

  .invoice-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
  }

  .invoice-table th {
      text-align: left;
      padding: 12px 0;
      border-bottom: 2px solid #e2e8f0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      font-weight: 700;
  }

  .invoice-table td {
      padding: 16px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
      font-weight: 500;
  }
  
  .invoice-table tr:last-child td {
      border-bottom: none;
  }

  .invoice-total-box {
      width: 40%;
      margin-left: auto;
      background: #f8fafc; /* Slate-50 */
      padding: 20px;
      border-radius: 8px;
  }

  .total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      color: #64748b;
  }

  .total-row.final {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px solid #e2e8f0;
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
  }

  /* =========================================
     PERBAIKAN CETAK (PRINT) INVOICE - FINAL V2
     Ganti seluruh bagian @media print dengan ini
     ========================================= */

  @media print {
    /* 1. ATUR HALAMAN A4 */
    @page {
      size: A4 portrait; /* Paksa ukuran A4 */
      margin: 0;         /* Hilangkan margin browser */
    }

    /* 2. RESET BODY HTML AGAR TIDAK ADA HALAMAN KOSONG */
    html, body {
      width: 210mm !important; /* Lebar A4 Pas */
      height: 100% !important;
      background-color: #fff !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important; /* Cegah scrollbar memicu halaman kosong */
    }

    /* 3. SEMBUNYIKAN SEMUA ELEMEN APLIKASI */
    body * {
      visibility: hidden;
    }

    /* 4. TAMPILKAN & POSISIKAN INVOICE */
    #invoice-overlay, 
    #invoice-overlay * {
      visibility: visible;
    }

    #invoice-overlay {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      width: 210mm !important; /* Kunci lebar agar tidak melebar */
      margin: 0 !important;
      padding: 0 !important;
      background: white !important;
      z-index: 9999 !important;
    }

    /* 5. STYLE KERTAS INVOICE (MEMPERBAIKI TAMPILAN OLD STYLE) */
    #invoice-paper {
      width: 100% !important;
      margin: 0 !important;
      padding: 15mm !important; /* Padding kertas A4 */
      box-shadow: none !important;
      border: none !important;
      /* Paksa Font Keren Kamu Tetap Muncul */
      font-family: "Source Sans 3", "Plus Jakarta Sans", sans-serif !important; 
    }

    /* 6. PAKSA UKURAN FONT JUDUL (OVERRIDE TAILWIND) */
    /* Ini yang bikin tampilan tidak "Jeblok" besar */
    
    /* Judul INVOICE di kanan */
    #invoice-paper .text-4xl, 
    #invoice-paper .text-3xl {
      font-size: 24px !important; 
      line-height: 1.2 !important;
      font-weight: 800 !important;
      color: #1e293b !important; /* Warna Slate Tua */
    }

    /* Nama Toko */
    #inv-shop-name {
      font-size: 20px !important;
      color: #0f172a !important;
    }

    /* Header Tabel */
    #invoice-paper thead th {
      background-color: #f1f5f9 !important; /* Abu muda */
      color: #475569 !important; /* Abu tua */
      font-size: 10px !important;
      padding: 8px 4px !important;
      -webkit-print-color-adjust: exact !important; 
      print-color-adjust: exact !important;
    }
    
    /* Isi Tabel */
    #invoice-paper tbody td {
      font-size: 11px !important;
      padding: 8px 4px !important;
      border-bottom: 1px solid #e2e8f0 !important;
    }

    /* 7. HILANGKAN ELEMEN PENGGANGGU */
    .no-print, button, .btn, ::-webkit-scrollbar {
      display: none !important;
    }
  }
</style>
